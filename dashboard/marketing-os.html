  function overdue(t) {
    var k = stat(t).key;
    return isDate(t.due) && t.due < TODAY_ISO && k !== "faerdig" && k !== "droppet";
  }

  /* ====================== Validering ======================
     Flade data fejler i stilhed — en tastefejl giver en usynlig bjælke,
     ikke en fejlmeddelelse. Derfor fanges problemerne her og vises. */

  // Returnerer rå tekst — escaping sker ét sted, ved udskrivningen i render().
  function validate() {
    var problems = [], seen = {}, i, t;
    var projIds = {}, sprintKeys = {};

    for (i = 0; i < DATA.projects.length; i++) projIds[DATA.projects[i].id] = true;
    for (i = 0; i < DATA.sprints.length; i++) sprintKeys[DATA.sprints[i].project + "|" + DATA.sprints[i].month] = true;

    for (i = 0; i < DATA.sprints.length; i++) {
      if (!projIds[DATA.sprints[i].project]) problems.push("Sprint " + DATA.sprints[i].month + " peger på et ukendt projekt: " + DATA.sprints[i].project);
      if (!isMonth(DATA.sprints[i].month)) problems.push("Sprint i " + DATA.sprints[i].project + " har ugyldig måned: " + DATA.sprints[i].month);
    }

    for (i = 0; i < DATA.tasks.length; i++) {
      t = DATA.tasks[i];
      var id = t.id || "(uden id)";
      if (!t.id) problems.push("En opgave mangler id: " + t.title);
      else if (seen[t.id]) problems.push("Dublet-id: " + id + " findes mere end én gang");
      seen[t.id] = true;

      if (stat(t).key === "ukendt") problems.push(id + ": ukendt status „" + String(t.status == null ? "" : t.status) + "“ — vises i gult");
      if (!projIds[t.project]) problems.push(id + ": ukendt projekt " + t.project + " — opgaven er usynlig overalt");
      if (t.sprint && !sprintKeys[t.project + "|" + t.sprint]) problems.push(id + ": sprint " + t.sprint + " findes ikke for projektet — vises i tidslinjen, men i ingen sprint");
      if (t.start && !isMonth(t.start)) problems.push(id + ": start er ikke ÅÅÅÅ-MM (" + t.start + ")");
      if (t.end && !isMonth(t.end)) problems.push(id + ": end er ikke ÅÅÅÅ-MM (" + t.end + ")");
      if (t.due && !isDate(t.due)) problems.push(id + ": due er ikke ÅÅÅÅ-MM-DD (" + t.due + ")");
      if (isMonth(t.start) && isMonth(t.end) && mi(t.end) < mi(t.start)) problems.push(id + ": end (" + t.end + ") ligger før start (" + t.start + ")");
      if (!span(t)) problems.push(id + ": hverken start eller sprint er en gyldig måned — kan ikke placeres på tidslinjen");
    }
    return problems;
  }

  /* ====================== Sidebar ====================== */

  function healthDot(tasks) {
    var i, k, anyOpen = false, anyGoing = false;
    for (i = 0; i < tasks.length; i++) {
      k = stat(tasks[i]).key;
      if (k === "blokeret" || overdue(tasks[i])) return "var(--st-blokeret)";
      if (k === "i-gang") anyGoing = true;
      if (k !== "faerdig" && k !== "droppet") anyOpen = true;
    }
    if (anyGoing) return "var(--st-i-gang)";
    if (!anyOpen && tasks.length) return "var(--st-faerdig)";
    return "var(--st-ikke-startet)";
  }

  function tasksOf(pid) {
    return DATA.tasks.filter(function (t) { return t.project === pid; });
  }

  function renderSidebar(active) {
    var m = capacity();
    var tone = m.free < -1 ? "crit" : (m.free < 2 ? "warn" : "good");
    document.getElementById("navtop").innerHTML =
      '<button class="proj" data-act="kapacitet" aria-current="' + (active === "kapacitet") + '">' +
        '<span class="dot ' + tone + '"></span>' +
        '<span><span class="pname">Kapacitet</span><br>' +
        '<span class="pmeta num">' + (m.free < 0 ? "−" : "") + fmt(Math.abs(m.free)) + " t fri · " +
        fmt(m.util * 100, 0) + " %</span></span></button>";

    var html = "";
    DATA.projects.forEach(function (p) {
      var ts = tasksOf(p.id);
      var open = ts.filter(function (t) { var k = stat(t).key; return k !== "faerdig" && k !== "droppet"; }).length;
      html += '<button class="proj" data-act="proj" data-id="' + esc(p.id) + '" aria-current="' + (p.id === active) + '">' +
                '<span class="dot" style="background:' + healthDot(ts) + '"></span>' +
                '<span><span class="pname">' + esc(p.name) + '</span><br>' +
                '<span class="pmeta num">' + (ts.length ? open + " åbne · " + ts.length + " i alt" : "ingen opgaver") + '</span></span>' +
              '</button>';
    });
    html += '<button class="proj add" data-act="newproj" type="button"><span class="plus">+</span>' +
            '<span class="pname">Nyt projekt</span></button>';
    document.getElementById("projlist").innerHTML = html;
    document.getElementById("sidefoot").innerHTML =
      "Opdateret<br><b class=\"num\">" + esc(DATA.meta.updated || "—") + "</b>" +
      (dirty ? '<br><span class="unsaved">● ugemte ændringer</span>' : "") +
      "<br><br>" + (HOSTED ? "Kører på nettet — gemmer i skyen."
                   : SERVER ? "Kører på localhost — gemmer lydløst." : "Åbnet som fil — Gem spørger én gang pr. session.") +
      '<div class="sf-acts">' +
        '<button class="sf-link" data-act="export" type="button">Download datafil</button>' +
        (SERVER ? '<button class="sf-link" data-act="import" type="button">Hent datafil ind</button>' : "") +
        (HOSTED ? '<a class="sf-link" href="historik">Historik</a>' : "") +
      "</div>";
  }

  /* ====================== Sprintvisning ====================== */

  function pickSprint(sprints) {
    // aktuel måned → ellers næste fremtidige → ellers seneste forgangne
    var cur = null, next = null, past = null, i, m;
    for (i = 0; i < sprints.length; i++) {
      if (!isMonth(sprints[i].month)) continue;
      m = mi(sprints[i].month);
      if (m === TODAY_MI) cur = sprints[i];
      else if (m > TODAY_MI) { if (!next || m < mi(next.month)) next = sprints[i]; }
      else { if (!past || m > mi(past.month)) past = sprints[i]; }
    }
    if (cur) return { s: cur, tag: "Aktuel", now: true };
    if (next) return { s: next, tag: "Kommende", now: false };
    if (past) return { s: past, tag: "Seneste", now: false };
    return null;
  }

  function taskCard(t) {
    var st = stat(t), od = overdue(t);
    var meta = [];
    if (t.epic) meta.push('<span class="ep" title="' + esc(epicName(t)) + '">' + esc(t.epic) + "</span>");
    if (t.owner) meta.push(esc(t.owner));
    if (isDate(t.due)) meta.push('<span class="due' + (od ? " over" : "") + '">' + (od ? icon("alert") : "") + fmtDate(t.due) + "</span>");
    return '<div class="tcard" data-act="task" data-id="' + esc(t.id) + '" tabindex="0" style="border-left-color:var(--' + st.css + ')">' +
             '<div class="tt">' + esc(t.title) + "</div>" +
             (meta.length ? '<div class="tm">' + meta.join(" · ") + "</div>" : "") +
             (t.note ? '<div class="tnote">' + esc(t.note) + "</div>" : "") +
           "</div>";
  }

  function renderSprint(p) {
    var sprints = DATA.sprints.filter(function (s) { return s.project === p.id; });
    var pick = pickSprint(sprints);

    if (!pick) {
      return '<section id="sprint"><div class="sec-label">Sprint</div>' +
             '<div class="empty"><p>Ingen sprints oprettet for ' + esc(p.name) + " endnu.</p>" +
             '<p><button class="btn primary" data-act="newsprint" type="button">Opret den første sprint</button></p></div></section>';
    }

    var s = pick.s;
    var ts = tasksOf(p.id).filter(function (t) { return t.sprint === s.month; });
    var counted = ts.filter(function (t) { return stat(t).key !== "droppet"; });
    var done = counted.filter(function (t) { return stat(t).key === "faerdig"; }).length;
    var pct = counted.length ? Math.round(done / counted.length * 100) : 0;
    var blocked = ts.filter(function (t) { return stat(t).key === "blokeret"; }).length;
    var od = ts.filter(overdue).length;

    var head = '<div class="sprint-head"><h2>' + esc(p.name) + " — " + miLabel(mi(s.month), true) + "</h2>" +
               '<span class="tag' + (pick.now ? " now" : "") + '">' + pick.tag + "</span>" +
               '<button class="icon-btn" data-act="editsprint" data-month="' + esc(s.month) + '" type="button" title="Rediger sprint" aria-label="Rediger sprint">' + icon("pencil") + '</button>' +
               '<span style="flex:1"></span>' +
               '<button class="btn" data-act="newtask" data-month="' + esc(s.month) + '" type="button">+ Ny opgave</button>' +
               '<button class="btn" data-act="newsprint" type="button">+ Ny sprint</button></div>';

    var goal = s.goal
      ? '<p class="goal">' + esc(s.goal) + "</p>"
      : '<p class="goal empty">Intet sprintmål skrevet endnu.</p>';

    var bits = [];
    if (counted.length) bits.push('<span class="meter-txt num">' + done + " af " + counted.length + " færdige</span>");
    if (pick.now) bits.push('<span class="meter-txt num">' + (daysIn(NOW.getFullYear(), NOW.getMonth()) - NOW.getDate()) + " dage tilbage af måneden</span>");
    if (blocked) bits.push('<span class="chip alarm"><span class="dot" style="background:var(--st-blokeret)"></span><b>' + blocked + "</b> blokeret</span>");
    if (od) bits.push('<span class="chip alarm"><span class="dot" style="background:var(--st-blokeret)"></span><b>' + od + "</b> over deadline</span>");

    var meter = counted.length
      ? '<div class="meter"><div class="meter-track"><div class="meter-fill" style="width:' + pct + '%"></div></div>' + bits.join("") + "</div>"
      : (bits.length ? '<div class="meter">' + bits.join("") + "</div>" : "");

    var body;
    if (!ts.length) {
      body = '<div class="col-empty" style="font-size:13.5px">Ingen opgaver lagt i sprinten endnu. ' +
             '<button class="btn" data-act="newtask" data-month="' + esc(s.month) + '" type="button">+ Tilføj den første</button></div>';
    } else {
      body = '<div class="kanban">';
      BOARD.forEach(function (k) {
        var col = ts.filter(function (t) { return stat(t).key === k; });
        body += '<div><div class="col-head"><span class="dot" style="background:var(--st-' + k + ')"></span>' +
                LABEL[k] + '<span class="cnt num">' + col.length + "</span></div>" +
                (col.length ? col.map(taskCard).join("") : '<div class="col-empty">—</div>') + "</div>";
      });
      body += "</div>";
    }

    return '<section id="sprint"><div class="sec-label">Sprint</div>' +
           '<div class="card card-pad">' + head + goal + meter + body + "</div></section>";
  }

  /* ====================== Historik ====================== */

  function renderHistory(p) {
    var pick = pickSprint(DATA.sprints.filter(function (s) { return s.project === p.id; }));
    var shown = pick ? pick.s.month : null;
    var rest = DATA.sprints
      .filter(function (s) { return s.project === p.id && s.month !== shown && isMonth(s.month); })
      .sort(function (a, b) { return mi(b.month) - mi(a.month); });

    if (!rest.length) return "";

    var html = '<section id="historik"><div class="sec-label">Øvrige sprints</div>';
    rest.forEach(function (s) {
      var ts = tasksOf(p.id).filter(function (t) { return t.sprint === s.month; });
      var counted = ts.filter(function (t) { return stat(t).key !== "droppet"; });
      var done = counted.filter(function (t) { return stat(t).key === "faerdig"; }).length;
      html += '<details class="hist"><summary><b>' + miLabel(mi(s.month), true) + "</b>" +
              '<span class="num">' + done + "/" + counted.length + " færdige</span>" +
              (s.goal ? '<span class="g">„' + esc(s.goal) + "“</span>" : "") + "</summary>" +
              '<div class="hist-body">' +
              (ts.length ? ts.map(function (t) {
                var st = stat(t);
                return '<div class="hrow" data-act="task" data-id="' + esc(t.id) + '"><span class="dot" style="background:var(--' + st.css + ')"></span>' +
                       "<span>" + esc(t.title) + "</span>" +
                       '<span class="hd">' + st.label + (isDate(t.due) ? " · " + fmtDate(t.due) : "") + "</span></div>";
              }).join("") : '<div class="col-empty">Ingen opgaver i denne sprint.</div>') +
              "</div></details>";
    });
    return html + "</section>";
  }

  /* ====================== Gantt ====================== */

  /* ----- Visning af tidslinjen -----
     Filter, gruppering og sortering er visningsvalg, ikke data. Derfor lever de
     i browseren og aldrig i datafilen — ellers ville et filterskift gøre siden
     "ugemt" og lægge dine visningsvaner ind i indholdet. */

  var VIEWOPTS = { group: "none", show: "all", sort: "start", epic: "" };
  try {
    var savedView = JSON.parse(localStorage.getItem("mos-view") || "{}");
    Object.keys(VIEWOPTS).forEach(function (k) {
      if (typeof savedView[k] === "string") VIEWOPTS[k] = savedView[k];
    });
  } catch (e) {}
  function saveView() { try { localStorage.setItem("mos-view", JSON.stringify(VIEWOPTS)); } catch (e) {} }

  function groupKey(t) {
    var g = VIEWOPTS.group;
    if (g === "epic")   return t.epic || "␀";
    if (g === "status") return stat(t).key;
    if (g === "owner")  return t.owner || "␀";
    return "";
  }
  function groupName(k) {
    var g = VIEWOPTS.group;
    if (k === "␀") return g === "epic" ? "Uden epic" : "Uden ejer";
    if (g === "epic")   return (DATA.epics && DATA.epics[k]) ? k + " — " + DATA.epics[k] : k;
    if (g === "status") return LABEL[k] || k;
    return k;
  }
  function groupOrder(keys) {
    var g = VIEWOPTS.group, rank = {};
    if (g === "status") BOARD.concat(["droppet", "ukendt"]).forEach(function (k, i) { rank[k] = i; });
    else if (g === "epic") Object.keys(DATA.epics || {}).forEach(function (k, i) { rank[k] = i; });
    return keys.sort(function (a, b) {
      if (a === "␀") return 1;              // "uden …" altid nederst
      if (b === "␀") return -1;
      var ra = rank[a], rb = rank[b];
      if (ra != null && rb != null) return ra - rb;
      if (ra != null) return -1;
      if (rb != null) return 1;
      return String(a).localeCompare(String(b), "da");
    });
  }

  function ganttControls(epics, shown, total) {
    function sel(key, list) {
      return '<select id="view-' + key + '" data-view="' + key + '">' + list.map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (VIEWOPTS[key] === o[0] ? " selected" : "") + ">" + esc(o[1]) + "</option>";
      }).join("") + "</select>";
    }
    var html = '<div class="gctl">' +
      sel("group", [["none", "Ingen gruppering"], ["epic", "Gruppér: epic"], ["status", "Gruppér: status"], ["owner", "Gruppér: ejer"]]) +
      sel("show", [["all", "Alle opgaver"], ["open", "Kun åbne"], ["due", "Kun med deadline"], ["soon", "Forfalder inden 3 mdr."]]) +
      sel("sort", [["start", "Sortér: tidslinje"], ["due", "Sortér: deadline"], ["title", "Sortér: titel"]]);
    if (epics.length) {
      html += sel("epic", [["", "Alle epics"]].concat(epics.map(function (e) {
        return [e, (DATA.epics && DATA.epics[e]) ? e + " — " + DATA.epics[e] : e];
      })));
    }
    html += '<span class="gcount num">' + (shown < total ? shown + " af " + total : String(total)) + " opgaver</span>";
    if (shown < total || VIEWOPTS.group !== "none" || VIEWOPTS.sort !== "start") {
      html += '<button class="btn" data-act="viewreset" type="button">Nulstil visning</button>';
    }
    return html + "</div>";
  }

  function renderGantt(p) {
    var all = tasksOf(p.id).filter(function (t) { return span(t) !== null; });

    if (!all.length) {
      // repeat(0, …) er ugyldig CSS og ville vælte hele siden — så gitteret
      // bygges slet ikke, når der intet er at tegne.
      return '<section id="tidslinje"><div class="sec-label">Tidslinje</div>' +
             '<div class="empty"><p>Ingen opgaver at tegne for ' + esc(p.name) + ".</p>" +
             '<p><button class="btn primary" data-act="newtask" type="button">Tilføj den første opgave</button></p></div></section>';
    }

    var epics = [];
    all.forEach(function (t) { if (t.epic && epics.indexOf(t.epic) < 0) epics.push(t.epic); });
    // Et epic-filter fra et andet projekt må ikke tømme denne tidslinje
    var epicFilter = epics.indexOf(VIEWOPTS.epic) >= 0 ? VIEWOPTS.epic : "";
    var o = VIEWOPTS;

    var ts = all.filter(function (t) {
      if (epicFilter && t.epic !== epicFilter) return false;
      if (o.show === "open") return isLive(t);
      if (o.show === "due") return isDate(t.due);
      if (o.show === "soon") return isDate(t.due) && isLive(t) && mi(t.due.slice(0, 7)) <= TODAY_MI + 3;
      return true;
    }).sort(function (a, b) {
      if (o.sort === "due") {
        var A = isDate(a.due) ? a.due : "9999-99-99", B = isDate(b.due) ? b.due : "9999-99-99";
        if (A !== B) return A < B ? -1 : 1;
      } else if (o.sort === "title") {
        return String(a.title).localeCompare(String(b.title), "da");
      }
      var sa = span(a), sb = span(b);
      return (sa.a - sb.a) || (sa.b - sb.b) || String(a.title).localeCompare(String(b.title), "da");
    });

    var head = '<section id="tidslinje"><div class="sec-label">Tidslinje</div>' +
               ganttControls(epics, ts.length, all.length);

    if (!ts.length) {
      return head + '<div class="empty"><p>Ingen opgaver matcher filteret.</p>' +
             '<p><button class="btn" data-act="viewreset" type="button">Nulstil visning</button></p></div></section>';
    }

    var groups;
    if (o.group === "none") {
      groups = [{ name: "", list: ts }];
    } else {
      var map = {};
      ts.forEach(function (t) {
        var k = groupKey(t);
        if (!map[k]) map[k] = [];
        map[k].push(t);
      });
      groups = groupOrder(Object.keys(map)).map(function (k) {
        return { name: groupName(k), list: map[k] };
      });
    }

    // Vinduet følger det filtrerede — filtrerer man til én epic, zoomer
    // tidslinjen ind på netop dens spænd.
    var lo = Infinity, hi = -Infinity;
    ts.forEach(function (t) { var s = span(t); if (s.a < lo) lo = s.a; if (s.b > hi) hi = s.b; });
    lo = Math.min(lo, TODAY_MI - 1);
    hi = Math.max(hi, TODAY_MI + 5);
    var cols = hi - lo + 1;

    // Sidste kolonne er fleksibel, så stribningen fylder kortet ud på brede
    // skærme. Den klapper sammen til 0, når månederne fylder mere end bredden.
    var html = '<div class="gantt" style="grid-template-columns: var(--gantt-label) repeat(' + cols + ', var(--gantt-col)) minmax(0, 1fr);">';

    // Header
    html += '<div class="g-corner g-head" style="grid-row:1;grid-column:1">Opgave</div>';
    for (var c = 0; c < cols; c++) {
      var idx = lo + c, m = idx % 12, y = Math.floor(idx / 12);
      html += '<div class="g-cell g-head' + (m === 0 ? " year" : "") + '" style="grid-row:1;grid-column:' + (c + 2) + '">' +
              MONTH_SHORT[m] + (m === 0 ? '<span class="yr num">' + y + "</span>" : "") + "</div>";
    }
    html += '<div class="g-cell g-head" style="grid-row:1;grid-column:' + (cols + 2) + '"></div>';

    // Rækker. Gruppeoverskrifter får deres egen række og tæller med i
    // rækkenummereringen; stribningen følger opgaverne, ikke rækkerne.
    var row = 1, alt = 0;
    groups.forEach(function (g) {
      if (g.name) {
        row++;
        html += '<div class="g-group" style="grid-row:' + row + ';grid-column:1 / -1">' +
                '<span class="gg">' + esc(g.name) + ' <b class="num">' + g.list.length + "</b></span></div>";
      }
      g.list.forEach(function (t) {
        row++;
        var s = span(t), st = stat(t), stripe = (alt++ % 2) ? " alt" : "";
        var title = (t.epic ? epicName(t) + "\n" : "") + t.title +
                    (t.note ? " — " + t.note : "") + (isDate(t.due) ? " (deadline " + fmtDate(t.due) + ")" : "");

        html += '<div class="g-lane' + stripe + '" style="grid-row:' + row + ';grid-column:2 / -1"></div>';
        html += '<div class="g-label" data-act="task" data-id="' + esc(t.id) + '" style="grid-row:' + row + ';grid-column:1" title="' + esc(title) + '">' +
                '<span class="dot" style="background:var(--' + st.css + ')"></span>' +
                (t.epic && VIEWOPTS.group !== "epic" ? '<span class="ep">' + esc(t.epic) + "</span>" : "") +
                '<span class="txt">' + esc(t.title) + "</span></div>";

        // Deadline-diamant placeres relativt inde i bjælken, så den følger med ved zoom
        var dia = "";
        if (isDate(t.due)) {
          var dMi = mi(t.due.slice(0, 7));
          var frac = (Number(t.due.slice(8, 10)) - 1) / daysIn(Number(t.due.slice(0, 4)), Number(t.due.slice(5, 7)) - 1);
          var pos = (dMi - s.a + frac) / (s.b - s.a + 1) * 100;
          if (pos >= 0 && pos <= 100) {
            dia = '<span class="g-diamond' + (overdue(t) ? " over" : "") + '" style="left:' + pos.toFixed(2) + '%"></span>';
          }
        }

        html += '<div class="g-bar ' + st.css + '" style="grid-row:' + row + ';grid-column:' + (s.a - lo + 2) + " / " + (s.b - lo + 3) + '" title="' + esc(title) + '">' + dia + "</div>";
      });
    });

    // I dag-linjen. Fast kolonnebredde gør positionen beregnelig i ren CSS.
    if (TODAY_MI >= lo && TODAY_MI <= hi) {
      var f = (NOW.getDate() - 1) / daysIn(NOW.getFullYear(), NOW.getMonth());
      html += '<div class="g-today" style="left: calc(var(--gantt-label) + ' + (TODAY_MI - lo + f).toFixed(3) + ' * var(--gantt-col))"></div>';
    }

    html += "</div>";

    var legend = '<div class="legend">' + BOARD.concat(["droppet"]).map(function (k) {
      return '<span><i class="g-bar ' + (k === "droppet" ? "st-droppet" : "st-" + k) + '" style="margin:0;height:9px"></i>' + LABEL[k] + "</span>";
    }).join("") + '<span><i style="width:9px;height:9px;background:var(--ink);transform:rotate(45deg)"></i>Deadline</span></div>';

    return head + '<div class="gantt-scroll" id="gscroll">' + html + "</div>" + legend + "</section>";
  }

  /* ====================== Serializer ======================
     Skriver DATA tilbage i præcis samme læsbare form: én opgave pr. linje,
     justerede kolonner. Det er dét, der holder browser-redigeringer og
     Claude Codes kirurgiske redigeringer forenelige — og git-diffene læselige.
     Værdier går gennem JSON.stringify, så anførselstegn escapes korrekt. */


  var TASK_FIELDS   = ["id","project","sprint","start","end","status","title","owner","due","epic","hours","note"];
  var PROJ_FIELDS   = ["id","name","kind","tagline"];
  var SPRINT_FIELDS = ["project","month","goal"];
  var WEEK_FIELDS   = ["uge","drift","projekt","adhoc"];

  // Felter der skal skrives som tal, ikke som tekst
  var NUMERIC = { hours:1, drift:1, projekt:1, adhoc:1 };

  function q(v) { return JSON.stringify(v == null ? "" : String(v)); }
  function cell(f, v) { return f + ":" + (NUMERIC[f] ? num(v) : q(v)); }

  function rows(list, fields, indent) {
    var cells = list.map(function (o) {
      return fields.map(function (f) { return cell(f, o[f]); });
    });
    var width = fields.map(function (_, i) {
      return Math.max.apply(null, cells.map(function (c) { return c[i].length; }).concat([0]));
    });
    return cells.map(function (c) {
      return indent + "{" + c.map(function (x, i) {
        return i === fields.length - 1 ? x : x + ", " + new Array(width[i] - x.length + 1).join(" ");
      }).join("") + "}";
    }).join(",\n");
  }

  function serialize(D) {
    var k = D.kapacitet || {};
    var epics = Object.keys(D.epics || {}).map(function (x) { return "    " + x + ":" + q(D.epics[x]); }).join(",\n");
    var uger = (D.uger || []).length ? rows(D.uger, WEEK_FIELDS, "    ") : "";

    return [
      "/* =============================================================================",
      "   MARKETING OS — DATA",
      "",
      "   Indhold. Koden ligger i marketing-os.html.",
      "   Skrives af dashboardet, når du trykker Gem — og kan redigeres i hånden.",
      "",
      "     * ÉN OPGAVE = ÉN LINJE",
      "     * status:  \"Ikke startet\" | \"I gang\" | \"Blokeret\" | \"Færdig\" | \"Droppet\"",
      "     * sprint / start / end er MÅNEDER  (\"ÅÅÅÅ-MM\")",
      "     * due er en DATO (\"ÅÅÅÅ-MM-DD\") eller tom",
      "     * hours er timer pr. uge LIGE NU — ikke i alt. Trækker opgaven ikke",
      "       tid i denne uge, er den 0, selv om den har en deadline i marts.",
      "     * projekternes kind styrer kapacitetsregnskabet:",
      "         \"drift\"  løbende arbejde   \"projekt\" tidsbegrænset   \"adhoc\" det uplanlagte",
      "",
      "   Filen er bevidst uden for git — den er data, ikke kode.",
      "   OneDrive holder versionshistorik på den.",
      "   ============================================================================= */",
      "", "var DATA = {", "",
      "  meta: {",
      "    updated: " + q(D.meta.updated) + ",",
      "    note: " + q(D.meta.note || ""),
      "  },", "",
      "  /* ===== KAPACITET ===== timer pr. uge; loft i procent ===== */",
      "  kapacitet: {",
      "    contract:" + num(k.contract) + ", meetings:" + num(k.meetings) + ", admin:" + num(k.admin) +
        ", other:" + num(k.other) + ", ceiling:" + num(k.ceiling) + ", adhoc:" + num(k.adhoc),
      "  },", "",
      "  /* ===== UGELOG ===== faktisk forbrug; to uger kalibrerer ad hoc-bufferen ===== */",
      "  uger: [" + (uger ? "\n" + uger + "\n  ]" : "]") + ",", "",
      "  /* ===== EPICS ===== valgfri gruppering; nøglen sættes i opgavens epic-felt ===== */",
      "  epics: {", epics, "  },", "",
      "  /* ===== PROJEKTER ===== rækkefølgen her er rækkefølgen i sidebaren ===== */",
      "  projects: [", rows(D.projects, PROJ_FIELDS, "    "), "  ],", "",
      "  /* ===== SPRINTS ===== én sprint = ét projekt + én kalendermåned ===== */",
      "  sprints: [", rows(D.sprints, SPRINT_FIELDS, "    "), "  ],", "",
      "  /* ===== OPGAVER ===== ÉN OPGAVE = ÉN LINJE ===== */",
      "  tasks: [", rows(D.tasks, TASK_FIELDS, "    "), "  ]", "", "};", ""
    ].join("\n");
  }

  /* ====================== Gem ======================
     To bagender, valgt af hvordan siden er åbnet:
       http(s)  → en server, der gemmer lydløst: på nettet Netlify-funktionen
                  (netlify/functions/data.mts), på localhost server.js
       file://  → File System Access API; Windows spørger én gang pr. session
     Kan browseren ingen af delene, falder den tilbage til at hente filen ned.

     På nettet kommer datafilen med en DATA_REV — den version, siden indlæste.
     Den sendes med ved gem, så to enheder ikke overskriver hinanden i stilhed:
     er data ændret et andet sted imens, afviser serveren og siger det. */

  var SERVER = location.protocol === "http:" || location.protocol === "https:";
  var HOSTED = SERVER && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var dirty = false;

  function idb(fn) {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("marketing-os", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onerror = function () { rej(r.error); };
      r.onsuccess = function () {
        var tx = r.result.transaction("kv", "readwrite");
        var qy = fn(tx.objectStore("kv"));
        qy.onsuccess = function () { res(qy.result); };
        qy.onerror = function () { rej(qy.error); };
      };
    });
  }

  function getHandle() {
    return idb(function (st) { return st.get("dataFile"); }).catch(function () { return null; })
      .then(function (h) {
        if (!h) return null;
        return h.queryPermission({ mode: "readwrite" }).then(function (p) {
          return p === "granted" ? h : h.requestPermission({ mode: "readwrite" }).then(function (p2) {
            return p2 === "granted" ? h : null;
          });
        }).catch(function () { return null; });
      })
      .then(function (h) {
        if (h) return h;
        return window.showOpenFilePicker({
          id: "marketingosdata",
          types: [{ description: "HeyOtto OS datafil", accept: { "text/javascript": [".js"] } }],
          multiple: false
        }).then(function (picked) {
          return idb(function (st) { return st.put(picked[0], "dataFile"); })
            .catch(function () {})
            .then(function () { return picked[0]; });
        });
      });
  }

  function downloadFallback(text) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/javascript" }));
    a.download = "marketing-os-data.js";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }

  function looksLikeData(text) {
    return /var\s+DATA\s*=\s*\{/.test(text) && /tasks\s*:\s*\[/.test(text);
  }

  function postData(text) {
    var headers = { "Content-Type": "text/plain;charset=utf-8" };
    if (typeof window.DATA_REV === "string") headers["X-Data-Rev"] = window.DATA_REV;
    return fetch("save", { method: "POST", headers: headers, body: text }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || ("HTTP " + r.status)); });
      var rev = r.headers.get("X-Data-Rev");
      if (rev !== null) window.DATA_REV = rev;
    });
  }

  // Hent ind: en datafil — din egen fra OneDrive, en download eller en version
  // fra historikken — bliver til de gældende data. Kun via en server; som ren
  // fil erstatter man bare filen på disken.
  function importFile(file) {
    file.text().then(function (text) {
      if (!looksLikeData(text)) {
        flash("„" + file.name + "“ ligner ikke en datafil — intet hentet ind.", true);
        return;
      }
      if (!confirm("Erstat alle data med „" + file.name + "“?\n\n" +
                   (HOSTED ? "Den nuværende version kan altid findes igen under Historik."
                           : "Den nuværende datafil bliver overskrevet."))) return;
      return postData(text).then(function () {
        dirty = false; clearDraft();
        location.reload();
      });
    }).catch(function (e) { flash("Kunne ikke hente filen ind: " + (e && e.message ? e.message : e), true); });
  }

  function save() {
    DATA.meta.updated = TODAY_ISO;
    var text = serialize(DATA);
    var done = function () { dirty = false; clearDraft(); route(); flash(HOSTED ? "Gemt" : "Gemt i marketing-os-data.js"); };

    if (SERVER) {
      return postData(text)
        .then(done)
        .catch(function (e) { flash("Kunne ikke gemme: " + e.message, true); });
    }

    if (typeof window.showOpenFilePicker !== "function") {
      downloadFallback(text);
      flash("Din browser kan ikke skrive direkte. Filen er hentet ned — læg den i dashboard-mappen.", true);
      return Promise.resolve();
    }

    return getHandle()
      .then(function (h) { return h.createWritable(); })
      .then(function (w) { return w.write(text).then(function () { return w.close(); }); })
      .then(done)
      .catch(function (e) {
        // Tavshed her var netop det, der kostede en sprint: knappen så gemt ud,
        // men filvælgeren var bare lukket igen.
        if (e && e.name === "AbortError") {
          flash("IKKE gemt — filvælgeren blev lukket. Tryk Gem igen og vælg marketing-os-data.js.", true);
          return;
        }
        flash("Kunne ikke gemme: " + (e && e.message ? e.message : e), true);
      });
  }

  function flash(msg, bad) {
    var el = document.getElementById("flash");
    if (!el) return;
    el.textContent = msg;
    el.className = "flash show" + (bad ? " bad" : "");
    clearTimeout(flash._t);
    flash._t = setTimeout(function () { el.className = "flash"; }, bad ? 7000 : 2200);
  }

  /* ----- Kladde -----
     Ugemte ændringer lå før kun i hukommelsen, så et genindlæst vindue tog dem
     med sig — og en lukket filvælger gjorde det i tavshed. Nu skrives en kladde
     til browseren ved hver ændring og tilbydes gendannet ved næste indlæsning.
     Kladden er en sikkerhedsline, ikke et lager: filen er stadig sandheden. */

  var DRAFT_KEY = "mos-draft";
  var DRAFT = null;

  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ ts: Date.now(), data: DATA })); } catch (e) {}
  }
  function clearDraft() {
    DRAFT = null;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  }
  function loadDraft() {
    // Kunne datafilen ikke hentes (fx intet net), er der intet at sammenligne
    // med — og kladden må endelig ikke ryddes væk af den grund.
    if (typeof DATA === "undefined") return;
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      // Er kladden identisk med filen, er der intet at gendanne
      if (d && d.data && serialize(d.data) !== serialize(DATA)) DRAFT = d;
      else clearDraft();
    } catch (e) { clearDraft(); }
  }
  function draftAge(ts) {
    var min = Math.round((Date.now() - ts) / 60000);
    if (min < 1) return "for et øjeblik siden";
    if (min < 60) return "for " + min + " minut" + (min === 1 ? "" : "ter") + " siden";
    var h = Math.round(min / 60);
    return "for " + h + " time" + (h === 1 ? "" : "r") + " siden";
  }
  function draftBanner() {
    if (!DRAFT) return "";
    return '<div class="banner banner-warn"><h3>Ugemte ændringer fundet</h3>' +
      "<p>Der ligger ændringer i browseren, som aldrig blev gemt til filen — lavet " +
      esc(draftAge(DRAFT.ts)) + ". De går tabt, hvis du kasserer dem.</p>" +
      '<p style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn primary" data-act="draftrestore" type="button">Gendan ændringerne</button>' +
        '<button class="btn" data-act="draftdiscard" type="button">Kassér</button></p></div>';
  }

  function markDirty() { dirty = true; saveDraft(); route(); }

  window.addEventListener("beforeunload", function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  /* ====================== Redigering ====================== */

  function slug(s, taken) {
    var b = String(s).toLowerCase()
      .replace(/æ/g, "ae").replace(/ø/g, "oe").replace(/å/g, "aa")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 28) || "ny";
    var id = b, n = 2;
    while (taken.indexOf(id) >= 0) id = b + "-" + (n++);
    return id;
  }

  var dlg = document.getElementById("editor");

  function field(label, html, hint) {
    return '<label class="frow"><span class="flab">' + label + "</span>" + html +
           (hint ? '<span class="fhint">' + hint + "</span>" : "") + "</label>";
  }
  function opts(list, cur) {
    return list.map(function (o) {
      var v = typeof o === "string" ? o : o.v, t = typeof o === "string" ? o : o.t;
      return '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + ">" + esc(t) + "</option>";
    }).join("");
  }

  function openDialog(title, body, onSave, onDelete) {
    dlg.innerHTML =
      '<form method="dialog"><h3>' + esc(title) + "</h3>" + body +
      '<div class="dbtns">' +
        (onDelete ? '<button type="button" class="btn danger" id="d-del">Slet</button>' : "") +
        '<span style="flex:1"></span>' +
        '<button type="button" class="btn" id="d-cancel">Annullér</button>' +
        '<button type="button" class="btn primary" id="d-ok">Gem</button>' +
      "</div></form>";
    dlg.showModal();
    var first = dlg.querySelector("input,select,textarea");
    if (first) first.focus();

    dlg.querySelector("#d-cancel").onclick = function () { dlg.close(); };
    dlg.querySelector("#d-ok").onclick = function () {
      var err = onSave();
      if (err) { flash(err, true); return; }
      dlg.close(); markDirty();
    };
    if (onDelete) dlg.querySelector("#d-del").onclick = function () {
      var err = onDelete();
      if (err) { flash(err, true); return; }
      dlg.close(); markDirty();
    };
  }

  function val(id) { var e = dlg.querySelector("#" + id); return e ? e.value.trim() : ""; }

  function editTask(id, preset) {
    var isNew = !id;
    var t = isNew ? { id: "", project: preset.project, sprint: preset.sprint || "",
                      start: preset.sprint || "", end: preset.sprint || "",
                      status: "Ikke startet", title: "", owner: "", due: "", epic: "", hours: 0, note: "" }
                  : DATA.tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;

    var epicList = [{ v: "", t: "— ingen —" }].concat(Object.keys(DATA.epics || {}).map(function (k) {
      return { v: k, t: k + " — " + DATA.epics[k] };
    }));
    var sprintList = [{ v: "", t: "— ingen sprint —" }].concat(
      DATA.sprints.filter(function (s) { return s.project === t.project; })
        .sort(function (a, b) { return mi(a.month) - mi(b.month); })
        .map(function (s) { return { v: s.month, t: miLabel(mi(s.month), true) }; }));

    openDialog(isNew ? "Ny opgave" : "Rediger opgave",
      field("Titel", '<input id="f-title" type="text" value="' + esc(t.title) + '" maxlength="120">') +
      '<div class="fgrid">' +
        field("Status", '<select id="f-status">' + opts(["Ikke startet","I gang","Blokeret","Færdig","Droppet"], stat(t).label) + "</select>") +
        field("Ejer", '<input id="f-owner" type="text" value="' + esc(t.owner) + '" maxlength="40">') +
      "</div>" +
      '<div class="fgrid">' +
        field("Projekt", '<select id="f-project">' + opts(DATA.projects.map(function (p) { return { v: p.id, t: p.name }; }), t.project) + "</select>") +
        field("Sprint", '<select id="f-sprint">' + opts(sprintList, t.sprint) + "</select>") +
      "</div>" +
      '<div class="fgrid">' +
        field("Starter", '<input id="f-start" type="month" value="' + esc(t.start) + '">') +
        field("Slutter", '<input id="f-end" type="month" value="' + esc(t.end) + '">') +
      "</div>" +
      '<div class="fgrid">' +
        field("Deadline", '<input id="f-due" type="date" value="' + esc(t.due) + '">', "valgfri — tegner en diamant på tidslinjen") +
        field("Epic", '<select id="f-epic">' + opts(epicList, t.epic) + "</select>") +
      "</div>" +
      field("Timer pr. uge", '<input id="f-hours" type="number" min="0" max="40" step="0.5" value="' + num(t.hours) + '">',
            "lige nu, ikke i alt — 0 hvis opgaven ikke trækker tid i denne uge") +
      field("Note", '<textarea id="f-note" rows="3" maxlength="400">' + esc(t.note) + "</textarea>"),

      function () {
        var title = val("f-title");
        if (!title) return "Opgaven skal have en titel.";
        var start = val("f-start"), end = val("f-end"), sprint = val("f-sprint");
        if (!start && !sprint) return "Opgaven skal have enten en startmåned eller en sprint — ellers kan den ikke placeres på tidslinjen.";
        if (start && end && mi(end) < mi(start)) return "Slutmåneden ligger før startmåneden.";
        var o = isNew ? {} : t;
        o.title = title; o.status = val("f-status"); o.owner = val("f-owner");
        o.project = val("f-project"); o.sprint = sprint;
        o.start = start; o.end = end; o.due = val("f-due");
        o.epic = val("f-epic"); o.hours = num(val("f-hours")); o.note = val("f-note");
        if (isNew) {
          o.id = slug(o.project.slice(0, 5) + "-" + title, DATA.tasks.map(function (x) { return x.id; }));
          DATA.tasks.push(o);
        }
        return null;
      },
      isNew ? null : function () {
        if (!confirm("Slet „" + t.title + "“? Det kan ikke fortrydes uden at gendanne filen.")) return "afbrudt";
        DATA.tasks = DATA.tasks.filter(function (x) { return x.id !== t.id; });
        return null;
      });

    // Skifter man projekt, skal sprintlisten følge med
    var ps = dlg.querySelector("#f-project");
    if (ps) ps.onchange = function () {
      var list = [{ v: "", t: "— ingen sprint —" }].concat(
        DATA.sprints.filter(function (s) { return s.project === ps.value; })
          .sort(function (a, b) { return mi(a.month) - mi(b.month); })
          .map(function (s) { return { v: s.month, t: miLabel(mi(s.month), true) }; }));
      dlg.querySelector("#f-sprint").innerHTML = opts(list, "");
    };
  }

  function editProject(id) {
    var isNew = !id;
    var p = isNew ? { id: "", name: "", tagline: "" }
                  : DATA.projects.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var n = isNew ? 0 : tasksOf(p.id).length;

    openDialog(isNew ? "Nyt projekt" : "Rediger projekt",
      field("Navn", '<input id="f-name" type="text" value="' + esc(p.name) + '" maxlength="60">') +
      field("Type", '<select id="f-kind">' + opts(KINDS.map(function (k) {
              return { v: k.key, t: k.label + " — " + k.hint };
            }), KINDMAP[p.kind] ? p.kind : "projekt") + "</select>",
            "afgør hvilken bås projektets timer havner i på kapacitetsforsiden") +
      field("Undertekst", '<textarea id="f-tag" rows="2" maxlength="200">' + esc(p.tagline) + "</textarea>",
            "vises under projektnavnet"),
      function () {
        var name = val("f-name");
        if (!name) return "Projektet skal have et navn.";
        if (isNew) {
          var np = { id: slug(name, DATA.projects.map(function (x) { return x.id; })),
                     name: name, kind: val("f-kind"), tagline: val("f-tag") };
          DATA.projects.push(np);
          CURRENT = np.id;
        } else { p.name = name; p.kind = val("f-kind"); p.tagline = val("f-tag"); }
        return null;
      },
      isNew ? null : function () {
        if (n) return "„" + p.name + "“ har " + n + " opgave" + (n > 1 ? "r" : "") + ". Flyt eller slet dem først.";
        if (!confirm("Slet projektet „" + p.name + "“?")) return "afbrudt";
        DATA.projects = DATA.projects.filter(function (x) { return x.id !== p.id; });
        DATA.sprints = DATA.sprints.filter(function (x) { return x.project !== p.id; });
        CURRENT = DATA.projects.length ? DATA.projects[0].id : null;
        return null;
      });
  }

  function editSprint(project, month) {
    var isNew = !month;
    var s = isNew ? { project: project, month: "", goal: "" }
                  : DATA.sprints.filter(function (x) { return x.project === project && x.month === month; })[0];
    if (!s) return;
    var n = isNew ? 0 : DATA.tasks.filter(function (t) { return t.project === project && t.sprint === month; }).length;

    openDialog(isNew ? "Ny sprint" : "Rediger sprint",
      field("Måned", '<input id="f-month" type="month" value="' + esc(s.month) + '">') +
      field("Sprintmål", '<textarea id="f-goal" rows="2" maxlength="200">' + esc(s.goal) + "</textarea>",
            "én sætning om hvad der skal være sandt, når måneden er slut"),
      function () {
        var m = val("f-month");
        if (!m) return "Sprinten skal have en måned.";
        var clash = DATA.sprints.filter(function (x) { return x.project === project && x.month === m && x !== s; });
        if (clash.length) return "Der findes allerede en sprint for " + miLabel(mi(m), true) + ".";
        if (!isNew && s.month !== m) {
          DATA.tasks.forEach(function (t) { if (t.project === project && t.sprint === s.month) t.sprint = m; });
        }
        s.month = m; s.goal = val("f-goal");
        if (isNew) DATA.sprints.push(s);
        return null;
      },
      isNew ? null : function () {
        if (n) return "Sprinten har " + n + " opgave" + (n > 1 ? "r" : "") + ". Flyt dem først.";
        if (!confirm("Slet sprinten " + miLabel(mi(s.month), true) + "?")) return "afbrudt";
        DATA.sprints = DATA.sprints.filter(function (x) { return x !== s; });
        return null;
      });
  }

  // Én delegeret lytter — knapper overlever enhver gentegning
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "jump") {
      // Genvejsbjælken er ren scroll i siden. Den må ikke sætte adressen,
      // for hash'en bruges til at vælge projekt — et "#sprint" ville blive
      // læst som et projekt-id, ikke findes, og lande på det første projekt.
      e.preventDefault();
      var sec = document.getElementById(el.getAttribute("data-to"));
      if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (a === "viewreset")  {
      VIEWOPTS = { group: "none", show: "all", sort: "start", epic: "" };
      saveView(); route(); return;
    }
    if (a === "draftrestore") {
      DATA = DRAFT.data; DRAFT = null;
      dirty = true; saveDraft(); route();
      flash("Ændringerne er gendannet — husk at trykke Gem.");
      return;
    }
    if (a === "draftdiscard") {
      if (!confirm("Kassér de ugemte ændringer? Det kan ikke fortrydes.")) return;
      clearDraft(); route();
      return;
    }
    if (a === "proj")       { location.hash = el.getAttribute("data-id"); }
    else if (a === "kapacitet") { location.hash = "kapacitet"; }
    else if (a === "logweek")   {
      var k = isoWeek(new Date());
      if (!DATA.uger) DATA.uger = [];
      if (!DATA.uger.some(function (w) { return w.uge === k; })) {
        DATA.uger.push({ uge: k, drift: 0, projekt: 0, adhoc: 0 });
        markDirty();
      }
    }
    else if (a === "delweek")   {
      var u = el.getAttribute("data-uge");
      DATA.uger = (DATA.uger || []).filter(function (w) { return w.uge !== u; });
      markDirty();
    }
    else if (a === "task")      { editTask(el.getAttribute("data-id")); }
    else if (a === "newtask")   { editTask(null, { project: CURRENT, sprint: el.getAttribute("data-month") || "" }); }
    else if (a === "newproj")   { editProject(null); }
    else if (a === "editproj")  { editProject(CURRENT); }
    else if (a === "newsprint") { editSprint(CURRENT, null); }
    else if (a === "editsprint"){ editSprint(CURRENT, el.getAttribute("data-month")); }
    else if (a === "save")      { save(); }
    else if (a === "export")    {
      downloadFallback(serialize(DATA));
      flash(dirty ? "Datafilen er hentet ned — med dine ugemte ændringer." : "Datafilen er hentet ned.");
    }
    else if (a === "import")    {
      if (dirty && !confirm("Du har ugemte ændringer. De går tabt, hvis du henter en anden datafil ind. Fortsæt?")) return;
      document.getElementById("importfile").click();
    }
  });

  document.getElementById("importfile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = "";                 // samme fil skal kunne vælges igen
    if (f) importFile(f);
  });

  /* ====================== Kapacitet ======================
     Modellen er Kaspers egen fra kapacitetskontrol-artifaktet:
       fri kapacitet = (tilgængelige timer × planlægningsloft)
                       − drift − projekter − ad hoc-buffer
     Ad hoc-bufferen er et estimat, indtil to uger er registreret i ugeloggen;
     derefter er den det målte gennemsnit. Kø-faktoren er Kingmans: ventetiden
     vokser hyperbolsk med belægningen, hvilket er hele grunden til, at loftet
     ikke er 100 %. */

  var KINDS = [
    { key: "drift",   label: "Drift",     hint: "løbende arbejde" },
    { key: "projekt", label: "Projekter", hint: "tidsbegrænset" },
    { key: "adhoc",   label: "Ad hoc",    hint: "det uplanlagte" }
  ];
  var KINDMAP = {}; KINDS.forEach(function (k) { KINDMAP[k.key] = k; });

  function projById(id) {
    for (var i = 0; i < DATA.projects.length; i++) if (DATA.projects[i].id === id) return DATA.projects[i];
    return null;
  }
  function taskById(id) {
    for (var i = 0; i < DATA.tasks.length; i++) if (DATA.tasks[i].id === id) return DATA.tasks[i];
    return null;
  }
  function kindOf(t) {
    var p = projById(t.project);
    return (p && KINDMAP[p.kind]) ? p.kind : "projekt";
  }
  function isLive(t) {
    var k = stat(t).key;
    return k !== "faerdig" && k !== "droppet";
  }

  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    var wk = Math.ceil((((t - y0) / 86400000) + 1) / 7);
    return t.getUTCFullYear() + "-W" + (wk < 10 ? "0" + wk : wk);
  }
  function weekLabel(k) {
    var p = String(k).split("-W");
    return p.length === 2 ? "Uge " + parseInt(p[1], 10) + " · " + p[0] : k;
  }

  function capacity() {
    var c = DATA.kapacitet || {};
    var avail = Math.max(0, num(c.contract) - num(c.meetings) - num(c.admin) - num(c.other));
    var ceiling = num(c.ceiling, 85) / 100;
    var plan = avail * ceiling;

    var by = { drift: 0, projekt: 0, adhoc: 0 };
    var live = DATA.tasks.filter(function (t) { return num(t.hours) > 0 && isLive(t); });
    live.forEach(function (t) { by[kindOf(t)] += num(t.hours); });

    var weeks = DATA.uger || [];
    var measured = null;
    if (weeks.length >= 2) {
      var sum = 0;
      weeks.forEach(function (w) { sum += num(w.adhoc); });
      measured = sum / weeks.length;
    }
    // Bufferen dækker det uplanlagte. Har du selv ført ad hoc-opgaver ind for
    // mere end bufferen, er det tallet der gælder — ellers ville du tælle dobbelt.
    var buffer = Math.max(measured != null ? measured : num(c.adhoc), by.adhoc);

    var load = by.drift + by.projekt + buffer;
    var util = avail > 0 ? load / avail : 0;

    return {
      avail: avail, ceiling: ceiling, plan: plan, by: by, buffer: buffer,
      measured: measured, weeksLogged: weeks.length, live: live,
      load: load, free: plan - load, util: util,
      queue: util >= 0.995 ? 199 : util / (1 - util)
    };
  }

  function numInput(attrs, v, extra) {
    return '<input type="number" step="0.5" min="0" ' + attrs +
           ' value="' + num(v) + '"' + (extra || "") + ">";
  }

  function capModel(m) {
    var c = DATA.kapacitet, f = [
      ["contract", "Arbejdsuge", "kontrakttimer"],
      ["meetings", "Faste møder", "interne + eksterne"],
      ["admin", "Mail &amp; admin", "indbakke, rapportering"],
      ["other", "Øvrigt fravær", "ferie/kurser omregnet pr. uge"]
    ];
    return '<section class="card"><div class="card-hd"><h2>Kapacitetsmodel</h2></div><div class="card-pad">' +
      f.map(function (x) {
        return '<div class="krow"><span class="klab">' + x[1] + '<span class="ksub">' + x[2] + "</span></span>" +
               numInput('id="cap-' + x[0] + '" data-cap="model" data-key="' + x[0] + '" max="80"', c[x[0]]) + "</div>";
      }).join("") +
      '<div class="ktotal"><span>Tilgængeligt</span><b class="num">' + fmt(m.avail) + " t</b></div>" +
      '<div class="kceil"><div class="kceil-hd"><span>Planlægningsloft</span>' +
        '<b class="num">' + num(c.ceiling, 85) + " %</b></div>" +
        '<input type="range" id="cap-ceiling" data-cap="model" data-key="ceiling" min="60" max="100" step="5" value="' + num(c.ceiling, 85) + '">' +
        '<p class="hint">Andelen af din tilgængelige tid, der må bookes fast. Jo mere uforudsigelig indgangen er, jo lavere skal den ligge.</p>' +
      "</div></div></section>";
  }

  function capLoad(m) {
    var scale = Math.max(m.avail, m.load, 1), bar = "";
    KINDS.forEach(function (k) {
      var v = k.key === "adhoc" ? m.buffer : m.by[k.key];
      if (v <= 0) return;
      bar += '<div class="seg" style="width:' + (v / scale * 100) + "%;background:var(--c-" + k.key + ')" title="' +
             k.label + ": " + fmt(v) + ' t"></div>';
    });
    var slack = Math.max(0, m.avail - m.load);
    if (slack > 0) bar += '<div class="seg" style="width:' + (slack / scale * 100) + '%"></div>';

    var over = m.load > m.avail
      ? '<div class="bar-over" style="left:' + (m.avail / scale * 100) + '%"></div>' : "";
    var cp = m.plan / scale * 100;

    var legend = KINDS.map(function (k) {
      var v = k.key === "adhoc" ? m.buffer : m.by[k.key];
      return '<span class="lg"><i style="background:var(--c-' + k.key + ')"></i>' + k.label +
             ' <b class="num">' + fmt(v) + " t</b></span>";
    }).join("") +
    '<span class="lg"><i class="slack"></i>Ubooket <b class="num">' + fmt(slack) + " t</b></span>";

    return '<section class="card"><div class="card-hd"><h2>Belastning pr. uge</h2>' +
      '<span class="hint num">' + fmt(m.load) + " af " + fmt(m.avail) + " timer bundet</span></div>" +
      '<div class="card-pad"><div class="bar-wrap"><div class="bar-track">' + bar + over +
        '<div class="ceil" style="left:' + cp + '%"></div>' +
        '<div class="ceil-lbl" style="left:' + cp + '%">Loft ' + fmt(m.plan) + " t</div>" +
      '</div></div><div class="legend">' + legend + "</div>" +
      '<div class="kbuffer"><div class="krow" style="border:0;padding-top:0">' +
        '<span class="klab">Ad hoc-buffer<span class="ksub">' +
          (m.measured != null ? "målt gennemsnit over " + m.weeksLogged + " uger"
                              : "estimat — registrér 2 uger for at måle") + "</span></span>" +
        numInput('id="cap-adhoc" data-cap="model" data-key="adhoc" max="40"',
                 m.measured != null ? m.measured : DATA.kapacitet.adhoc,
                 m.measured != null ? " disabled" : "") + "</div>" +
        '<p class="hint">Bufferen dækker det uplanlagte. Så snart to uger er registreret nedenfor, regnes den som gennemsnittet af det faktiske forbrug i stedet for dit estimat.</p>' +
      "</div></div></section>";
  }

  function capCurve(m) {
    var W = 620, H = 240, x0 = 46, x1 = W - 16, y0 = 16, y1 = H - 38;
    var uMin = 0.4, uMax = 0.97, qMax = 20;
    var X = function (u) { return x0 + (u - uMin) / (uMax - uMin) * (x1 - x0); };
    var Y = function (qq) { return y1 - Math.min(qq, qMax) / qMax * (y1 - y0); };
    var s = "";

    [0, 5, 10, 15, 20].forEach(function (qq) {
      s += '<line x1="' + x0 + '" y1="' + Y(qq) + '" x2="' + x1 + '" y2="' + Y(qq) + '" stroke="var(--border)"/>' +
           '<text x="' + (x0 - 8) + '" y="' + (Y(qq) + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">×' + qq + "</text>";
    });
    [0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95].forEach(function (u) {
      s += '<text x="' + X(u) + '" y="' + (y1 + 17) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' +
           Math.round(u * 100) + "%</text>";
    });
    s += '<text x="' + ((x0 + x1) / 2) + '" y="' + (y1 + 33) + '" text-anchor="middle" font-size="10" fill="var(--muted)" letter-spacing="0.06em">BELÆGNINGSGRAD</text>';
    s += '<rect x="' + x0 + '" y="' + y0 + '" width="' + (X(0.85) - x0) + '" height="' + (y1 - y0) + '" fill="var(--st-faerdig)" opacity="0.10"/>';
    s += '<line x1="' + X(0.85) + '" y1="' + y0 + '" x2="' + X(0.85) + '" y2="' + y1 + '" stroke="var(--muted)" stroke-dasharray="3 3"/>';
    s += '<text x="' + (X(0.85) - 6) + '" y="' + (y0 + 13) + '" text-anchor="end" font-size="10" fill="var(--ink-2)" font-weight="600">anbefalet loft</text>';

    var d = "", first = true;
    for (var u = uMin; u <= uMax + 1e-4; u += 0.005) {
      var qq = u / (1 - u);
      if (qq > qMax + 4) break;
      d += (first ? "M" : "L") + X(u).toFixed(1) + " " + Y(qq).toFixed(1);
      first = false;
    }
    s += '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>';

    var u0 = Math.min(Math.max(m.util, uMin), uMax), q0 = Math.min(u0 / (1 - u0), qMax);
    var px = X(u0), py = Y(q0);
    s += '<line x1="' + px + '" y1="' + py + '" x2="' + px + '" y2="' + y1 + '" stroke="var(--ink)" opacity="0.3"/>' +
         '<circle cx="' + px + '" cy="' + py + '" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
    var right = px > x1 - 130;
    s += '<text x="' + (right ? px - 12 : px + 12) + '" y="' + (py - 11) + '" text-anchor="' + (right ? "end" : "start") +
         '" font-size="11" font-weight="600" fill="var(--ink)">Dig · ' + fmt(m.util * 100, 0) + "% · ×" + fmt(Math.min(m.queue, qMax)) + "</text>";

    return '<section class="card"><div class="card-hd"><h2>Hvorfor loftet ikke er 100 %</h2>' +
      '<span class="hint">Kingmans ligning: ventetid vokser hyperbolsk med belægningen</span></div>' +
      '<div class="card-pad"><div class="curve-wrap"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Kø-faktor mod belægningsgrad">' + s + "</svg></div>" +
      '<p class="hint" style="margin-top:12px">Kurven er relativ til 50 % belægning. Springet fra 85 % til 95 % tredobler ventetiden på alt, der ligger i kø — uden at du har arbejdet langsommere.</p></div></section>';
  }

  function capRow(t) {
    var p = projById(t.project), st = stat(t);
    return '<div class="caprow">' +
      '<span class="dot" style="background:var(--' + st.css + ')"></span>' +
      '<span class="cn" data-act="task" data-id="' + esc(t.id) + '" title="Åbn opgaven">' + esc(t.title) + "</span>" +
      '<span class="cp">' + esc(p ? p.name : t.project) + "</span>" +
      numInput('data-cap="hours" data-id="' + esc(t.id) + '" max="40"', t.hours) +
      "</div>";
  }

  function capTasks(m) {
    var activeIds = {};
    m.live.forEach(function (t) { activeIds[t.id] = true; });
    var rest = DATA.tasks.filter(function (t) { return !activeIds[t.id] && isLive(t); });

    var groups = KINDS.map(function (k) {
      var list = m.live.filter(function (t) { return kindOf(t) === k.key; })
                       .sort(function (a, b) { return num(b.hours) - num(a.hours); });
      var sum = list.reduce(function (s, t) { return s + num(t.hours); }, 0);
      return '<div class="capgroup"><div class="caphd"><i style="background:var(--c-' + k.key + ')"></i>' +
        "<b>" + k.label + "</b><span class=\"ksub\">" + k.hint + "</span>" +
        '<span class="num capsum">' + fmt(sum) + " t</span></div>" +
        (list.length ? list.map(capRow).join("")
                     : '<p class="col-empty">Ingen aktive timer i denne kategori.</p>') + "</div>";
    }).join("");

    return '<section class="card"><div class="card-hd"><h2>Aktive opgaver</h2>' +
      '<span class="hint">' + m.live.length + " opgave" + (m.live.length === 1 ? "" : "r") + " trækker tid lige nu</span></div>" +
      '<div class="card-pad">' + groups +
      '<p class="hint" style="margin-top:14px">Sæt kun timer på det, der reelt trækker tid <em>denne</em> uge. En opgave med deadline i marts trækker 0 nu — det er dét, der gør forskel på en opgaveliste og et kapacitetsregnskab.</p>' +
      (rest.length
        ? '<details class="hist" style="margin-top:14px"><summary><b>Øvrige åbne opgaver</b> <span class="num">' + rest.length + "</span>" +
          '<span class="g">sæt timer for at trække dem ind i regnskabet</span></summary>' +
          '<div class="hist-body">' + rest.map(capRow).join("") + "</div></details>"
        : "") +
      "</div></section>";
  }

  function capWeeks(m) {
    var weeks = (DATA.uger || []).slice().sort(function (a, b) { return String(b.uge).localeCompare(String(a.uge)); });
    var cur = isoWeek(new Date());
    var has = weeks.some(function (w) { return w.uge === cur; });

    var body = weeks.length
      ? weeks.slice(0, 10).map(function (w) {
          var tot = num(w.drift) + num(w.projekt) + num(w.adhoc);
          return "<tr><td>" + esc(weekLabel(w.uge)) + "</td>" +
            KINDS.map(function (k) {
              return '<td class="r">' + numInput('data-cap="week" data-uge="' + esc(w.uge) + '" data-key="' + k.key + '" max="80"', w[k.key]) + "</td>";
            }).join("") +
            '<td class="r num"><b>' + fmt(tot) + "</b></td>" +
            '<td class="r"><button class="icon-btn" data-act="delweek" data-uge="' + esc(w.uge) + '" type="button" title="Fjern" aria-label="Fjern">' + icon("x") + "</button></td></tr>";
        }).join("")
      : '<tr><td colspan="6" class="col-empty">Ingen uger registreret. To uger er nok til, at bufferen begynder at måle sig selv.</td></tr>';

    return '<section class="card"><div class="card-hd"><h2>Ugelog — faktisk forbrug</h2>' +
      '<span class="hint">Kalibrerer modellen. Registrér groft; præcision er ikke pointen.</span></div>' +
      '<div class="card-pad"><div class="table-scroll"><table class="wtbl"><thead><tr><th>Uge</th>' +
      KINDS.map(function (k) { return '<th class="r">' + k.label + "</th>"; }).join("") +
      '<th class="r">I alt</th><th></th></tr></thead><tbody>' + body + "</tbody></table></div>" +
      '<div class="wacts"><button class="btn primary" data-act="logweek" type="button"' + (has ? " disabled" : "") + ">" +
        (has ? weekLabel(cur) + " er registreret" : "Registrér indeværende uge") + "</button>" +
        '<span class="hint">' + (m.measured != null ? "Bufferen måles nu."
          : "Mangler " + Math.max(0, 2 - m.weeksLogged) + " uge(r), før bufferen måles.") + "</span></div>" +
      "</div></section>";
  }

  function renderCapacity() {
    var m = capacity();
    renderSidebar("kapacitet");
    document.title = (dirty ? "● " : "") + "Kapacitet — HeyOtto OS";

    var tone = m.free < -1 ? "crit" : (m.free < 2 ? "warn" : "good");
    var word = m.free < -1 ? "Overbooket" : (m.free < 2 ? "På kanten" : "Plads tilbage");
    var note = m.free < -1 ? "Nye opgaver fortrænger eksisterende."
             : (m.free < 2 ? "Ingen reel plads til det løse." : "Plads til nye opgaver inden for loftet.");
    var qnote = m.util >= 0.95 ? "Over knækket — alt står i kø."
              : (m.util >= 0.85 ? "Ved knækket — kø opbygges." : "Ventetid vs. 50 % belægning.");

    document.getElementById("main").innerHTML =
      draftBanner() +
      '<div class="phead"><div><h1>Kapacitet</h1>' +
        '<p class="tagline">Hvor mange timer er der reelt tilbage, når drift, projekter og det uplanlagte er trukket fra?</p></div>' +
        '<div class="pacts">' +
          '<button class="btn primary' + (dirty ? "" : " ghost") + '" data-act="save" type="button">' +
            (dirty ? '<span class="udot"></span>Gem ændringer' : "Gem") + "</button>" +
          '<button class="theme-btn" id="themebtn" type="button"></button>' +
        "</div></div>" +

      '<section class="verdict">' +
        '<div class="vcell"><span class="vlabel">Fri kapacitet</span>' +
          '<div class="vbig num">' + (m.free < 0 ? "−" : "") + fmt(Math.abs(m.free)) + "<small>t/uge</small></div>" +
          '<span class="pill ' + tone + '"><span class="dot"></span>' + word + "</span>" +
          '<div class="vnote">' + note + "</div></div>" +
        '<div class="vcell"><span class="vlabel">Belægning</span>' +
          '<div class="vmid num">' + fmt(m.util * 100, 0) + " %</div>" +
          '<div class="vnote">af <span class="num">' + fmt(m.avail) + "</span> tilgængelige timer</div></div>" +
        '<div class="vcell"><span class="vlabel">Kø-faktor (Kingman)</span>' +
          '<div class="vmid num">×' + fmt(m.queue) + "</div>" +
          '<div class="vnote">' + qnote + "</div></div>" +
      "</section>" +

      '<div class="cap2">' + capModel(m) + capLoad(m) + "</div>" +
      capCurve(m) + capTasks(m) + capWeeks(m) +
      '<p class="foot">Fri kapacitet = (tilgængelige timer × planlægningsloft) − drift − projekter − ad hoc-buffer. ' +
      "Er tallet negativt, er du overbooket, og næste opgave fortrænger en eksisterende — ikke en teoretisk pointe, " +
      "men den sætning der skal med, når chefen spørger.</p>";

    wireTheme();
  }

  function applyCap(el) {
    var what = el.getAttribute("data-cap"), v = num(el.value);
    if (what === "model") {
      DATA.kapacitet[el.getAttribute("data-key")] = v;
    } else if (what === "hours") {
      var t = taskById(el.getAttribute("data-id"));
      if (t) t.hours = v;
    } else if (what === "week") {
      var uge = el.getAttribute("data-uge");
      (DATA.uger || []).forEach(function (w) {
        if (w.uge === uge) w[el.getAttribute("data-key")] = v;
      });
    }
    markDirty();
  }
  document.addEventListener("input", function (e) {
    if (e.target && e.target.getAttribute && e.target.getAttribute("data-cap")) applyCap(e.target);
  });

  // Visningsvalg ændrer ikke data, så de må aldrig sætte siden i "ugemt"
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var v = el.getAttribute("data-view");
    if (!v || VIEWOPTS[v] === undefined) return;
    VIEWOPTS[v] = el.value;
    saveView();
    route();
  });

  /* ====================== Samlet rendering ====================== */

  var CURRENT = null;

  function render(pid) {
    var p = null;
    for (var i = 0; i < DATA.projects.length; i++) if (DATA.projects[i].id === pid) p = DATA.projects[i];
    if (!p) p = DATA.projects[0];
    if (!p) {
      CURRENT = null;
      renderSidebar(null);
      document.getElementById("main").innerHTML =
        '<div class="empty"><p>Ingen projekter endnu.</p>' +
        '<p><button class="btn primary" data-act="newproj" type="button">Opret det første projekt</button></p></div>';
      return;
    }

    CURRENT = p.id;
    renderSidebar(p.id);
    document.title = (dirty ? "● " : "") + p.name + " — HeyOtto OS";

    var ts = tasksOf(p.id);
    var counts = {};
    ts.forEach(function (t) { var k = stat(t).key; counts[k] = (counts[k] || 0) + 1; });

    var chips = "";
    BOARD.concat(["droppet", "ukendt"]).forEach(function (k) {
      if (!counts[k]) return;
      chips += '<span class="chip' + (k === "blokeret" || k === "ukendt" ? " alarm" : "") + '">' +
               '<span class="dot" style="background:var(--st-' + k + ')"></span>' +
               "<b>" + counts[k] + "</b> " + (LABEL[k] || "ukendt status") + "</span>";
    });
    var odAll = ts.filter(overdue).length;
    if (odAll) chips += '<span class="chip alarm"><span class="dot" style="background:var(--st-blokeret)"></span><b>' + odAll + "</b> over deadline</span>";

    var banners = draftBanner();
    var problems = validate();
    if (problems.length) {
      banners += '<div class="banner banner-warn"><h3>' + icon("alert") + problems.length + " problem" + (problems.length > 1 ? "er" : "") +
                 " i datablokken</h3><ul><li>" + problems.map(esc).join("</li><li>") + "</li></ul></div>";
    }
    if (DATA.meta.note) {
      banners += '<div class="banner banner-info">' + esc(DATA.meta.note) + "</div>";
    }

    // Sektionerne bygges først, så genvejsbjælken kun tilbyder dem, der findes.
    // Et projekt uden øvrige sprints skal ikke have et link til en tom sektion.
    var secSprint = renderSprint(p), secHist = renderHistory(p), secGantt = renderGantt(p);
    var links = [];
    if (secSprint) links.push(["sprint", "Sprint"]);
    if (secHist)   links.push(["historik", "Øvrige sprints"]);
    if (secGantt)  links.push(["tidslinje", "Tidslinje"]);
    var nav = links.length > 1
      ? '<nav class="jump">' + links.map(function (l) {
          return '<a href="#' + l[0] + '" data-act="jump" data-to="' + l[0] + '">' + l[1] + "</a>";
        }).join("") + "</nav>"
      : "";

    document.getElementById("main").innerHTML =
      banners +
      '<div class="phead"><div><h1>' + esc(p.name) +
        ' <button class="icon-btn" data-act="editproj" type="button" title="Rediger projekt" aria-label="Rediger projekt">' + icon("pencil") + "</button></h1>" +
        (p.tagline ? '<p class="tagline">' + esc(p.tagline) + "</p>" : "") + "</div>" +
        '<div class="pacts">' +
          '<button class="btn primary' + (dirty ? "" : " ghost") + '" data-act="save" type="button">' +
            (dirty ? '<span class="udot"></span>Gem ændringer' : "Gem") + "</button>" +
          '<button class="theme-btn" id="themebtn" type="button"></button>' +
        "</div></div>" +
      '<div class="chips">' + (chips || '<span class="chip">Ingen opgaver endnu</span>') + "</div>" +
      nav + secSprint + secHist + secGantt +
      "<footer>HeyOtto OS · data opdateret " + esc(DATA.meta.updated || "—") +
      " · vedligeholdes af Claude Code i <span class=\"num\">dashboard/marketing-os.html</span></footer>";

    wireTheme();

    // Rul tidslinjen så indeværende måned ligger tæt på venstre kant
    var gs = document.getElementById("gscroll");
    if (gs) {
      var line = gs.querySelector(".g-today");
      if (line) gs.scrollLeft = Math.max(0, line.offsetLeft - 340);
    }
  }

  /* ====================== Tema ====================== */

  function currentTheme() {
    var set = document.documentElement.getAttribute("data-theme");
    if (set) return set;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function wireTheme() {
    var btn = document.getElementById("themebtn");
    if (!btn) return;
    btn.innerHTML = currentTheme() === "dark" ? icon("sun") + "Lyst tema" : icon("moon") + "Mørkt tema";
    btn.addEventListener("click", function () {
      document.documentElement.setAttribute("data-theme", currentTheme() === "dark" ? "light" : "dark");
      btn.innerHTML = currentTheme() === "dark" ? icon("sun") + "Lyst tema" : icon("moon") + "Mørkt tema";
    });
  }

  /* ====================== Start ====================== */

  function fromHash() { return (location.hash || "").replace(/^#/, ""); }

  // Én indgang til al gentegning. Tomt hash = kapacitet, fordi det er dét,
  // dashboardet åbnes for. Fokus og markørposition bevares, så man kan taste
  // videre i et talfelt, selv om siden bliver tegnet forfra ved hvert tastetryk.
  function route() {
    var a = document.activeElement;
    var id = a && a.id ? a.id : null;
    var key = a && a.getAttribute && a.getAttribute("data-cap")
      ? [a.getAttribute("data-cap"), a.getAttribute("data-id") || "", a.getAttribute("data-uge") || "", a.getAttribute("data-key") || ""].join("|")
      : null;
    var pos = a && a.selectionStart != null ? a.selectionStart : null;

    // Ukendt hash lander på forsiden frem for stiltiende på det første projekt.
    // Det var dét, der fik genvejslinkene til at ligne et projektskifte.
    var h = fromHash();
    if (!h || h === "kapacitet" || !projById(h)) renderCapacity();
    else render(h);

    var back = id ? document.getElementById(id) : null;
    if (!back && key) {
      var p = key.split("|");
      back = document.querySelector('[data-cap="' + p[0] + '"]' +
        (p[1] ? '[data-id="' + p[1] + '"]' : "") +
        (p[2] ? '[data-uge="' + p[2] + '"]' : "") +
        (p[3] ? '[data-key="' + p[3] + '"]' : ""));
    }
    if (back && back !== document.activeElement) {
      try { back.focus({ preventScroll: true }); } catch (e) { back.focus(); }
      if (pos != null && back.setSelectionRange) {
        try { back.setSelectionRange(pos, pos); } catch (e) {}
      }
    }
  }

  window.addEventListener("hashchange", route);

  try {
    loadDraft();
    route();
  } catch (err) {
    document.getElementById("main").innerHTML =
      '<div class="banner banner-warn"><h3>' + icon("alert") + "Dashboardet kunne ikke tegnes</h3>" +
      "<p>" + (typeof DATA === "undefined" ? "Datafilen kunne ikke hentes."
                                          : esc(err && err.message ? err.message : String(err))) +
      "</p><p style=\"margin-top:8px\">Det skyldes næsten altid en fejl i datafilen — eller at den ikke kunne hentes. Prøv at genindlæse; hjælper det ikke, så bed Claude om at se på den. Dine ugemte ændringer er ikke rørt.</p></div>";
  }
})();
</script>

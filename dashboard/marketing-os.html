* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

}
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Skal ---------- */
.shell { display: flex; align-items: flex-start; min-height: 100vh; }

.sidebar {
  width: 240px;
  flex: 0 0 240px;
  align-self: stretch;
  background: var(--sidebar-bg);
  color: var(--sidebar-fg);
  padding: 26px 0 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brandmark {
  font-family: "The Seasons", "Cormorant Garamond", Georgia, serif;
  font-size: 26px;
  line-height: 1.1;
  padding: 0 22px 22px;
  color: var(--sidebar-fg);
}
.brandmark span { display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-family: system-ui, sans-serif; color: var(--sidebar-muted); margin-top: 6px; }

.nav-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sidebar-muted); padding: 0 22px 8px; }
.proj {
  display: flex; align-items: flex-start; gap: 10px;
  width: 100%; text-align: left;

}
.proj:hover { background: rgba(253,240,213,0.07); }
.proj[aria-current="true"] { background: rgba(253,240,213,0.11); border-left-color: var(--accent); }
.proj .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: 0 0 9px; }
.proj .pname { font-size: 14px; }
.proj .pmeta { font-size: 11.5px; color: var(--sidebar-muted); }
.sidebar-foot { margin-top: 26px; padding: 16px 22px 0; border-top: 1px solid rgba(253,240,213,0.14); font-size: 11.5px; color: var(--sidebar-muted); }

.main { flex: 1 1 auto; min-width: 0; padding: 30px 34px 90px; }
.main-inner { max-width: 1120px; }

/* ---------- Banner ---------- */
.banner { border-radius: 10px; padding: 13px 16px; margin-bottom: 20px; font-size: 13.5px; border: 1px solid; }
.banner h3 { font-family: inherit; font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.banner-warn { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.banner-info { background: var(--surface-2); border-color: var(--border-strong); color: var(--ink-2); }

/* ---------- Projekt-header ---------- */
.phead { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 14px; }
.phead h1 { font-size: 34px; line-height: 1.12; }
.phead .tagline { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.theme-btn {
  margin-left: auto; flex: 0 0 auto;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--border-strong); border-radius: 999px;
  padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
}
.theme-btn:hover { border-color: var(--accent); color: var(--ink); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 13px 5px 10px; font-size: 13px; color: var(--ink-2);
}
.chip b { color: var(--ink); font-weight: 600; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }

/* ---------- Jump-nav ---------- */
.jump { display: flex; gap: 8px; flex-wrap: wrap; position: sticky; top: 0; z-index: 20;
        background: var(--bg); padding: 10px 0 12px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
.jump a { font-size: 13px; text-decoration: none; color: var(--ink-2);
          border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px; background: var(--surface); }
.jump a:hover { border-color: var(--accent); color: var(--ink); }

/* ---------- Sektioner og kort ---------- */
section { margin-top: 34px; scroll-margin-top: 62px; }
.sec-label { font-size: 10.5px; letter-spacing: 0.17em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.card-pad { padding: 20px 22px; }

.sprint-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sprint-head h2 { font-size: 25px; }
.tag { font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--ink-2); }
.tag.now { background: var(--accent); border-color: var(--accent); color: #33270F; font-weight: 600; }
.goal { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; margin: 14px 0 18px;
        font-family: "The Seasons", "Cormorant Garamond", Georgia, serif; font-size: 20px; line-height: 1.35; color: var(--ink); }
.goal.empty { border-left-color: var(--border-strong); color: var(--muted); font-style: italic; font-size: 16px; }

.meter { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
.meter-track { flex: 1 1 220px; height: 8px; border-radius: 999px; background: var(--lane); overflow: hidden; min-width: 160px; }
.meter-fill { height: 100%; background: var(--st-faerdig); border-radius: 999px; }
.meter-txt { font-size: 13px; color: var(--ink-2); }

/* ---------- Kanban ---------- */
.kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
.col-head { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); margin-bottom: 9px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
.col-head .dot { width: 8px; height: 8px; border-radius: 50%; }
.col-head .cnt { margin-left: auto; color: var(--muted); }
.tcard { background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); border-radius: 8px; padding: 10px 12px; margin-bottom: 9px; }
.tcard .tt { font-size: 13.5px; line-height: 1.35; }
.tcard .tm { font-size: 11.5px; color: var(--muted); margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tcard .tnote { font-size: 11.5px; color: var(--ink-2); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
.ep { font-size: 10px; letter-spacing: 0.06em; font-weight: 600; color: var(--ink-2);
      background: var(--lane); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; flex: 0 0 auto; }
.due { display: inline-flex; align-items: center; gap: 4px; }
.due.over { color: var(--st-blokeret); font-weight: 600; }
.col-empty { font-size: 12px; color: var(--muted); font-style: italic; padding: 4px 0 8px; }

/* ---------- Historik ---------- */
details.hist { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 9px; }
details.hist summary { cursor: pointer; padding: 12px 16px; font-size: 13.5px; color: var(--ink-2); list-style: none; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
details.hist summary::-webkit-details-marker { display: none; }
details.hist summary::before { content: "\25B8"; color: var(--muted); }
details.hist[open] summary::before { content: "\25BE"; }
details.hist summary b { color: var(--ink); font-weight: 600; }
details.hist summary .g { color: var(--muted); font-style: italic; }
details.hist .hist-body { padding: 0 16px 14px 34px; }
.hrow { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
.hrow .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.hrow .hd { margin-left: auto; color: var(--muted); font-size: 12px; }

/* ---------- Gantt ---------- */
.gantt-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.gantt { display: grid; position: relative; width: max-content; min-width: 100%; }
.g-cell { font-size: 11.5px; color: var(--ink-2); text-align: center; padding: 9px 4px; border-left: 1px solid var(--border); background: var(--surface-2); }
.g-cell.year { border-left: 1px solid var(--border-strong); }
.g-cell .yr { display: block; font-size: 10px; color: var(--muted); }
.g-corner { position: sticky; left: 0; z-index: 3; background: var(--surface-2); border-bottom: 1px solid var(--border);
            font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); padding: 11px 14px; }
.g-head { border-bottom: 1px solid var(--border); }
.g-label {
  position: sticky; left: 0; z-index: 2; background: var(--surface);
  padding: 0 14px; height: var(--gantt-row); display: flex; align-items: center; gap: 8px;
  font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-right: 1px solid var(--border); border-top: 1px solid var(--border);
}
.g-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.g-label .txt { overflow: hidden; text-overflow: ellipsis; }
.g-lane { border-top: 1px solid var(--border); }
.g-lane.alt { background: var(--lane); }
.g-bar {
  align-self: center; height: 17px; border-radius: 5px; margin: 0 3px;
  position: relative; z-index: 1; cursor: default;
}
.g-bar.st-ikke-startet { background: var(--st-ikke-startet); }
.g-bar.st-i-gang       { background: var(--st-i-gang); }
.g-bar.st-faerdig      { background: var(--st-faerdig); }
.g-bar.st-blokeret     { background: repeating-linear-gradient(45deg, var(--st-blokeret) 0 6px, rgba(255,255,255,0.30) 6px 11px); }
.g-bar.st-droppet      { background: transparent; border: 1.5px dashed var(--st-droppet); }
.g-bar.st-ukendt       { background: #FF00FF; }
.g-diamond { position: absolute; top: 50%; width: 9px; height: 9px; background: var(--ink); border: 1.5px solid var(--surface);
             transform: translate(-50%, -50%) rotate(45deg); }
.g-diamond.over { background: var(--st-blokeret); }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 4; pointer-events: none; }
.g-today::before { content: "I DAG"; position: absolute; top: 2px; left: 4px; font-size: 9px; letter-spacing: 0.1em;
                   color: #33270F; background: var(--accent); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
/* Filter- og grupperingsbjælke over tidslinjen */
.gctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.gctl select {
  font: inherit; font-size: 12.5px; padding: 5px 9px; border-radius: 999px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-2);
  max-width: 220px; cursor: pointer;
}
.gctl select:hover { border-color: var(--accent); color: var(--ink); }
.gctl select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.gcount { font-size: 12px; color: var(--muted); margin-left: auto; }

.g-group { border-top: 1px solid var(--border-strong); background: var(--surface-2); height: 30px; }
.g-group .gg {
  position: sticky; left: 0; display: inline-flex; align-items: center; gap: 8px; height: 30px;
  padding: 0 14px; font-size: 11.5px; letter-spacing: 0.04em; font-weight: 600;
  color: var(--ink-2); white-space: nowrap;
}
.g-group .gg b { color: var(--muted); font-weight: 500; }

.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 9px; border-radius: 3px; display: inline-block; }

/* ---------- Tom-tilstand ---------- */
.empty { background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 12px;
         padding: 30px 24px; text-align: center; color: var(--ink-2); }
.empty p:first-child { font-size: 15px; color: var(--ink); margin-bottom: 6px; }
.empty code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; font-size: 12.5px; }

footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }

/* ---------- Smalle skærme ---------- */
@media (max-width: 1000px) { .kanban { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 760px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; flex: none; height: auto; position: static; padding-bottom: 14px; }
  .brandmark { padding-bottom: 14px; }
  .sidebar-foot { margin-top: 14px; }
  .main { padding: 22px 18px 70px; }
  .kanban { grid-template-columns: 1fr; }
  .phead h1 { font-size: 27px; }
}

/* ---------- Kapacitet ---------- */
.verdict { display: grid; grid-template-columns: minmax(210px, 1.15fr) 1fr 1fr; gap: 1px;
           background: var(--border); border: 1px solid var(--border); border-radius: 12px;
           overflow: hidden; box-shadow: var(--shadow); margin-bottom: 22px; }
.vcell { background: var(--surface); padding: 18px 20px 16px; display: flex; flex-direction: column; min-width: 0; }
.vlabel { font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.vbig { font-size: 42px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em; margin-top: 6px; }
.vbig small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 5px; }
.vmid { font-size: 27px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; margin-top: 8px; }
.vnote { font-size: 12px; color: var(--muted); margin-top: 7px; }
.pill { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; margin-top: 11px;
        padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--st-faerdig); border-color: var(--st-faerdig); background: var(--lane); }
.pill.warn { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.pill.crit { color: var(--st-blokeret); border-color: var(--st-blokeret); background: var(--lane); }
.proj .dot.good { background: var(--st-faerdig); }
.proj .dot.warn { background: var(--accent); }
.proj .dot.crit { background: var(--st-blokeret); }

.cap2 { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 20px; align-items: start; }
.card-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
           flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.card-hd h2 { font-size: 17px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.krow { display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 9px 0; border-bottom: 1px dashed var(--border); }
.krow:last-of-type { border-bottom: 0; }
.klab { color: var(--ink-2); font-size: 13px; }
.ksub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.ktotal { display: flex; align-items: baseline; justify-content: space-between; margin-top: 12px;
          padding-top: 12px; border-top: 1px solid var(--border-strong); color: var(--ink-2); }
.ktotal b { font-size: 21px; font-weight: 600; color: var(--ink); letter-spacing: -0.02em; }
.kceil { margin-top: 18px; }
.kceil-hd { display: flex; justify-content: space-between; align-items: baseline; color: var(--ink-2); font-size: 13px; margin-bottom: 4px; }
.kbuffer { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }

input[type="number"] { font: inherit; font-size: 14px; width: 78px; text-align: right;
  font-variant-numeric: tabular-nums; padding: 6px 8px; border-radius: 7px;
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink); }
input[type="number"]:disabled { color: var(--muted); background: var(--lane); }
input[type="number"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.bar-wrap { padding-top: 24px; }
.bar-track { position: relative; height: 34px; border-radius: 7px; background: var(--surface-2);
             border: 1px solid var(--border); display: flex; overflow: hidden; }
.seg { height: 100%; border-right: 2px solid var(--surface); min-width: 0; }
.seg:last-child { border-right: 0; }
.bar-over { position: absolute; top: 0; bottom: 0; right: 0;
            background: repeating-linear-gradient(135deg, var(--st-blokeret) 0 5px, transparent 5px 10px); opacity: .55; }
.ceil { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); opacity: .6; }
.ceil-lbl { position: absolute; top: -22px; transform: translateX(-50%); font-size: 10px;
            letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 16px; font-size: 12.5px; color: var(--ink-2); }

.capgroup { margin-bottom: 20px; }
.capgroup:last-of-type { margin-bottom: 0; }
.caphd { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2);
         padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }

.wtbl { width: 100%; border-collapse: collapse; font-size: 13px; }

           color: var(--muted); font-weight: 600; padding: 0 10px 8px 0; border-bottom: 1px solid var(--border); }

.wacts { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.btn:disabled { opacity: .5; cursor: default; }

@media (max-width: 860px) { .cap2 { grid-template-columns: 1fr; } .verdict { grid-template-columns: 1fr; } }

/* ---------- Knapper ---------- */
.btn { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
       background: var(--surface); color: var(--ink-2); border: 1px solid var(--border-strong); white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #33270F; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary.ghost { background: var(--surface); border-color: var(--border-strong); color: var(--muted); font-weight: 400; }
.btn.primary.ghost:hover { color: var(--ink); border-color: var(--accent); }
.btn.danger { border-color: var(--st-blokeret); color: var(--st-blokeret); }
.btn.danger:hover { background: var(--st-blokeret); color: var(--cream); }
.icon-btn { font: inherit; font-size: 14px; line-height: 1; background: none; border: 0; cursor: pointer;
            color: var(--muted); padding: 3px 6px; border-radius: 6px; vertical-align: middle; }
.icon-btn:hover { color: var(--accent); background: var(--accent-soft); }
.pacts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }

.proj.add { color: var(--sidebar-muted); align-items: center; }

.proj.add .plus { width: 9px; text-align: center; font-size: 15px; line-height: 1; flex: 0 0 9px; }

.tcard[data-act], .hrow[data-act], .g-label[data-act] { cursor: pointer; }
.tcard[data-act]:hover { border-color: var(--accent); }
.tcard[data-act]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Dialog ---------- */
#editor { border: 1px solid var(--border-strong); border-radius: 14px; background: var(--surface); color: var(--ink);
          padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 24px 60px -20px rgba(0,0,0,0.4); }
#editor::backdrop { background: rgba(28,30,22,0.5); }

#editor input, #editor select, #editor textarea {
  font: inherit; font-size: 14px; width: 100%; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink);
}
#editor textarea { resize: vertical; line-height: 1.45; }
#editor input:focus, #editor select:focus, #editor textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.dbtns { display: flex; gap: 9px; align-items: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ---------- Statusbesked ---------- */
.flash { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px); z-index: 60;
         background: var(--sidebar-bg); color: var(--sidebar-fg); font-size: 13.5px;
         padding: 11px 20px; border-radius: 999px; box-shadow: var(--shadow);
         opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: min(520px, 92vw); text-align: center; }
.flash.show { opacity: 1; transform: translate(-50%, 0); }
.flash.bad { background: var(--st-blokeret); color: #fff; }

@media (max-width: 560px) { .fgrid { grid-template-columns: 1fr; } }

/* ---------- Print ---------- */
@media print {
  :root { --bg: #fff; --surface: #fff; }
  .sidebar, .jump, .theme-btn, .btn, .icon-btn, .flash, #editor, .gctl { display: none !important; }
  .main { padding: 0; }
  .gantt-scroll { overflow: visible; border: 0; box-shadow: none; }
  .card { box-shadow: none; break-inside: avoid; }
  details.hist { break-inside: avoid; }
  * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  @page { size: landscape; margin: 12mm; }
}

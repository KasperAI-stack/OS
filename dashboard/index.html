      '<section class="card"><div class="card-hd"><h2>Aktivitet</h2><span class="hint" id="otoday"></span></div>' +
        '<div class="card-pad" id="oruns"><p class="hint">Henter …</p></div></section>';
    fillOtto();
    loadAgent();
    loadRuns();
  }

  function fillOtto(focus) {
    var box = document.getElementById("ochat");
    if (!box) return;
    var today = document.getElementById("otoday");
    if (today && AGENT && AGENT.today) {
      today.textContent = "I dag " + kr(AGENT.today.dkk) + " af " + kr(AGENT.settings.budgetDkk) + " · " + plural(AGENT.today.runs, "kørsel", "kørsler");
    }
    if (AGENT && AGENT.error) { box.innerHTML = '<p class="hint">Kunne ikke hente assistenten: ' + esc(AGENT.error) + "</p>"; return; }
    if (AGENT && !AGENT.configured) {
      box.innerHTML = '<div class="oempty"><img src="otto/taenker.png" alt="" aria-hidden="true">' +
        '<div><p class="kp-lead">Assistenten er ikke sat op endnu</p>' +
        '<p class="hint">Assistenten bruger Claude API. Det sættes op én gang med din egen nøgle. Derefter kan du spørge om projekter, deadlines, kapacitet og kalender.</p>' +
        '<p class="mt-3"><button class="btn primary" data-act="settings" data-section="otto" type="button">Sæt assistenten op</button></p></div></div>';
      return;
    }
    var old = document.getElementById("oq");
    var draft = old ? old.value : "";
    var thread = OCHAT.map(function (c) {
      var r = c.run, a;
      if (!r || OBUSY[r.status]) {
        var last = r && (r.steps || []).filter(function (s) { return s.type === "tool"; }).pop();
        a = '<div class="oc-a"><span class="hint">' + " " +
            (!r ? "Sender …" : r.status === "i kø" ? "Assistenten starter …" : "Assistenten tænker" + (last ? " (" + esc(last.name) + ")" : "") + " …") + "</span></div>";
      } else if (r.status === "færdig") {
        a = '<div class="oc-a">' + ottoText(r.output) + '<p class="hint">' + plural(toolCount(r), "værktøjskald", "værktøjskald") + " · " + kr(r.costDkk) + "</p></div>";
      } else {
        a = '<div class="oc-a err">' + esc(r.error || "Noget gik galt.") + "</div>" + (r.output ? '<div class="oc-a">' + ottoText(r.output) + "</div>" : "");
      }
      return '<div class="oc-q"><span class="oc-me" aria-hidden="true">Dig</span>' + esc(c.q) + "</div>" +
        '<div class="oc-row">' + OTTO_MARK + '<div class="oc-body"><span class="oc-name">Assistenten</span>' + a + "</div></div>";
    }).join("");
    var busy = OCHAT.some(function (c) { return !c.run || OBUSY[c.run.status]; });
    var dis = busy ? " disabled" : "";
    box.innerHTML = (thread ? '<div class="othread" aria-live="polite">' + thread + "</div>"
        : '<div class="oc-row">' + OTTO_MARK + '<div class="oc-body"><span class="oc-name">Assistenten</span><div class="oc-a">Hvad vil du vide? Jeg kan læse dine opgaver, prognosen og kalenderen, men jeg ændrer ikke noget.</div>' +
          '<div class="oc-sugs">' + ["Når jeg alle deadlines i november?", "Hvad bør jeg starte med i dag?", "Hvor travl er næste uge?"].map(function (q) {
            return '<button class="tvchip" data-act="ottosug" type="button">' + esc(q) + "</button>"; }).join("") + "</div></div></div>") +
      '<form class="oask" id="oaskform"><label class="flab" for="oq">' + (OCHAT.length ? "Spørg videre" : "Dit spørgsmål") + "</label>" +
        '<textarea id="oq" rows="2" maxlength="2000"' + dis + "></textarea>" +
        '<div class="oask-ft"><span class="hint">Assistenten læser data, prognose og kalender. Ændringer foreslår assistenten, og dem laver du selv. Enter sender, Shift+Enter giver ny linje.</span>' +
          (OCHAT.length ? '<button class="btn" type="button" data-act="ottonew"' + dis + ">Ny samtale</button>" : "") +
          '<button class="btn primary' + (busy ? " busy" : "") + '" type="submit"' + dis + ">" + (busy ? "Assistenten svarer …" : "Spørg") + "</button></div></form>";
    var ta = document.getElementById("oq");
    ta.value = draft;
    if (focus) ta.focus();
  }

  function askOtto(q) {
    var parent = "";
    for (var i = OCHAT.length - 1; i >= 0; i--) {
      if (OCHAT[i].run && OCHAT[i].run.status === "færdig") { parent = OCHAT[i].run.id; break; }
    }
    var item = { q: q, run: null };
    OCHAT.push(item);
    fillOtto();
    api("POST", "/api/agent/runs", { kind: "spoerg", input: q, parent: parent })
      .then(function (r) {
        item.run = r.run;
        fillOtto();
        watchRun(r.run.id, function (run, busy) {
          item.run = run;
          fillOtto(!busy);
          if (!busy) { loadRuns(); loadAgent(); }
        });
      })
      .catch(function (e) {
        if (e.status === 401) { showLogin("Du er blevet logget ud. Log ind igen."); return; }
        item.run = { status: "fejlet", error: e.message, output: "", steps: [] };
        fillOtto(true);
        var ta = document.getElementById("oq");
        if (ta && !ta.value) ta.value = q;   // så spørgsmålet kan sendes igen
      });
  }

  function fillRuns() {
    var box = document.getElementById("oruns");
    if (!box || !ORUNS) return;
    if (!ORUNS.length) { box.innerHTML = '<p class="col-empty">Assistenten har ikke kørt endnu.</p>'; return; }
    box.innerHTML = '<ul class="vlist">' + ORUNS.map(function (r) {
      var open = OOPEN[r.id];
      var line = r.status === "færdig" && r.output ? '<span class="vmeta">' + esc(r.output.split("**").join("").slice(0, 160)) + (r.output.length > 160 ? " …" : "") + "</span>"
        : r.error ? '<span class="vmeta is-bad">' + esc(r.error) + "</span>" : "";
      return '<li class="vrow orun" data-act="ottorun" data-id="' + esc(r.id) + '" role="button" tabindex="0" aria-expanded="' + !!open + '">' +
          '<div class="vtxt"><b>' + esc(kindLabel(r.kind)) + (r.input ? ": " + esc(r.input) : "") + "</b>" +
          '<span class="vmeta">' + esc(TIMEFMT.format(new Date(r.createdAt))) + " · " + esc(OTRIGGER[r.trigger] || r.trigger) + " · " +
            plural(r.tools, "værktøjskald", "værktøjskald") + " · " + kr(r.costDkk) + "</span>" + line + "</div>" +
          '<span class="spill ' + (OBUSY[r.status] ? "s-i-gang" : r.status === "færdig" ? "s-faerdig" : "s-blokeret") + '">' + esc(r.status.charAt(0).toUpperCase() + r.status.slice(1)) + "</span></li>" +
        (open ? "<li>" + stepsHtml(open) + "</li>" : "");
    }).join("") + "</ul>";
  }

  function fmtTok(t) {
    t = t || {};
    var f = function (n) { return (n || 0).toLocaleString("da-DK"); };
    return f(t.input) + " tokens ind · " + f(t.output) + " ud" + (t.cacheRead ? " · " + f(t.cacheRead) + " fra cache" : "");
  }

  // Hvert trin i en kørsel: Claudes svar og hvert værktøjskald med input og (forkortet) output
  function stepsHtml(run) {
    if (run === "henter") return '<p class="hint mb-3">Henter …</p>';
    var rows = (run.steps || []).map(function (s) {
      if (s.type === "model") {
        return "<li><b>Claude</b> · " + fmtTok(s.tokens) + " · " + (s.ms / 1000).toFixed(1).replace(".", ",") + " s" +
          (s.text ? "<code>" + esc(s.text) + "</code>" : "") + "</li>";
      }
      return "<li><b>Værktøj: " + esc(s.name) + "</b> · " + s.ms + " ms<code>ind: " + esc(s.input || "{}") + "</code>" +
        (s.error ? '<code class="err">fejl: ' + esc(s.error) + "</code>" : "<code>ud: " + esc(s.output || "") + "</code>") + "</li>";
    }).join("");
    return '<ul class="osteps">' + (rows || "<li>Ingen trin.</li>") +
      "<li><b>I alt</b> · " + esc(run.model) + " · " + fmtTok(run.usage) + " · " + kr(run.costDkk) + "</li></ul>";
  }

  function toggleRun(id) {
    if (OOPEN[id]) { delete OOPEN[id]; fillRuns(); return; }
    OOPEN[id] = "henter";
    fillRuns();
    api("GET", "/api/agent/runs/" + encodeURIComponent(id))
      .then(function (r) { if (OOPEN[id]) { OOPEN[id] = r.run; fillRuns(); } })
      .catch(function (e) { delete OOPEN[id]; fillRuns(); flash("Kunne ikke hente kørslen: " + e.message, true); });
  }

  function testOtto(btn) {
    btn.disabled = true;
    api("POST", "/api/agent/runs", { kind: "ping" }).then(function (r) {
      flash("Assistenten er startet …");
      watchRun(r.run.id, function (run, busy) {
        if (busy) return;
        btn.disabled = false;
        loadAgent();
        if (run.status === "færdig") flash("Assistenten svarer: " + run.output);
        else flash("Testen fejlede: " + (run.error || run.status), true);
      });
    }).catch(function (e) { btn.disabled = false; flash(e.message, true); });
  }

  // Klik, der hører til Otto. Giver true, når klikket er håndteret.
  function ottoClick(a, el) {
    if (a === "otto") { location.hash = "otto"; return true; }
    if (a === "ottorun") { toggleRun(el.getAttribute("data-id")); return true; }
    if (a === "ottonew") { OCHAT = []; fillOtto(true); return true; }
    if (a === "ottosug") { var ta = document.getElementById("oq"); if (ta && !ta.disabled) { ta.value = el.textContent; ta.focus(); } return true; }
    if (a === "ottotest") { testOtto(el); return true; }
    return false;
  }

  document.addEventListener("submit", function (e) {
    if (!e.target || e.target.id !== "oaskform") return;
    e.preventDefault();
    var ta = document.getElementById("oq");
    var q = ta ? ta.value.trim() : "";
    if (!q) { if (ta) ta.focus(); return; }
    ta.value = "";
    askOtto(q);
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && t.id === "oq" && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      var f = document.getElementById("oaskform");
      if (f && f.requestSubmit) f.requestSubmit();
    }
  });

  // Assistentens indstillinger gemmes med det samme på serveren (ikke en del af data)
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var f = el.getAttribute("data-agent"), k = el.getAttribute("data-agentkind");
    if (!f && !k) return;
    var body = {};
    if (f === "enabled") body.enabled = el.checked;
    else if (f) body[f] = parseFloat(String(el.value).replace(",", "."));
    else {
      body.kinds = {};
      body.kinds[k] = {};
      body.kinds[k][el.getAttribute("data-field")] = el.type === "checkbox" ? el.checked : el.value;
    }
    api("PUT", "/api/agent/settings", body)
      .then(function (r) { AGENT = r; flash("Gemt."); rerenderSettingsSection("otto"); fillOtto(); })
      .catch(function (err) { flash("Kunne ikke gemme: " + err.message, true); loadAgent(); });
  });

  function ottoSettingsHtml() {
    if (!AGENT) return '<p class="hint mt-0">Henter …</p>';
    if (AGENT.error) return '<p class="hint mt-0">Kunne ikke hente assistenten: ' + esc(AGENT.error) + "</p>";
    var s = AGENT.settings;
    var setup = AGENT.configured
      ? '<p class="hint mt-0">' + " Claude API er forbundet. Assistenten læser data, prognose og kalender. " +
        "Assistenten kan ikke sende mails, svare på invitationer eller ændre kalenderen. Det er låst i koden.</p>"
      : '<p class="mb-3">Assistenten bruger Claude API, som betales pr. forbrug. Det sættes op én gang:</p>' +
        '<ol class="steps">' +
          '<li>Lav en API-nøgle på <a href="https://platform.claude.com" target="_blank" rel="noopener">platform.claude.com</a>.</li>' +
          "<li>Gem den i Cloudflare: <code>npx wrangler secret put ANTHROPIC_API_KEY</code> i repoet, og genindlæs.</li>" +
        "</ol>";
    var kinds = AGENT.kinds.map(function (k) {
      var ks = s.kinds[k.id] || {};
      return '<div class="okind"><label class="gcal"><input type="checkbox" data-agentkind="' + esc(k.id) + '" data-field="enabled"' + (ks.enabled ? " checked" : "") + ">" +
          "<span>" + esc(k.label) + (k.schedule ? ' <span class="hint">· ' + esc(k.schedule) + "</span>" : "") + "</span></label>" +
        '<select class="oselect" data-agentkind="' + esc(k.id) + '" data-field="model" aria-label="Model til ' + esc(k.label) + '">' +
          AGENT.models.map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === ks.model ? " selected" : "") + ">" + esc(m.label) + "</option>"; }).join("") +
        "</select></div>";
    }).join("");
    return setup +
      '<label class="gcal mt-2"><input type="checkbox" data-agent="enabled"' + (s.enabled ? " checked" : "") + "><span>Assistenten er slået til</span></label>" +
      '<div class="krow mt-2"><label class="klab" for="otto-budget">Dagsbudget<span class="ksub">Brugt i dag: ' + kr(AGENT.today.dkk) +
          " · " + plural(AGENT.today.runs, "kørsel", "kørsler") + "</span></label>" +
        '<span><input type="number" id="otto-budget" data-agent="budgetDkk" min="0" max="1000" step="5" value="' + s.budgetDkk + '"> kr.</span></div>' +
      '<div class="krow"><label class="klab" for="otto-kurs">Dollarkurs<span class="ksub">Claude API koster i dollar. Prisen regnes om med denne kurs.</span></label>' +
        '<span><input type="number" id="otto-kurs" data-agent="usdDkk" min="1" max="20" step="0.05" value="' + s.usdDkk + '"> kr.</span></div>' +
      '<div class="gcals mt-3"><span class="flab">Kørsler og model</span>' + kinds + "</div>" +
      '<div class="set-links mt-3"><button class="btn" data-act="ottotest" type="button"' + (AGENT.configured ? "" : " disabled") + ">Test assistenten</button>" +
        '<a class="btn" href="#otto" data-act="settingsclose">Spørg assistenten og aktivitet</a></div>' +
      '<p class="hint">Prisen regnes ud fra Claudes listepriser. Når dagsbudgettet er brugt, stopper assistenten til næste dag, og du får en notifikation. ' +
        "Morgenbriefen kommer som notifikation, når den er slået til.</p>";
  }

  /* ====================== Indbakke: mail → opgaver (M8) ======================
     "Hent mails" starter en assistent-kørsel (slagsen indbakke), der læser nye mails og laver
     forslag. Forslagene ligger på serveren uden for data. Opret laver en almindelig
     opgave og gemmer med det samme; Ignorér husker tråden, så den ikke kommer igen. */

  var INBOX = null;    // { suggestions, handled, mail: { accounts } }
  var IPULL = null;    // den kørsel, "Hent mails" har startet
  function inboxCount() { return INBOX && INBOX.suggestions ? INBOX.suggestions.length : 0; }
  function hasMail() { return !!(INBOX && INBOX.mail && INBOX.mail.accounts.some(function (a) { return a.gmail; })); }

  function loadInbox() {
    return api("GET", "/api/inbox").then(function (r) {
      INBOX = r;
      if (!DATA) return;
      var h = fromHash();
      renderSidebar(!h ? "kapacitet" : h);
      fillInbox();
    }).catch(function (e) { console.warn("Indbakken kunne ikke hentes:", e.message); });
  }

  function renderInbox() {
    renderSidebar("indbakke");
    document.title = (dirty ? "● " : "") + "Indbakke — HeyOtto Tasks";
    document.getElementById("main").innerHTML =
      pageHead("Indbakke", "Assistenten læser dine mails og foreslår opgaver. Du bestemmer, hvad der bliver oprettet.") +
      '<section class="card"><div class="card-hd"><h2>Forslag fra mail</h2>' +
        '<button class="btn primary" data-act="inboxpull" id="ipull" type="button">' + "Hent mails</button></div>" +
        '<div id="ibox"><p class="hint">Henter …</p></div></section>';
    fillInbox();
    loadInbox();
  }

  function mailDate(s) {
    var d = new Date(s);
    return isNaN(d) ? "" : TIMEFMT.format(d);
  }
  function senderName(from) { return String(from || "").replace(/\s*<[^>]+>\s*$/, "").replace(/^"|"$/g, "") || from; }

  function fillInbox() {
    var box = document.getElementById("ibox");
    if (!box) return;
    var btn = document.getElementById("ipull");
    var pulling = IPULL && OBUSY[IPULL.status];
    if (btn) {
      btn.disabled = !INBOX || !hasMail() || !!pulling;
      btn.classList.toggle("busy", !!pulling);
      btn.innerHTML = (pulling ? "Henter mails …" : "Hent mails");
    }
    if (!INBOX) { box.innerHTML = '<p class="hint">Henter …</p>'; return; }

    if (!hasMail()) {
      var accs = INBOX.mail.accounts;
      box.innerHTML = '<p class="kp-lead">Giv assistenten adgang til at læse mail</p>' +
        '<ol class="steps">' +
          '<li>Slå <b>Gmail API</b> til i dit Google Cloud-projekt: <a href="https://console.cloud.google.com/apis/library/gmail.googleapis.com" target="_blank" rel="noopener">åbn Gmail API</a> → <b>Enable</b>.</li>' +
          "<li>" + (accs.length
            ? 'Tryk <b>Giv adgang til mail</b>, vælg kontoen, og sæt flueben ved Gmail. Google viser advarslen om en „ikke verificeret app“ igen. Det er forventet til eget brug.' +
              '<div class="set-links mt-2"><a class="btn primary" data-act="gconnect" href="/api/google/connect?scopes=calendar,gmail">Giv adgang til mail</a></div>'
            : 'Forbind først en Google-konto under <button class="sf-link-ink" data-act="settings" data-section="forbindelser" type="button">Indstillinger → Forbindelser</button>.') + "</li>" +
        "</ol>" +
        '<p class="hint">Kun læsning. Assistenten kan aldrig sende, slette eller arkivere mail. Mailtekst gemmes ikke, kun assistentens korte resumé.</p>';
      return;
    }

    var status = "";
    if (IPULL) {
      var last = (IPULL.steps || []).filter(function (s) { return s.type === "tool"; }).pop();
      status = pulling
        ? '<p class="hint mb-4">' + " Assistenten læser dine mails" + (last ? " (" + esc(last.name) + ")" : "") + " …</p>"
        : IPULL.status === "færdig"
          ? '<p class="hint mb-4">' + esc(IPULL.output || "Færdig.") + " · " + kr(IPULL.costDkk) + "</p>"
          : '<p class="hint mb-4 is-bad">' + esc(IPULL.error || "Det gik galt.") + "</p>";
    }

    var list = INBOX.suggestions.map(function (s) {
      var p = projById(s.project);
      var meta = [];
      if (s.due) meta.push("deadline " + FC.shortDate(s.due));
      if (s.estimate) meta.push("ca. " + fmt(s.estimate) + " t (Assistentens estimat)");
      if (s.confidence < 0.5) meta.push("Assistenten er i tvivl");
      return '<li class="isug"><div class="isug-hd"><b>' + esc(s.title) + "</b>" +
          projTag(p || projById(generalProjectId())) + "</div>" +
        '<span class="vmeta">' + esc(senderName(s.from)) + " · " + esc(s.subject || "(intet emne)") + (mailDate(s.date) ? " · " + esc(mailDate(s.date)) : "") + "</span>" +
        (s.note ? '<p class="isug-note">' + esc(s.note) + "</p>" : "") +
        (meta.length ? '<span class="vmeta">' + esc(meta.join(" · ")) + "</span>" : "") +
        '<div class="set-links mt-3">' +
          '<button class="btn primary" data-act="inboxdirect" data-id="' + esc(s.id) + '" type="button">Opret</button>' +
          '<button class="btn" data-act="inboxedit" data-id="' + esc(s.id) + '" type="button">Ret og opret</button>' +
          '<button class="btn" data-act="inboxignore" data-id="' + esc(s.id) + '" type="button">Ignorér</button>' +
          '<a class="btn" href="' + esc(s.url) + '" target="_blank" rel="noopener">Åbn mail</a>' +
        "</div></li>";
    }).join("");

    var handled = (INBOX.handled || []).map(function (s) {
      return '<li class="vrow"><div class="vtxt"><b>' + esc(s.title) + '</b><span class="vmeta">' + esc(senderName(s.from)) + " · " + esc(s.subject) + "</span></div>" +
        '<span class="spill ' + (s.status === "oprettet" ? "s-faerdig" : "s-droppet") + '">' + esc(s.status.charAt(0).toUpperCase() + s.status.slice(1)) + "</span></li>";
    }).join("");

    box.innerHTML = status +
      (list ? '<ul class="isugs">' + list + "</ul>"
            : '<p class="col-empty">Ingen nye forslag. Tryk <b>Hent mails</b>, så læser assistenten de seneste 3 dages mails.</p>') +
      (handled ? '<details class="ihandled"><summary>Behandlet (' + INBOX.handled.length + ")</summary><ul class=\"vlist\">" + handled + "</ul></details>" : "") +
      '<p class="hint mt-4">Assistenten springer kampagner, sociale, opdateringer og sendte mails over. Nye opgaver får 0 timer i denne uge, så de ikke trækker tid, før du siger det.</p>';
  }

  function suggestion(id) { return INBOX ? INBOX.suggestions.filter(function (s) { return s.id === id; })[0] : null; }

  function taskPreset(s) {
    var proj = projById(s.project) ? s.project : generalProjectId();
    var note = (s.note ? s.note.slice(0, 300) + "\n" : "") + "Fra mail: " + s.url;
    return { project: proj, start: TODAY_ISO.slice(0, 7), title: s.title, due: s.due || "", note: note,
             remaining: s.estimate || undefined, source: { type: "gmail", id: s.threadId, url: s.url } };
  }

  function markSuggestion(s, status, taskId) {
    INBOX.suggestions = INBOX.suggestions.filter(function (x) { return x.id !== s.id; });
    s.status = status;
    INBOX.handled = [s].concat(INBOX.handled || []);
    fillInbox();
    renderSidebar("indbakke");
    return api("PUT", "/api/inbox/" + encodeURIComponent(s.id), { status: status, taskId: taskId || "" })
      .catch(function (e) { flash("Kunne ikke gemme forslagets status: " + e.message, true); loadInbox(); });
  }

  function pullMail(btn) {
    btn.disabled = true;
    api("POST", "/api/agent/runs", { kind: "indbakke" }).then(function (r) {
      IPULL = r.run;
      fillInbox();
      watchRun(r.run.id, function (run, busy) {
        IPULL = run;
        fillInbox();
        if (!busy) loadInbox();
      });
    }).catch(function (e) {
      if (e.status === 401) { showLogin("Du er blevet logget ud. Log ind igen."); return; }
      btn.disabled = false;
      flash(e.message, true);
    });
  }

  function inboxClick(a, el) {
    if (a === "indbakke") { location.hash = "indbakke"; return true; }
    if (a === "inboxpull") { pullMail(el); return true; }
    var s = el.getAttribute && suggestion(el.getAttribute("data-id"));
    if (!s && /^inbox(direct|edit|ignore)$/.test(a)) return true;
    if (a === "inboxignore") { markSuggestion(s, "ignoreret"); flash("Ignoreret. Tråden kommer ikke igen, medmindre der kommer et nyt svar."); return true; }
    if (a === "inboxdirect") {
      var pr = taskPreset(s);
      var o = { id: slug(pr.project.slice(0, 5) + "-" + s.title, DATA.tasks.map(function (x) { return x.id; })),
                title: s.title, project: pr.project, sprint: "", start: pr.start, end: "", status: "Ikke startet",
                owner: "", due: pr.due, epic: "", hours: 0, note: pr.note, source: pr.source };
      if (s.estimate) o.remaining = s.estimate;
      DATA.tasks.push(o);
      markDirty();
      save();
      markSuggestion(s, "oprettet", o.id);
      return true;
    }
    if (a === "inboxedit") {
      var preset = taskPreset(s);
      preset.onCreate = function (o) {
        markSuggestion(s, "oprettet", o.id);
        setTimeout(function () { save(); }, 0);   // efter dialogen har lukket og markeret ændringen
      };
      editTask(null, preset);
      return true;
    }
    return false;
  }

  /* ====================== Omplanlæg med assistenten (M9) ======================
     Assistenten foreslår en ændringsliste. Serveren har tjekket hver ændring og regnet
     prognosen før og efter. Anvend lægger de valgte ændringer ind og gemmer; alt kan
     fortrydes under Historik. Deadlines og "droppet" er fravalgt som standard. */

  var PLAN = null;     // det viste forslag
  var PRUN = null;     // kørslen, der laver et forslag lige nu
  var PCHECK = {};     // ændringsnummer → valgt
  var PFIELD = { sprint: "Sprint", start: "Starter", end: "Slutter", hours: "Timer pr. uge", remaining: "Timer tilbage",
                 priority: "Prioritet", status: "Status", due: "Deadline" };

  function planValue(field, v) {
    if (v === null || v === undefined || v === "") return field === "sprint" ? "ingen sprint" : "—";
    if ((field === "sprint" || field === "start" || field === "end") && /^\d{4}-\d{2}$/.test(v)) return miLabel(mi(v), true);
    if (field === "due" && isDate(v)) return FC.shortDate(v);
    if (field === "hours" || field === "remaining") return fmt(num(v)) + " t";
    return String(v);
  }

  function setPlan(p) {
    PLAN = p;
    PCHECK = {};
    (p ? p.changes : []).forEach(function (c, i) { PCHECK[i] = c.field !== "due" && !(c.field === "status" && c.to === "Droppet") && !c.needsAgreement; });
  }

  function renderPlan() {
    renderSidebar(null);
    document.title = (dirty ? "● " : "") + "Omplanlæg — HeyOtto Tasks";
    document.getElementById("main").innerHTML =
      pageHead("Omplanlæg med assistenten", "Assistenten foreslår ændringer, så alle deadlines når i mål. Du vælger, hvad der bliver lagt ind.") +
      '<section class="card">' +
        '<form class="oask" id="planform"><label class="flab" for="pmsg">Noget, assistenten skal vide? (valgfrit)</label>' +
          '<textarea id="pmsg" rows="2" maxlength="2000" placeholder="Fx „Jeg er syg torsdag“ eller „Africa Tours 2.0 har forrang“"></textarea>' +
          '<div class="oask-ft"><span class="hint">Assistenten læser opgaver, prognose og kalender. Intet ændres, før du trykker Anvend.</span>' +
            '<button class="btn primary" type="submit" id="pgo">' + "Lav forslag</button></div></form>" +
      "</section>" +
      '<section class="card"><div class="card-hd"><h2>Forslaget</h2></div><div id="pbox"></div></section>';
    fillPlan();
    if (!PLAN && !PRUN) {
      api("GET", "/api/plans").then(function (r) {
        var p = (r.plans || []).filter(function (x) { return x.status === "ny"; })[0];
        if (p && !PLAN) { setPlan(p); fillPlan(); }
      }).catch(function () {});
    }
  }

  function metricRow(b, a) {
    var cell = function (label, x, y) {
      var tone = y < x ? " good" : y > x ? " bad" : "";
      return '<div class="mcard' + tone + '"><span class="stat-k">' + label + '</span><b class="num">' + x + ' <span aria-hidden="true">→</span><span class="sr-only">bliver til</span> ' + y + "</b></div>";
    };
    return '<div class="mcards">' +
      cell("I risiko eller over deadline", b.atRisk + b.overdue, a.atRisk + a.overdue) +
      cell("Røde alarmer", b.red, a.red) +
      cell("Overbookede uger", b.overbookedWeeks, a.overbookedWeeks) + "</div>";
  }

  function fillPlan() {
    var box = document.getElementById("pbox");
    if (!box) return;
    var go = document.getElementById("pgo");
    var busy = PRUN && OBUSY[PRUN.status];
    if (go) { go.disabled = !!busy; go.classList.toggle("busy", !!busy); go.innerHTML = (busy ? "Laver forslag …" : "Lav forslag"); }
    if (busy) {
      var last = (PRUN.steps || []).filter(function (s) { return s.type === "tool"; }).pop();
      box.innerHTML = '<p class="hint">' + " Assistenten laver et forslag" + (last ? " (" + esc(last.name) + ")" : "") + " … Det tager typisk et minut.</p>";
      return;
    }
    if (PRUN && !PLAN) {
      box.innerHTML = PRUN.status === "færdig"
        ? '<p class="kp-lead">' + esc(PRUN.output || "Assistenten lavede intet forslag.") + "</p>"
        : '<p class="hint is-bad">' + esc(PRUN.error || "Det gik galt.") + "</p>";
      return;
    }
    if (!PLAN) { box.innerHTML = '<p class="col-empty">Intet forslag endnu. Tryk <b>Lav forslag</b>.</p>'; return; }

    var p = PLAN, done = p.status !== "ny";
    var rows = p.changes.map(function (c, i) {
      var t = taskById(c.taskId);
      var proj = projById(c.project);
      return '<li class="pchg"><label class="gcal"><input type="checkbox" data-planchk="' + i + '"' + (PCHECK[i] ? " checked" : "") + (done ? " disabled" : "") + ">" +
          "<span><b>" + esc(t ? t.title : c.title) + "</b>" + (proj ? ' <span class="hint">· ' + esc(proj.name) + "</span>" : "") +
          '<span class="pchg-what">' + esc(PFIELD[c.field] || c.field) + ": " + esc(planValue(c.field, c.from)) + " → <b>" + esc(planValue(c.field, c.to)) + "</b>" +
            (c.needsAgreement ? ' <span class="tag">kræver aftale</span>' : "") + "</span>" +
          (c.reason ? '<span class="vmeta">' + esc(c.reason) + "</span>" : "") + "</span></label></li>";
    }).join("");
    var nChecked = p.changes.filter(function (c, i) { return PCHECK[i]; }).length;
    box.innerHTML =
      '<p class="kp-lead sm">' + esc(p.summary || "Forslag fra assistenten") + "</p>" +
      metricRow(p.before, p.after) +
      '<p class="hint mt-2 mb-4">Før/efter er regnet af prognosen med alle ændringer valgt, ikke af Claude.</p>' +
      (rows ? '<ul class="pchgs">' + rows + "</ul>" : '<p class="col-empty">Ingen ændringer i forslaget.</p>') +
      (p.questions && p.questions.length ? '<div class="pq"><span class="flab">Assistenten spørger</span><ul>' +
        p.questions.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + "</ul></div>" : "") +
      (p.dropped && p.dropped.length ? '<details class="ihandled"><summary>Afvist af serveren (' + p.dropped.length + ")</summary><ul class=\"steps\">" +
        p.dropped.map(function (d) { var t = taskById(d.taskId); return "<li>" + esc((t ? t.title : d.taskId) + " · " + d.field + ": " + d.why) + "</li>"; }).join("") + "</ul></details>" : "") +
      (done
        ? '<p class="hint mt-4">Forslaget er ' + esc(p.status) + ".</p>"
        : '<div class="set-links mt-4"><button class="btn primary" data-act="planapply" type="button"' + (nChecked ? "" : " disabled") + ">Anvend " + plural(nChecked, "valgt ændring", "valgte ændringer") + "</button>" +
          '<button class="btn" data-act="plandrop" type="button">Kassér forslaget</button></div>');
  }

  function startPlan() {
    var ta = document.getElementById("pmsg");
    var msg = ta ? ta.value.trim() : "";
    PLAN = null; PRUN = { status: "i kø", steps: [] };
    fillPlan();
    api("POST", "/api/agent/runs", { kind: "omplanlaeg", input: msg }).then(function (r) {
      PRUN = r.run;
      fillPlan();
      watchRun(r.run.id, function (run, busy) {
        PRUN = run;
        if (busy) { fillPlan(); return; }
        api("GET", "/api/plans/" + encodeURIComponent(run.id))
          .then(function (res) { setPlan(res.plan); })
          .catch(function () { PLAN = null; })
          .then(function () { fillPlan(); if (ta) ta.value = ""; });
      });
    }).catch(function (e) {
      if (e.status === 401) { showLogin("Du er blevet logget ud. Log ind igen."); return; }
      PRUN = { status: "fejlet", error: e.message, steps: [] };
      fillPlan();
    });
  }

  function applyPlan() {
    var p = PLAN, applied = 0, skipped = [];
    p.changes.forEach(function (c, i) {
      if (!PCHECK[i]) return;
      var t = taskById(c.taskId);
      if (!t) { skipped.push(c.title + " (findes ikke længere)"); return; }
      var now = t[c.field] === undefined ? (c.field === "priority" ? "normal" : null) : t[c.field];
      if (String(now === null ? "" : now) !== String(c.from === null ? "" : c.from)) { skipped.push(c.title + " (er ændret siden)"); return; }
      if (c.field === "priority" && c.to === "normal") delete t.priority; else t[c.field] = c.to;
      applied++;
    });
    if (!applied) { flash("Ingen ændringer blev lagt ind." + (skipped.length ? " Sprunget over: " + skipped.join(", ") : ""), true); return; }
    markDirty();
    api("PUT", "/api/plans/" + encodeURIComponent(p.id), { status: "anvendt" }).catch(function () {});
    p.status = "anvendt";
    fillPlan();
    save().then(function () {
      if (dirty) return;                       // gemningen fejlede: den har selv sagt hvorfor
      flash(plural(applied, "ændring er lagt ind", "ændringer er lagt ind") + " og gemt. Kan fortrydes under Historik." +
            (skipped.length ? " Sprunget over: " + skipped.join(", ") + "." : ""), !!skipped.length);
    });
  }

  function planClick(a, el) {
    if (a === "omplan") { location.hash = "omplan"; return true; }
    if (a === "planapply") { if (PLAN) applyPlan(); return true; }
    if (a === "plandrop") {
      if (!PLAN) return true;
      api("PUT", "/api/plans/" + encodeURIComponent(PLAN.id), { status: "kasseret" }).catch(function () {});
      PLAN.status = "kasseret";
      fillPlan();
      return true;
    }
    return false;
  }

  document.addEventListener("submit", function (e) {
    if (!e.target || e.target.id !== "planform") return;
    e.preventDefault();
    startPlan();
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (!el || !el.getAttribute || el.getAttribute("data-planchk") === null) return;
    PCHECK[el.getAttribute("data-planchk")] = el.checked;
    fillPlan();
  });

  /* ====================== Tasks, projekter og rutiner ======================
     Tre enheder i sidebaren, som hver kan foldes ud:
       Tasks      alle tasks: dem uden projekt, dem i projekter og dem fra rutiner
       Projekter  de større ting med mål, sprints og tidslinje (kind "projekt")
       Rutiner    det, der kommer igen. Hver forekomst bliver en task med deadline.
     Data: Ad hoc-projektet (kind "adhoc") er "uden projekt", så gamle data passer.
     Rutiner ligger i data.rutiner; deres tid tæller som fast tid pr. uge (som drift),
     og deres tasks har 0 timer, så intet tælles to gange (dashboard/lib/forecast.mjs). */

  // Hver enhed er et punkt i sidebaren, der går til sin landingsside. Listen under
  // (projekterne, rutinerne, task-visningerne) folder sig selv ud, mens man er i enheden.
  function sideSection(key, label, n, items, active, ico) {
    var open = sectionOf(active) === key;
    return '<div class="nsec' + (open ? " open" : "") + '">' +
      '<button class="proj nsec-main" data-act="gohash" data-h="' + key + '" title="' + esc(label) + '" aria-current="' + (active === key) + '" aria-expanded="' + open + '" type="button">' +
        nico(ico) + '<span class="pname">' + label + "</span>" + count(n) + "</button>" +
      (open ? '<div class="nsec-body">' + items + "</div>" : "") + "</div>";
  }

  // Hvilken enhed hører den aktuelle side til?
  function sectionOf(active) {
    if (!active) return "";
    if (active === "tasks" || active.indexOf("tasks/") === 0) return "tasks";
    if (active === "projekter" || active === "rutiner") return active;
    var p = projById(active);
    if (p) return p.kind === "drift" ? "rutiner" : (isRealProject(p) ? "projekter" : "tasks");
    return "";
  }

  function isRealProject(p) { return p && p.kind !== "drift" && p.kind !== "adhoc"; }
  function generalProjectId() {
    var p = DATA.projects.filter(function (x) { return x.kind === "adhoc"; })[0];
    if (!p) {   // findes altid i nye data, men kan være slettet i gamle
      p = { id: "adhoc", name: "Uden projekt", kind: "adhoc", tagline: "Tasks uden projekt" };
      DATA.projects.push(p);
    }
    return p.id;
  }
  function isGeneral(t) { var p = projById(t.project); return !p || p.kind === "adhoc"; }
  function weekEndIso(add) { return FC.localIso(FC.addDays(FC.weekStart(new Date()), 6 + (add || 0))); }

  var TASKVIEWS = [
    { id: "",        label: "Alle opgaver", test: function () { return true; } },
    { id: "uge",     label: "Denne uge",    test: function (t) { return (isDate(t.due) && t.due <= weekEndIso()) || num(t.hours) > 0; } },
    { id: "uden",    label: "Uden projekt", test: function (t) { return isGeneral(t) && !t.routine; } },
    { id: "rutiner", label: "Fra rutiner",  test: function (t) { return !!t.routine; } }
  ];
  function taskView(id) { return TASKVIEWS.filter(function (v) { return v.id === id; })[0] || TASKVIEWS[0]; }

  var WEEKDAYS = ["", "mandag", "tirsdag", "onsdag", "torsdag", "fredag"];
  function routineWhen(r) {
    var every = (FC.EVERY && FC.EVERY[r.every]) || "Hver uge";
    if (r.every === "uge" || r.every === "2uger") every += ", " + WEEKDAYS[Number(r.weekday) || 5];
    if (r.every === "maaned") every += ", " + (Number(r.monthday) ? "d. " + Number(r.monthday) : "sidste dag");
    return every + (num(r.hours) ? " · " + fmt(num(r.hours)) + " t" : "");
  }
  function routineById(id) { return (DATA.rutiner || []).filter(function (r) { return r.id === id; })[0] || null; }
  function routineNext(r) {
    var o = FC.occurrences(r, TODAY_ISO, FC.localIso(FC.addDays(new Date(), 70)));
    return o[0] || "";
  }

  /* ----- Rutiner bliver til tasks -----
     Når appen åbnes, og når en rutine gemmes: de forekomster, der falder i dag og de
     næste 7 dage, bliver til tasks. Id'et er fast (r-<rutine>-<dato>), så to enheder
     laver den samme task, og fletningen ser dem som én. last husker den seneste
     forekomst, så en task, du har slettet, ikke kommer igen. */
  var ROUTINE_DAYS = 7;
  function materializeRoutines() {
    var list = DATA.rutiner || [], made = 0;
    if (!list.length || !FC.occurrences) return 0;
    var gen = null;
    list.forEach(function (r) {
      if (!r || r.active === false) return;
      // Daglige rutiner: kun dagens task, så listen ikke drukner. Andre: den næste uge.
      var horizon = r.every === "dag" ? TODAY_ISO : FC.localIso(FC.addDays(new Date(), ROUTINE_DAYS));
      var from = r.last && r.last >= TODAY_ISO ? FC.localIso(FC.addDays(FC.dateOnly(r.last), 1)) : TODAY_ISO;
      FC.occurrences(r, from, horizon).slice(0, 30).forEach(function (occ) {
        var id = "r-" + r.id + "-" + occ;
        if (!taskById(id)) {
          gen = gen || generalProjectId();
          DATA.tasks.push({ id: id, title: r.name, project: r.project && projById(r.project) ? r.project : gen,
                            sprint: "", start: occ.slice(0, 7), end: "", status: "Ikke startet", owner: r.owner || "",
                            due: occ, epic: "", hours: 0, note: r.note || "", routine: r.id });
          made++;
        }
        if (!r.last || occ > r.last) r.last = occ;
      });
    });
    return made;
  }

  // Når en rutine ændres: fremtidige, urørte tasks fra den laves om efter den nye plan
  function resetRoutineTasks(r) {
    DATA.tasks = DATA.tasks.filter(function (t) {
      return !(t.routine === r.id && t.due >= TODAY_ISO && stat(t).key === "ikke-startet");
    });
    r.last = "";
  }

  /* ----- Tasks-siden ----- */

  function tasksHead(title) {
    return '<div class="phead"><div><h1>' + esc(title) + "</h1></div>" + headActions(true) + "</div>";
  }

  function taskContext(t) {
    if (t.routine) { var r = routineById(t.routine); return "Rutine" + (r ? " · " + r.name : ""); }
    var p = projById(t.project);
    if (!p || p.kind === "adhoc") return "Uden projekt";
    return p.name;
  }

  var TASKSEARCH = "";
  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "tsearch") { TASKSEARCH = e.target.value; route(); }
  });
  function renderTasks(v) {
    var view = taskView(v);
    renderSidebar(view.id ? "tasks/" + view.id : "tasks");
    document.title = (dirty ? "● " : "") + "Tasks — HeyOtto Tasks";
    var q = TASKSEARCH.trim().toLowerCase();
    var list = DATA.tasks.filter(function (t) {
      return isLive(t) && view.test(t) && (!q || (String(t.title) + " " + taskContext(t)).toLowerCase().indexOf(q) >= 0);
    });
    var today = TODAY_ISO, we = weekEndIso(), nwe = weekEndIso(7);
    var buckets = [
      { label: "Over deadline", tone: "red", test: function (t) { return isDate(t.due) && t.due < today; } },
      { label: "I dag",         tone: "violet", test: function (t) { return t.due === today; } },
      { label: "Resten af ugen", tone: "blue", test: function (t) { return isDate(t.due) && t.due > today && t.due <= we; } },
      { label: "Næste uge",     tone: "teal", test: function (t) { return isDate(t.due) && t.due > we && t.due <= nwe; } },
      { label: "Senere",        tone: "slate", test: function (t) { return isDate(t.due) && t.due > nwe; } },
      { label: "Uden deadline", tone: "slate", test: function (t) { return !isDate(t.due); } }
    ];
    var groups = buckets.map(function (b) {
      var ts = list.filter(b.test).sort(function (a, c) {
        return (a.due || "9") < (c.due || "9") ? -1 : (a.due || "9") > (c.due || "9") ? 1 : String(a.title).localeCompare(String(c.title), "da");
      });
      if (!ts.length) return "";
      return '<section class="card grp g-' + b.tone + '"><div class="grp-hd"><span class="grp-mk" aria-hidden="true"></span><h2>' + b.label + "</h2>" +
        '<span class="grp-n num">' + ts.length + "</span></div>" +
        '<div class="trh" aria-hidden="true"><span></span><span>Opgave</span><span>Projekt</span><span>Status</span><span>Timer</span><span>Deadline</span></div>' +
        '<ul class="tlist">' + ts.map(taskRow).join("") + "</ul></section>";
    }).join("");
    document.getElementById("main").innerHTML =
      '<div class="phead"><div><h1>' + esc(view.id ? view.label : "Opgaver") + "</h1></div>" +
        '<div class="pacts"><button class="btn primary" data-act="tasknew" type="button">+ Ny opgave</button>' + saveBtn() + "</div></div>" +
      // Tallene står i filtrene, de tæller. Over deadline står som den første gruppe i listen.
      '<div class="toolbar"><div class="tviews" role="group" aria-label="Visning">' + TASKVIEWS.map(function (x) {
        var n = DATA.tasks.filter(function (t) { return isLive(t) && x.test(t); }).length;
        return '<button class="tvchip" data-act="tasksview" data-v="' + x.id + '" aria-pressed="' + (x.id === view.id) + '" type="button">' +
          (x.id ? x.label : "Alle") + ' <span class="num tvn">' + n + "</span></button>";
      }).join("") + "</div>" +
        '<label class="tsearch">' + icon("search") + '<input id="tsearch" type="search" placeholder="Søg i opgaver" aria-label="Søg i opgaver" value="' + esc(TASKSEARCH) + '"></label></div>' +
      '<section class="card"><form class="tquick" id="tquick"><input id="tq" type="text" maxlength="120" placeholder="Skriv en ny opgave uden projekt, og tryk Enter" aria-label="Ny opgave">' +
        '<button class="btn" type="submit">Tilføj</button></form></section>' +
      (groups || '<section class="card"><p class="col-empty">' + (q ? "Ingen opgaver matcher „" + esc(TASKSEARCH) + "“." : "Ingen åbne opgaver her.") + "</p></section>");
  }

  function taskRow(t) {
    var late = isDate(t.due) && t.due < TODAY_ISO;
    var st = stat(t);
    var p = projById(t.project), rt = t.routine ? routineById(t.routine) : null;
    var meta = num(t.remaining) > 0 ? fmt(num(t.remaining)) + " t tilbage" : (rt ? "Rutine: " + rt.name : "");
    return '<li class="trow2"><input type="checkbox" class="tchk" data-act="taskdone" data-id="' + esc(t.id) + '" aria-label="Markér „' + esc(t.title) + '“ som færdig">' +
      '<button class="ttitle" data-act="task" data-id="' + esc(t.id) + '" type="button">' + esc(t.title) +
        (meta ? '<span class="tmeta">' + esc(meta) + "</span>" : "") + "</button>" +
      '<span class="tline">' + projTag(p) + statusPill(t) + "</span>" +
      '<span class="th num">' + (num(t.hours) > 0 ? fmt(num(t.hours)) + " t/uge" : "—") + "</span>" +
      '<span class="tdue num' + (late ? " late" : t.due === TODAY_ISO ? " today" : "") + '">' + (isDate(t.due) ? FC.shortDate(t.due) : "") + "</span></li>";
  }

  function quickAdd(title) {
    var gen = generalProjectId();
    var id = slug("task-" + title, DATA.tasks.map(function (x) { return x.id; }));
    DATA.tasks.push({ id: id, title: title, project: gen, sprint: "", start: TODAY_ISO.slice(0, 7), end: "",
                      status: "Ikke startet", owner: "", due: "", epic: "", hours: 0, note: "" });
    markDirty();
    var input = document.getElementById("tq");
    if (input) input.focus();
  }

  /* ----- Landingssidernes nøgletal ----- */

  function riskOf(t) { var f = taskForecast(t); return f && (f.status === "risiko" || f.status === "over"); }
  function nextDue(list) {
    return list.filter(function (t) { return isDate(t.due); }).sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; })[0] || null;
  }

  /* ----- Projekter-siden ----- */

  function renderProjects() {
    renderSidebar("projekter");
    document.title = (dirty ? "● " : "") + "Projekter — HeyOtto Tasks";
    var projects = DATA.projects.filter(isRealProject);
    var cards = projects.map(function (p) {
      var ts = tasksOf(p.id), live = ts.filter(isLive);
      var counted = ts.filter(function (t) { return stat(t).key !== "droppet"; });
      var done = counted.filter(function (t) { return stat(t).key === "faerdig"; }).length;
      var pct = counted.length ? Math.round(done / counted.length * 100) : 0;
      var risk = live.filter(riskOf).length;
      var blocked = live.filter(function (t) { return stat(t).key === "blokeret"; }).length;
      var h = live.reduce(function (s, t) { return s + num(t.hours); }, 0);
      var sp = pickSprint(DATA.sprints.filter(function (s) { return s.project === p.id; }));
      var nd = nextDue(live);
      return '<a class="card pbox" href="#' + esc(p.id) + '">' +
        '<div class="pbox-hd">' + projBadge(p, "md") + '<div class="pbox-t"><b>' + esc(p.name) + "</b>" +
          (p.tagline ? '<span class="pcard-tag">' + esc(p.tagline) + "</span>" : "") + "</div></div>" +
        '<div class="pbox-nums">' +
          '<div><b class="num">' + live.length + '</b><span>åbne</span></div>' +
          '<div><b class="num">' + done + '</b><span>færdige</span></div>' +
          '<div><b class="num">' + fmt(h) + '</b><span>t/uge</span></div>' +
          ring(counted.length ? done / counted.length : 0, false, pct + " % færdig") + "</div>" +
        ((risk || blocked) ? '<div class="pbox-flags">' +
          (blocked ? '<span class="spill s-blokeret"><span class="num">' + blocked + "</span> blokeret</span>" : "") +
          (risk ? '<span class="spill s-ukendt"><span class="num">' + risk + "</span> i risiko</span>" : "") + "</div>" : "") +
        (sp ? '<div class="pbox-line"><span class="stat-k">' + esc(sp.tag) + " sprint, " + esc(miLabel(mi(sp.s.month), true)) + "</span>" +
              (sp.s.goal ? "<span>" + esc(sp.s.goal) + "</span>" : '<span class="hint">Intet mål skrevet</span>') + "</div>" : "") +
        (nd ? '<div class="pbox-line"><span class="stat-k">Næste deadline</span><span' + (nd.due < TODAY_ISO ? ' class="late"' : "") + ">" +
              FC.shortDate(nd.due) + ": " + esc(nd.title) + "</span></div>" : "") +
        "</a>";
    }).join("");
    document.getElementById("main").innerHTML =
      '<div class="phead"><div><h1>Projekter</h1></div><div class="pacts">' +
        '<button class="btn primary" data-act="newproj" type="button">+ Nyt projekt</button>' + saveBtn() + "</div></div>" +
      '<div class="pboxes">' + cards +
        '<button class="pbox-new" data-act="newproj" type="button"><span class="plus" aria-hidden="true">+</span>Nyt projekt</button></div>';
  }

  /* ----- Rutiner-siden ----- */

  function renderRoutines() {
    renderSidebar("rutiner");
    document.title = (dirty ? "● " : "") + "Rutiner — HeyOtto Tasks";
    var list = DATA.rutiner || [];
    var rows = list.map(function (r) {
      var nxt = routineNext(r), proj = r.project && projById(r.project);
      var perWeek = FC.routineWeeklyHours({ rutiner: [Object.assign({}, r, { active: true })] });
      var paused = r.active === false;
      return '<li class="rrow' + (paused ? " paused" : "") + '"><span class="rico" aria-hidden="true">' + icon("cal") + "</span>" +
        '<div class="vtxt"><b>' + esc(r.name) + "</b>" +
        '<span class="vmeta">' + esc(FC.EVERY && FC.EVERY[r.every] || "") + (proj ? ", " + esc(proj.name) : "") +
          (r.studio_flow_id ? " · flow i Studio: " + esc(studioFlowName(r.studio_flow_id)) : "") + "</span></div>" +
        '<span class="rnum num">' + (perWeek ? fmt(perWeek) + " t/uge" : "—") + "</span>" +
        '<span class="rnext num">' + (nxt && !paused ? "Næste " + FC.shortDate(nxt) : "") + "</span>" +
        (paused ? '<span class="spill s-droppet">Pause</span>' : '<span class="spill s-faerdig">Aktiv</span>') +
        '<span class="racts">' +
          (r.studio_flow_id ? '<button class="btn" data-act="routinestudio" data-id="' + esc(r.id) + '" type="button">Kør i Studio</button>' : "") +
          '<button class="btn" data-act="routine" data-id="' + esc(r.id) + '" type="button">Rediger</button></span></li>';
    }).join("");
    var drift = DATA.projects.filter(function (p) { return p.kind === "drift"; })[0];
    var driftTasks = drift ? tasksOf(drift.id).filter(isLive) : [];
    var driftHtml = driftTasks.length
      ? '<section class="card"><div class="card-hd"><h2>Faste opgaver i ' + esc(drift.name) + "</h2>" +
          '<span class="hint">Løbende arbejde med timer pr. uge. Gør dem til rutiner, så de får en deadline hver gang.</span></div>' +
        '<div class="card-pad"><ul class="vlist">' + driftTasks.map(function (t) {
          return '<li class="vrow"><div class="vtxt"><b>' + esc(t.title) + '</b><span class="vmeta">' + fmt(num(t.hours)) + " t/uge</span></div>" +
            '<button class="btn" data-act="drift2routine" data-id="' + esc(t.id) + '" type="button">Gør til rutine</button></li>';
        }).join("") + "</ul></div></section>"
      : "";
    var active = list.filter(function (r) { return r.active !== false; });
    var upcoming = DATA.tasks.filter(function (t) { return t.routine && isLive(t) && isDate(t.due) && t.due <= weekEndIso(7); })
      .sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
    var missed = upcoming.filter(function (t) { return t.due < TODAY_ISO; }).length;
    document.getElementById("main").innerHTML =
      '<div class="phead"><div><h1>Rutiner</h1></div><div class="pacts">' +
        '<button class="btn primary" data-act="newroutine" type="button">+ Ny rutine</button>' + saveBtn() + "</div></div>" +
      (upcoming.length ? '<section class="card"><div class="card-hd"><h2>Kommende</h2>' +
        (missed ? '<span class="hint is-bad">' + plural(missed, "ikke gjort", "ikke gjort") + "</span>" : "") + "</div>" +
        '<div class="trh" aria-hidden="true"><span></span><span>Opgave</span><span>Projekt</span><span>Status</span><span>Timer</span><span>Deadline</span></div>' +
        '<ul class="tlist">' + upcoming.map(taskRow).join("") + "</ul></section>" : "") +
      '<section class="card"><div class="card-hd"><h2>Dine rutiner</h2>' +
        '<span class="hint num">' + fmt(FC.routineWeeklyHours(DATA)) + " t pr. uge i kapaciteten" +
          (list.length > active.length ? ", " + (list.length - active.length) + " på pause" : "") + "</span>" +
        "</div>" +
        '<div class="card-pad">' +
          (rows ? '<ul class="rlist">' + rows + "</ul>"
                : '<p class="col-empty">Ingen rutiner endnu. Fx „Ugerapport hver fredag“ eller „Månedsrapport sidste dag i måneden“.</p>') +
          '<p class="hint mt-4">Rutinens timer tæller som fast tid pr. uge i kapaciteten. Opgaver fra rutiner laves for de næste ' + ROUTINE_DAYS +
            " dage (daglige kun for i dag), og de har 0 timer, så tiden ikke tælles to gange.</p>" +
        "</div></section>" + driftHtml;
  }

  function editRoutine(id, preset) {
    var isNew = !id;
    var r = isNew ? Object.assign({ name: "", every: "uge", weekday: 5, monthday: 0, hours: 1, project: "", note: "", active: true }, preset || {})
                  : routineById(id);
    if (!r) return;
    var projOpts = [{ v: "", t: "Uden projekt" }].concat(DATA.projects.filter(isRealProject).map(function (p) { return { v: p.id, t: p.name }; }));
    var everyOpts = Object.keys(FC.EVERY).map(function (k) { return { v: k, t: FC.EVERY[k] }; });
    var dayOpts = [1, 2, 3, 4, 5].map(function (d) { return { v: String(d), t: WEEKDAYS[d].charAt(0).toUpperCase() + WEEKDAYS[d].slice(1) }; });
    var mdOpts = [{ v: "0", t: "Sidste dag i måneden" }];
    for (var d = 1; d <= 28; d++) mdOpts.push({ v: String(d), t: d + "." });
    openDialog(isNew ? "Ny rutine" : "Rediger rutine",
      field("Navn", '<input id="r-name" type="text" maxlength="120" value="' + esc(r.name) + '">') +
      '<div class="fgrid">' +
        field("Gentages", '<select id="r-every">' + opts(everyOpts, r.every) + "</select>") +
        field("Timer pr. gang", '<input id="r-hours" type="number" min="0" max="40" step="0.25" value="' + num(r.hours) + '">', "tæller som fast tid pr. uge") +
      "</div>" +
      '<div class="fgrid">' +
        field("Ugedag", '<select id="r-weekday">' + opts(dayOpts, String(r.weekday || 5)) + "</select>", "ved hver uge og hver anden uge") +
        field("Dag i måneden", '<select id="r-monthday">' + opts(mdOpts, String(r.monthday || 0)) + "</select>", "ved hver måned · weekend → fredagen før") +
      "</div>" +
      field("Projekt", '<select id="r-project">' + opts(projOpts, r.project || "") + "</select>", "valgfrit — ellers ligger opgaverne under „Uden projekt“") +
      field("Note", '<textarea id="r-note" rows="2" maxlength="400">' + esc(r.note || "") + "</textarea>", "følger med hver opgave") +
      field("Flow i Studio", '<select id="r-flow"></select>', "Studio ejer trinene, rutinen ejer hvornår. Studio starter flowet på rutinens dage og venter på din godkendelse.") +
      '<div class="rflow" id="r-flowfields"></div>' +
      '<label class="gcal mt-2"><input type="checkbox" id="r-active"' + (r.active !== false ? " checked" : "") + "><span>Aktiv (sæt på pause ved at fjerne fluebenet)</span></label>",
      function () {
        var name = val("r-name");
        if (!name) return ["r-name", "Rutinen skal have et navn."];
        var link = readRoutineFlow();
        if (link.error) return link.error;
        var o = isNew ? {} : r;
        if (!isNew) resetRoutineTasks(o);
        if (link.id) { o.studio_flow_id = link.id; o.studio_inputs = link.inputs; o.studio_toggles = link.toggles; }
        else { delete o.studio_flow_id; delete o.studio_inputs; delete o.studio_toggles; }
        o.name = name; o.every = val("r-every"); o.hours = Math.max(0, num(val("r-hours")));
        o.weekday = Number(val("r-weekday")) || 5; o.monthday = Number(val("r-monthday")) || 0;
        o.project = val("r-project"); o.note = val("r-note");
        o.active = !!dlg.querySelector("#r-active").checked;
        if (isNew) {
          if (!DATA.rutiner) DATA.rutiner = [];
          o.id = slug(name, DATA.rutiner.map(function (x) { return x.id; }));
          o.last = "";
          DATA.rutiner.push(o);
          if (preset && preset.onCreate) preset.onCreate(o);
        }
        materializeRoutines();
        return null;
      },
      isNew ? null : function () {
        DATA.rutiner = DATA.rutiner.filter(function (x) { return x.id !== r.id; });
        return null;
      }, "Rutinen „" + r.name + "“ (opgaverne, den har lavet, bliver liggende)");
    routineFlowForm(r);
  }

  /* ----- Rutiner forbundet med flows i Studio (M18) -----
     Rutinen gemmer kun flowets id og sine standardværdier (studio_flow_id, studio_inputs,
     studio_toggles). Flowene hentes fra Studio, når dialogen åbnes. Er Studio slukket, kan
     det valgte flow stadig beholdes; felterne vises så ud fra det, rutinen allerede har. */
  var STUDIO_FLOWS = null, STUDIO_FLOWS_ERR = "";
  function studioFlowName(id) {
    var f = (STUDIO_FLOWS || []).filter(function (x) { return x.id === id; })[0];
    return f ? f.name : id;
  }
  function routineFlowForm(r) {
    var sel = dlg.querySelector("#r-flow");
    if (!sel) return;
    var cur = r.studio_flow_id || "";
    var vals = { inputs: Object.assign({}, r.studio_inputs || {}), toggles: Object.assign({}, r.studio_toggles || {}) };
    var fill = function () {
      var list = STUDIO_FLOWS || [];
      var o = [{ v: "", t: STUDIO_FLOWS ? "Intet flow" : (STUDIO_FLOWS_ERR ? "Intet flow (" + STUDIO_FLOWS_ERR + ")" : "Henter Studios flows …") }]
        .concat(list.map(function (f) { return { v: f.id, t: f.name }; }));
      if (cur && !list.some(function (f) { return f.id === cur; })) o.push({ v: cur, t: cur + (STUDIO_FLOWS ? " (findes ikke i Studio)" : "") });
      sel.innerHTML = opts(o, cur);
      renderRoutineFlowFields(cur, vals);
    };
    sel.onchange = function () {
      // Værdierne for det forrige flow huskes, så et skift frem og tilbage ikke sletter dem.
      var now = readRoutineFlow();
      Object.assign(vals.inputs, now.inputs || {}); Object.assign(vals.toggles, now.toggles || {});
      cur = sel.value;
      renderRoutineFlowFields(cur, vals);
    };
    fill();
    if (STUDIO_FLOWS) return;
    api("GET", "/api/studio/flows").then(function (res) {
      STUDIO_FLOWS = res.flows || []; STUDIO_FLOWS_ERR = "";
      if (dlg.open && dlg.querySelector("#r-flow") === sel) fill();
    }, function (e) {
      STUDIO_FLOWS_ERR = e.status === 400 ? "Studio er ikke forbundet" : "Studio kan ikke nås";
      if (dlg.open && dlg.querySelector("#r-flow") === sel) fill();
    });
  }
  function renderRoutineFlowFields(id, vals) {
    var box = dlg.querySelector("#r-flowfields");
    if (!box) return;
    var f = id && (STUDIO_FLOWS || []).filter(function (x) { return x.id === id; })[0];
    if (!id) { box.innerHTML = ""; return; }
    // Uden Studio: vis de værdier, rutinen har, så de kan rettes og beholdes.
    var fields = f ? f.fields : Object.keys(vals.inputs).map(function (k) { return { key: k, label: k, required: false }; });
    var toggles = f ? f.toggles : Object.keys(vals.toggles).map(function (k) { return { key: k, label: k, default: true }; });
    box.innerHTML =
      (f && f.description ? '<p class="hint">' + esc(f.description) + "</p>" : "") +
      fields.map(function (i) {
        var v = vals.inputs[i.key] != null ? vals.inputs[i.key] : "";
        return field(esc(i.label) + (i.required && !i.default ? " *" : ""),
          '<input type="text" maxlength="2000" data-input="' + esc(i.key) + '" id="r-in-' + esc(i.key) + '" value="' + esc(v) + '"' +
          (i.default ? ' placeholder="' + esc(i.default) + '"' : "") + ">");
      }).join("") +
      toggles.map(function (t) {
        var on = vals.toggles[t.key] != null ? vals.toggles[t.key] : t.default !== false;
        return '<label class="gcal"><input type="checkbox" data-toggle="' + esc(t.key) + '"' + (on ? " checked" : "") + "><span>" + esc(t.label) + "</span></label>";
      }).join("") +
      (!fields.length && !toggles.length ? '<p class="hint">Flowet har hverken input eller noget at slå til og fra.</p>' : "");
  }
  // Læser dialogens flowvalg. Påkrævede input uden standardværdi skal udfyldes.
  function readRoutineFlow() {
    var sel = dlg.querySelector("#r-flow");
    var id = sel ? sel.value : "";
    var inputs = {}, toggles = {}, missing = null;
    var f = id && (STUDIO_FLOWS || []).filter(function (x) { return x.id === id; })[0];
    Array.prototype.forEach.call(dlg.querySelectorAll("[data-input]"), function (el) {
      var k = el.getAttribute("data-input"), v = el.value.trim();
      if (v) inputs[k] = v;
      var def = f && f.fields.filter(function (i) { return i.key === k; })[0];
      if (!v && def && def.required && !def.default && !missing) missing = ["r-in-" + k, "Flowet skal have „" + def.label + "“."];
    });
    Array.prototype.forEach.call(dlg.querySelectorAll("[data-toggle]"), function (el) { toggles[el.getAttribute("data-toggle")] = !!el.checked; });
    return { id: id, inputs: inputs, toggles: toggles, error: id ? missing : null };
  }

  // "Kør i Studio": Studio laver en kørsel af flowet med rutinens værdier og viser startkortet.
  // Vinduet åbnes med det samme (ellers blokerer browseren det) og sendes til chatten bagefter.
  function runRoutineInStudio(id, btn) {
    var r = routineById(id);
    if (!r) return;
    if (dirty) { flash("Gem først, så Studio får rutinens nyeste værdier.", true); return; }
    var w = window.open("", "_blank");
    btn.disabled = true;
    api("POST", "/api/studio/routines/" + encodeURIComponent(id) + "/run", {})
      .then(function (res) {
        btn.disabled = false;
        if (w) w.location.href = res.run.url; else window.location.href = res.run.url;
        flash("„" + r.name + "“ venter på din godkendelse i Studio.");
      })
      .catch(function (e) {
        btn.disabled = false;
        if (w) w.close();
        if (e.status === 401) { showLogin("Du er blevet logget ud. Log ind igen."); return; }
        flash(e.message, true);
      });
  }

  // En fast drift-opgave (timer pr. uge) bliver til en ugentlig rutine. Den gamle sættes til Droppet.
  function driftToRoutine(taskId) {
    var t = taskById(taskId);
    if (!t) return;
    editRoutine(null, { name: t.title, hours: num(t.hours), note: t.note || "", onCreate: function () { t.status = "Droppet"; } });
  }

  function tasksClick(a, el) {
    if (a === "gohash") { location.hash = el.getAttribute("data-h"); return true; }
    if (a === "tasksview") { var v = el.getAttribute("data-v"); location.hash = v ? "tasks/" + v : "tasks"; return true; }
    if (a === "taskdone") {
      var t = taskById(el.getAttribute("data-id"));
      if (t) {
        var was = t.status;
        t.status = "Færdig"; markDirty();
        flash("„" + t.title + "“ er færdig. Husk at trykke Gem.", false, { label: "Fortryd", fn: function () { t.status = was; markDirty(); } });
      }
      return true;
    }
    if (a === "tasknew") { editTask(null, { project: generalProjectId(), start: TODAY_ISO.slice(0, 7) }); return true; }
    if (a === "routine") { editRoutine(el.getAttribute("data-id")); return true; }
    if (a === "newroutine") { editRoutine(null); return true; }
    if (a === "routinestudio") { runRoutineInStudio(el.getAttribute("data-id"), el); return true; }
    if (a === "drift2routine") { driftToRoutine(el.getAttribute("data-id")); return true; }
    return false;
  }

  document.addEventListener("submit", function (e) {
    if (!e.target || e.target.id !== "tquick") return;
    e.preventDefault();
    var input = document.getElementById("tq");
    var title = input ? input.value.trim() : "";
    if (title) quickAdd(title);
  });

  /* ====================== Tema ====================== */

  function currentTheme() {
    var set = document.documentElement.getAttribute("data-theme");
    if (set) return set;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function themeLabel() {
    return currentTheme() === "dark" ? icon("sun") + '<span class="lbl">Lyst tema</span>' : icon("moon") + '<span class="lbl">Mørkt tema</span>';
  }
  try { var savedTheme = localStorage.getItem("mos-theme"); if (savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme); } catch (e) {}

  /* ====================== Start ====================== */

  function fromHash() { return (location.hash || "").replace(/^#/, ""); }

  // Én indgang til al gentegning. Tomt hash = kapacitet, fordi det er dét,
  // dashboardet åbnes for. Fokus og markørposition bevares, så man kan taste
  // videre i et talfelt, selv om siden bliver tegnet forfra ved hvert tastetryk.
  function route() {
    FC_CACHE = null;   // data, kalender eller udsættelser kan have ændret sig
    var a = document.activeElement;
    var id = a && a.id ? a.id : null;
    var key = a && a.getAttribute && a.getAttribute("data-cap")
      ? [a.getAttribute("data-cap"), a.getAttribute("data-id") || "", a.getAttribute("data-uge") || "", a.getAttribute("data-key") || ""].join("|")
      : null;
    var pos = a && a.selectionStart != null ? a.selectionStart : null;

    // Ukendt hash lander på forsiden frem for stiltiende på det første projekt.
    // Det var dét, der fik genvejslinkene til at ligne et projektskifte.
    if (!DATA) return;
    var h = fromHash();
    if (h === "versioner") renderVersions();
    else if (h === "claude") renderClaude();
    else if (h === "otto") renderOtto();
    else if (h === "indbakke") renderInbox();
    else if (h === "omplan") renderPlan();
    else if (h === "tasks" || h.indexOf("tasks/") === 0) renderTasks(h.slice(6));
    else if (h === "rutiner") renderRoutines();
    else if (h === "kalender") renderCalendarPage();
    else if (h === "projekter") renderProjects();
    else if (!h || h === "kapacitet" || !projById(h)) renderCapacity();
    else render(h);

    var back = id ? document.getElementById(id) : null;
    if (!back && key) {
      var p = key.split("|");
      back = document.querySelector('[data-cap="' + p[0] + '"]' +
        (p[1] ? '[data-id="' + p[1] + '"]' : "") +
        (p[2] ? '[data-uge="' + p[2] + '"]' : "") +
        (p[3] ? '[data-key="' + p[3] + '"]' : ""));
    }
    if (back && back !== document.activeElement) {
      try { back.focus({ preventScroll: true }); } catch (e) { back.focus(); }
      if (pos != null && back.setSelectionRange) {
        try { back.setSelectionRange(pos, pos); } catch (e) {}
      }
    }
    refreshSettings();

    // Ny side: luk skuffen, rul til toppen, og flyt fokus til sidens titel, så en skærmlæser hører skiftet
    if (LAST_HASH !== null && LAST_HASH !== h) {
      navOpen(false);
      window.scrollTo(0, 0);
      var h1 = document.querySelector("#main h1");
      if (h1 && !back) { h1.setAttribute("tabindex", "-1"); try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); } }
    }
    LAST_HASH = h;
  }
  var LAST_HASH = null;

  window.addEventListener("hashchange", route);

  // Alt med data-act, der ikke er en knap eller et link, kan bruges med Enter og mellemrum
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var t = e.target;
    if (!t || !t.hasAttribute || !t.hasAttribute("data-act") || e.defaultPrevented) return;
    if (/^(BUTTON|A|INPUT|SELECT|TEXTAREA|SUMMARY|LABEL)$/.test(t.tagName)) return;
    e.preventDefault();
    t.click();
  });

  /* ====================== Login og opstart ====================== */

  function showLogin(msg) {
    document.getElementById("app").hidden = true;
    document.getElementById("login").hidden = false;
    document.getElementById("loginerr").textContent = msg || "";
    document.title = "Log ind — HeyOtto Tasks";
    var pw = document.getElementById("loginpw");
    pw.value = "";
    pw.focus();
  }

  document.getElementById("loginform").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;
    api("POST", "/api/login", { password: document.getElementById("loginpw").value })
      .then(function () { return boot(); })
      .catch(function (err) { document.getElementById("loginerr").textContent = err.message; })
      .then(function () { btn.disabled = false; });
  });

  function logout(sure) {
    if (dirty && !sure) {
      // Gem først; kun hvis det ikke lykkes (fx uden net), spørges der
      save().then(function () {
        if (!dirty) { logout(true); return; }
        askConfirm({ title: "Log ud med ændringer, der ikke er gemt?", yes: "Log ud",
                     text: ["Der er ingen forbindelse til skyen lige nu. Ændringerne ligger i kladden i denne browser til næste gang."] },
                   function () { logout(true); });
      });
      return;
    }
    api("POST", "/api/logout").then(function (r) {
      if (r && r.accessLogout) { dirty = false; location.href = r.accessLogout; return; }   // Cloudflare Access
      DATA = null; dirty = false;
      showLogin("");
    }).catch(function (e) { flash("Kunne ikke logge ud: " + e.message, true); });
  }

  function crash(err, title, hint) {
    document.getElementById("login").hidden = true;
    document.getElementById("app").hidden = false;
    document.getElementById("main").innerHTML =
      '<div class="banner banner-warn"><h3>' + icon("alert") + esc(title) + "</h3>" +
      "<p>" + esc(err && err.message ? err.message : String(err)) + "</p>" +
      '<p class="mt-2">' + esc(hint) + " Dine ugemte ændringer i denne browser er ikke rørt.</p>" +
      '<p class="mt-3"><button class="btn" type="button" onclick="location.reload()">Prøv igen</button></p></div>';
  }

  // Tilbage fra Google (api.mts sender ?google=forbundet|fejl&besked=…): sig hvordan det gik,
  // vis forbindelserne, og ryd adressen, så beskeden ikke kommer igen ved genindlæsning.
  function googleReturn() {
    var q = new URLSearchParams(location.search);
    var how = q.get("google");
    if (!how) return;
    try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
    openSettings("forbindelser");
    if (how === "forbundet") flash("Google er forbundet: " + (q.get("besked") || "") + ". Dine møder hentes nu.");
    else flash(q.get("besked") || "Forbindelsen til Google mislykkedes.", true);
  }

  // Hent data fra skyen. Er man ikke logget ind, vises login-skærmen.
  // Prognose- og kalenderreglerne (dashboard/lib/forecast.mjs) hentes én gang, sammen med data.
  var FC = null;
  var FC_LOAD = null;
  function loadForecastModule() {
    if (!FC_LOAD) FC_LOAD = import("./lib/forecast.mjs").then(function (m) { FC = m; return m; }, function (e) {
      FC_LOAD = null;
      var err = new Error("Prognosemodulet kunne ikke hentes (" + (e && e.message ? e.message : e) + ").");
      err.status = 0;
      throw err;
    });
    return FC_LOAD;
  }

  function boot() {
    return Promise.all([api("GET", "/api/data"), loadForecastModule()]).then(function (all) {
      var res = all[0];
      DATA = res.data;
      DATA_REV = res.rev || "";
      BASE = clone(res.data);
      document.getElementById("login").hidden = true;
      document.getElementById("app").hidden = false;
      try {
        loadDraft();
        // Rutiner: læg dagens og ugens tasks ind (gemmes med det samme, hvis intet andet er ugemt)
        var made = materializeRoutines();
        if (made && !dirty) save(false, "Rutiner: " + plural(made, "ny opgave", "nye opgaver") + " er lagt ind.");
        else if (made) saveDraft();
        route();
      } catch (err) {
        crash(err, "Dashboardet kunne ikke tegnes", "Det skyldes næsten altid en fejl i data — bed Claude om at se på den.");
        return;
      }
      loadStudio();
      loadCalendar();
      loadAlerts();
      loadInbox();
      googleReturn();
    }, function (err) {
      if (err.status === 401 || err.status === 503) { showLogin(err.status === 503 ? err.message : ""); return; }
      crash(err, "HeyOtto Tasks kunne ikke hente dine data", "Prøv at genindlæse om lidt.");
    });
  }

  boot();
})();
</script>

        ' <button class="icon-btn" data-act="editproj" type="button" title="Rediger projekt" aria-label="Rediger projekt">' + icon("pencil") + "</button></h1>" +
        (p.tagline ? '<p class="tagline">' + esc(p.tagline) + "</p>" : "") + "</div>" +
        headActions(true) + "</div>" +
      '<div class="chips">' + (chips || '<span class="chip">Ingen opgaver endnu</span>') + "</div>" +
      nav + secSprint + secHist + secGantt +
      "<footer>HeyOtto OS · data opdateret " + esc(DATA.meta.updated || "—") +
      " · vedligeholdes af Claude Code i <span class=\"num\">dashboard/index.html</span></footer>";

    wireTheme();

    // Rul tidslinjen så indeværende måned ligger tæt på venstre kant
    var gs = document.getElementById("gscroll");
    if (gs) {
      var line = gs.querySelector(".g-today");
      if (line) gs.scrollLeft = Math.max(0, line.offsetLeft - 340);
    }
  }

  /* ====================== Historik og Claude-adgang ====================== */

  var DATEFMT = new Intl.DateTimeFormat("da-DK", { dateStyle: "long", timeStyle: "short" });

  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  function pageHead(title, tagline) {
    return '<div class="phead"><div><h1>' + esc(title) + "</h1>" +
      '<p class="tagline">' + esc(tagline) + "</p></div>" +
      headActions(false) + "</div>";
  }

  // Fejl fra en side, der henter noget: logget ud → login, ellers en besked i boksen
  function boxError(id, what) {
    return function (e) {
      if (e.status === 401) { showLogin("Du er blevet logget ud. Log ind igen."); return; }
      var box = document.getElementById(id);
      if (box) box.innerHTML = '<p class="hint">Kunne ikke hente ' + what + ": " + esc(e.message) + "</p>";
    };
  }

  function renderVersions() {
    renderSidebar(null);
    document.title = (dirty ? "● " : "") + "Historik — HeyOtto OS";
    document.getElementById("main").innerHTML =
      pageHead("Historik", "Hver gang der gemmes — af dig eller af Claude — lægges versionen her. Du kan altid gå tilbage til en tidligere version.") +
      '<section class="card"><div class="card-pad" id="versions"><p class="hint">Henter …</p></div></section>';
    wireTheme();
    api("GET", "/api/history").then(function (res) {
      var box = document.getElementById("versions");
      if (!box) return;                 // man er gået videre imens
      var list = (res && res.versions) || [];
      box.innerHTML = list.length
        ? '<ul class="vlist">' + list.map(versionRow).join("") + "</ul>"
        : '<p class="col-empty">Ingen gemte versioner endnu. Den første kommer, når du trykker Gem.</p>';
    }).catch(boxError("versions", "historikken"));
  }

  function versionRow(v) {
    var when = v.savedAt ? DATEFMT.format(new Date(v.savedAt)) : v.id;
    var who = v.by === "Claude" ? "Claude" : "dig";
    return '<li class="vrow"><div class="vtxt"><b>' + esc(when) + "</b>" +
      '<span class="vmeta">' + (v.restoredFrom ? "gendannet af " : "gemt af ") + who + " · " +
        plural(v.projects, "projekt", "projekter") + " · " + plural(v.tasks, "opgave", "opgaver") + "</span></div>" +
      (v.current
        ? '<span class="tag now">Nuværende</span>'
        : '<button class="btn" data-act="restore" data-id="' + esc(v.id) + '" data-label="' + esc(when) + '" type="button">Gå tilbage hertil</button>') +
      "</li>";
  }

  function restoreVersion(id, label) {
    if (!confirm("Gå tilbage til versionen fra " + label + "?" +
                 (dirty ? "\n\nDine ugemte ændringer går tabt." : "") +
                 "\n\nDen nuværende version bliver liggende i historikken.")) return;
    api("POST", "/api/history/" + encodeURIComponent(id) + "/restore", {})
      .then(function () { dirty = false; clearDraft(); return boot(); })
      .then(function () { flash("Versionen fra " + label + " er gendannet."); })
      .catch(function (e) {
        if (e.status === 401) { showLogin("Du er blevet logget ud. Log ind igen."); return; }
        flash("Kunne ikke gå tilbage: " + e.message, true);
      });
  }

  // En ny nøgle vises kun lige efter, den er lavet. Serveren gemmer den ikke —
  // kun et fingeraftryk — så den kan aldrig vises igen.
  var NEWKEY = null;
  var KEYEXISTS = false;

  function renderClaude() {
    renderSidebar(null);
    document.title = (dirty ? "● " : "") + "Claude-adgang — HeyOtto OS";
    document.getElementById("main").innerHTML =
      pageHead("Claude-adgang", "Giv Claude lov til at læse og rette dine data — fx lægge opgaver ind fra Asana, når du beder om det.") +
      '<section class="card"><div class="card-pad" id="claudebox"><p class="hint">Henter …</p></div></section>' +
      '<section class="card" style="margin-top:20px"><div class="card-pad" id="routinebox"></div></section>';
    wireTheme();
    fillRoutineBox();
    loadJobs();
    api("GET", "/api/claude-key").then(function (res) {
      var box = document.getElementById("claudebox");
      if (!box) return;
      KEYEXISTS = !!res.exists;
      box.innerHTML = NEWKEY ? keyShown()
        : KEYEXISTS ? keyStatus(res.createdAt)
        : keyNone();
    }).catch(boxError("claudebox", "status for Claudes adgang"));
  }

  function keyNone() {
    return '<p class="kp-lead">Claude har ikke adgang endnu.</p>' +
      '<ul class="kp-list">' +
        "<li>Claude kan læse og rette projekter, sprints, opgaver og kapacitet.</li>" +
        "<li>Claude kan ikke se din adgangskode eller lave nye nøgler.</li>" +
        "<li>Alt, hvad Claude gemmer, står i Historik som „gemt af Claude“ og kan fortrydes.</li>" +
      "</ul>" +
      '<p><button class="btn primary" data-act="newkey" type="button">Lav en nøgle til Claude</button></p>';
  }

  function keyStatus(createdAt) {
    return '<p class="kp-lead">Claude har adgang.</p>' +
      '<p class="hint">Nøglen blev lavet ' + esc(createdAt ? DATEFMT.format(new Date(createdAt)) : "—") +
      ". Den kan ikke vises igen — har du mistet den, så lav en ny.</p>" +
      '<p class="kp-acts"><button class="btn" data-act="newkey" data-rotate="1" type="button">Lav en ny nøgle</button>' +
      '<button class="btn danger" data-act="delkey" type="button">Fjern Claudes adgang</button></p>';
  }

  function keyShown() {
    return '<p class="kp-lead">Her er nøglen til Claude.</p>' +
      '<p class="hint">Den vises kun denne ene gang. Kopiér den nu.</p>' +
      '<div class="keybox"><input id="newkey" type="text" readonly value="' + esc(NEWKEY) + '">' +
        '<button class="btn primary" data-act="copykey" type="button">Kopiér</button></div>' +
      '<ol class="kp-steps">' +
        "<li>Åbn Claude, og gå til miljøets indstillinger: miljø-menuen i sessionens titellinje → <b>Edit</b>.</li>" +
        "<li>Tilføj en miljøvariabel med navnet <code>HEYOTTO_API_KEY</code> og nøglen som værdi.</li>" +
        "<li>Under <b>Network access</b>: vælg <b>Custom</b>, og tilføj <code>" + esc(location.host) + "</code> under Allowed domains. Behold standardlisten.</li>" +
        "<li>Start en ny session. Så kan Claude læse og rette dine data.</li>" +
      "</ol>" +
      '<p class="hint">Giv aldrig nøglen til andre end Claudes indstillinger — og skriv den ikke i en chat.</p>';
  }

  // Anden halvdel af siden: Claude udfører opgaver (en Claude Code Routine)
  function fillRoutineBox() {
    var box = document.getElementById("routinebox");
    if (!box) return;
    if (CLAUDE_CONNECTED === null) { box.innerHTML = '<p class="hint">Henter …</p>'; return; }
    if (CLAUDE_CONNECTED) {
      box.innerHTML = '<p class="kp-lead">Claude udfører opgaver</p>' +
        '<p class="hint">Forbundet. Åbn en opgave, og tryk <b>Lad Claude udføre</b> — eller skriv Claude som ejer, og gem. ' +
        "Claude laver kun udkast, og du godkender dem på opgaven.</p>" + recentJobs();
      return;
    }
    box.innerHTML = '<p class="kp-lead">Lad Claude udføre opgaver</p>' +
      '<p class="hint">Claude kan gå i gang med en opgave, når du beder om det — fx skrive et mailudkast eller lave en ugerapport. ' +
      "Claude arbejder i skyen med dine agenter og forbindelser og laver kun udkast. Det sætter du op én gang:</p>" +
      '<ol class="kp-steps">' +
        "<li>Giv Claude adgang ovenfor, og læg nøglen i det Claude-miljø, routinen skal bruge.</li>" +
        '<li>Gå til <a href="https://claude.ai/code/routines" target="_blank" rel="noopener">claude.ai/code/routines</a> → <b>New routine</b>. ' +
          "Kald den „HeyOtto OS-opgaver“, vælg repoet <code>KasperAI-stack/OS</code> og miljøet fra trin 1, og fjern de forbindelser, opgaverne ikke skal bruge.</li>" +
        "<li>Sæt denne tekst ind som routinens instruktion:" +
          '<div class="prompt">' + esc(ROUTINE_PROMPT) + "</div>" +
          '<button class="btn" data-act="copyprompt" type="button">Kopiér instruktionen</button></li>' +
        "<li>Under <b>Select a trigger</b>: vælg <b>API</b>, og tryk <b>Create</b>. Åbn routinen igen → <b>Edit</b> → API-triggeren. " +
          "Kopiér URL'en, og tryk <b>Generate token</b>. Tokenet vises kun én gang.</li>" +
        "<li>I Netlify: <b>Project configuration → Environment variables</b>. Tilføj <code>CLAUDE_ROUTINE_URL</code> med URL'en " +
          "og <code>CLAUDE_ROUTINE_TOKEN</code> med tokenet (markér det som hemmeligt). Lav så et nyt deploy (<b>Deploys → Trigger deploy</b>).</li>" +
      "</ol>" +
      '<p class="hint">Skriv aldrig tokenet i en chat. Det kan kun starte denne ene routine.</p>';
  }

  var RECENT = [];   // de seneste jobs, også dem på opgaver, der er slettet
  function recentJobs() {
    if (!RECENT.length) return '<p class="col-empty" style="margin-top:12px">Claude har ikke udført nogen opgaver endnu.</p>';
    return '<ul class="vlist" style="margin-top:16px">' + RECENT.slice(0, 8).map(function (j) {
      var open = taskById(j.taskId) ? ' data-act="task" data-id="' + esc(j.taskId) + '" style="cursor:pointer"' : "";
      return '<li class="vrow"' + open + '><div class="vtxt"><b>' + esc(j.task.title) + "</b>" +
        '<span class="vmeta">' + esc(DATEFMT.format(new Date(j.createdAt))) + (j.startedBy === "ejer" ? " · ejer: Claude" : "") + "</span></div>" +
        '<span class="tag' + (j.status === "til godkendelse" ? " now" : "") + '">' + esc(jobLabel(j)) + "</span></li>";
    }).join("") + "</ul>";
  }

  function newClaudeKey(rotate) {
    if (rotate && !confirm("Lav en ny nøgle? Den gamle holder op med at virke med det samme, så Claude skal have den nye.")) return;
    api("POST", "/api/claude-key", {})
      .then(function (res) { NEWKEY = res.key; renderClaude(); })
      .catch(function (e) { flash("Kunne ikke lave nøglen: " + e.message, true); });
  }

  function deleteClaudeKey() {
    if (!confirm("Fjern Claudes adgang? Nøglen holder op med at virke med det samme.")) return;
    api("DELETE", "/api/claude-key", {})
      .then(function () { NEWKEY = null; renderClaude(); flash("Claude har ikke længere adgang."); })
      .catch(function (e) { flash("Kunne ikke fjerne adgangen: " + e.message, true); });
  }

  function copyKey() {
    var input = document.getElementById("newkey");
    if (!input) return;
    var done = function () { flash("Nøglen er kopieret."); };
    try {
      navigator.clipboard.writeText(input.value).then(done, function () { input.select(); document.execCommand("copy"); done(); });
    } catch (e) { input.select(); document.execCommand("copy"); done(); }
  }

  /* ====================== Otto: agent-kernen (M7) ======================
     Otto er OS'ets egen agent: Claude API og OS'ets egne værktøjer, kørt på serveren
     (netlify/lib/agent/). Spørg Otto læser alt, men ændrer intet. Hver kørsel kan ses
     under Aktivitet med hvert værktøjskald og prisen. Indstillingerne ligger på
     serveren, ikke i data, så de gemmes med det samme. */

  var AGENT = null;          // /api/agent: sat op?, indstillinger, dagens forbrug, slags, modeller
  var ORUNS = null;          // de seneste kørsler (uden trin)
  var OCHAT = [];            // denne samtale: [{ q, run }]
  var OOPEN = {};            // kørsler, der er foldet ud i Aktivitet: id → kørsel eller "henter"
  var OBUSY = { "i kø": 1, "kører": 1 };
  var OTRIGGER = { dig: "startet af dig", planlagt: "planlagt", "hændelse": "hændelse" };
  var KRFMT = new Intl.NumberFormat("da-DK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function kr(v) { return KRFMT.format(v || 0) + " kr."; }
  function ottoText(s) { return esc(s || "").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>"); }
  function toolCount(run) { return (run.steps || []).filter(function (s) { return s.type === "tool"; }).length; }
  function kindLabel(id) {
    var k = AGENT && AGENT.kinds ? AGENT.kinds.filter(function (x) { return x.id === id; })[0] : null;
    return k ? k.label : id;
  }

  function loadAgent() {
    return api("GET", "/api/agent")
      .then(function (r) { AGENT = r; })
      .catch(function (e) { AGENT = { error: e.message }; })
      .then(function () { rerenderSettingsSection("otto"); fillOtto(); fillRuns(); });
  }
  function loadRuns() {
    return api("GET", "/api/agent/runs").then(function (r) { ORUNS = r.runs || []; fillRuns(); })
      .catch(boxError("oruns", "Ottos aktivitet"));
  }

  // Følger én kørsel, til den er færdig. Den kører i baggrunden på serveren.
  function watchRun(id, onUpdate) {
    var tries = 0;
    (function poll() {
      api("GET", "/api/agent/runs/" + encodeURIComponent(id)).then(function (r) {
        var busy = !!OBUSY[r.run.status] && tries++ < 300;
        onUpdate(r.run, busy);
        if (busy) setTimeout(poll, tries < 20 ? 1500 : 4000);
      }).catch(function (e) {
        if (e.status === 401) { showLogin("Du er blevet logget ud. Log ind igen."); return; }
        if (e.status !== 410 && tries++ < 300) { setTimeout(poll, 4000); return; }
        onUpdate({ id: id, status: "fejlet", error: e.message, output: "", steps: [] }, false);
      });
    })();
  }

  function renderOtto() {
    renderSidebar("otto");
    document.title = (dirty ? "● " : "") + "Otto — HeyOtto OS";
    document.getElementById("main").innerHTML =
      pageHead("Spørg Otto", "Spørg om projekter, deadlines, kapacitet og kalender. Otto kan læse alt, men ikke ændre noget.") +
      '<section class="card"><div class="card-pad" id="ochat"></div></section>' +
      '<section class="card" style="margin-top:20px"><div class="card-hd"><h2>Aktivitet</h2><span class="hint" id="otoday"></span></div>' +
        '<div class="card-pad" id="oruns"><p class="hint">Henter …</p></div></section>';
    wireTheme();
    fillOtto();
    loadAgent();
    loadRuns();
  }

  function fillOtto(focus) {
    var box = document.getElementById("ochat");
    if (!box) return;
    var today = document.getElementById("otoday");
    if (today && AGENT && AGENT.today) {
      today.textContent = "I dag " + kr(AGENT.today.dkk) + " af " + kr(AGENT.settings.budgetDkk) + " · " + plural(AGENT.today.runs, "kørsel", "kørsler");
    }
    if (AGENT && AGENT.error) { box.innerHTML = '<p class="hint">Kunne ikke hente Otto: ' + esc(AGENT.error) + "</p>"; return; }
    if (AGENT && !AGENT.configured) {
      box.innerHTML = '<p class="kp-lead">Otto er ikke sat op endnu</p>' +
        '<p class="hint">Otto bruger Claude API. Det sættes op én gang, enten med Netlify AI Gateway eller din egen nøgle.</p>' +
        '<p style="margin-top:12px"><button class="btn primary" data-act="settings" data-section="otto" type="button">Se hvordan</button></p>';
      return;
    }
    var old = document.getElementById("oq");
    var draft = old ? old.value : "";
    var thread = OCHAT.map(function (c) {
      var r = c.run, a;
      if (!r || OBUSY[r.status]) {
        var last = r && (r.steps || []).filter(function (s) { return s.type === "tool"; }).pop();
        a = '<div class="oc-a"><span class="hint">' + icon("spark") + " " +
            (!r ? "Sender …" : r.status === "i kø" ? "Otto starter …" : "Otto tænker" + (last ? " (" + esc(last.name) + ")" : "") + " …") + "</span></div>";
      } else if (r.status === "færdig") {
        a = '<div class="oc-a">' + ottoText(r.output) + '<p class="hint">' + plural(toolCount(r), "værktøjskald", "værktøjskald") + " · " + kr(r.costDkk) + "</p></div>";
      } else {
        a = '<div class="oc-a err">' + esc(r.error || "Noget gik galt.") + "</div>" + (r.output ? '<div class="oc-a">' + ottoText(r.output) + "</div>" : "");
      }
      return '<div class="oc-q">' + esc(c.q) + "</div>" + a;
    }).join("");
    var busy = OCHAT.some(function (c) { return !c.run || OBUSY[c.run.status]; });
    var dis = busy ? " disabled" : "";
    box.innerHTML = (thread ? '<div class="othread" aria-live="polite">' + thread + "</div>"
        : '<p class="hint" style="margin:0 0 12px">Fx „Når jeg alle deadlines i november?“, „Hvad bør jeg starte med i dag?“ eller „Hvor travl er næste uge?“</p>') +
      '<form class="oask" id="oaskform"><label class="flab" for="oq">' + (OCHAT.length ? "Spørg videre" : "Dit spørgsmål") + "</label>" +
        '<textarea id="oq" rows="2" maxlength="2000"' + dis + "></textarea>" +
        '<div class="oask-ft"><span class="hint">Otto læser data, prognose og kalender. Ændringer foreslår Otto, og dem laver du selv. Enter sender, Shift+Enter giver ny linje.</span>' +
          (OCHAT.length ? '<button class="btn" type="button" data-act="ottonew"' + dis + ">Ny samtale</button>" : "") +
          '<button class="btn primary" type="submit"' + dis + ">" + icon("spark") + "Spørg</button></div></form>";
    var ta = document.getElementById("oq");
    ta.value = draft;
    if (focus) ta.focus();
  }

  function askOtto(q) {
    var parent = "";
    for (var i = OCHAT.length - 1; i >= 0; i--) {
      if (OCHAT[i].run && OCHAT[i].run.status === "færdig") { parent = OCHAT[i].run.id; break; }
    }
    var item = { q: q, run: null };
    OCHAT.push(item);
    fillOtto();
    api("POST", "/api/agent/runs", { kind: "spoerg", input: q, parent: parent })
      .then(function (r) {
        item.run = r.run;
        fillOtto();
        watchRun(r.run.id, function (run, busy) {
          item.run = run;
          fillOtto(!busy);
          if (!busy) { loadRuns(); loadAgent(); }
        });
      })
      .catch(function (e) {
        if (e.status === 401) { showLogin("Du er blevet logget ud. Log ind igen."); return; }
        item.run = { status: "fejlet", error: e.message, output: "", steps: [] };
        fillOtto(true);
        var ta = document.getElementById("oq");
        if (ta && !ta.value) ta.value = q;   // så spørgsmålet kan sendes igen
      });
  }

  function fillRuns() {
    var box = document.getElementById("oruns");
    if (!box || !ORUNS) return;
    if (!ORUNS.length) { box.innerHTML = '<p class="col-empty">Otto har ikke kørt endnu.</p>'; return; }
    box.innerHTML = '<ul class="vlist">' + ORUNS.map(function (r) {
      var open = OOPEN[r.id];
      var line = r.status === "færdig" && r.output ? '<span class="vmeta">' + esc(r.output.split("**").join("").slice(0, 160)) + (r.output.length > 160 ? " …" : "") + "</span>"
        : r.error ? '<span class="vmeta" style="color:var(--danger-ink)">' + esc(r.error) + "</span>" : "";
      return '<li class="vrow orun" data-act="ottorun" data-id="' + esc(r.id) + '" role="button" tabindex="0" aria-expanded="' + !!open + '">' +
          '<div class="vtxt"><b>' + esc(kindLabel(r.kind)) + (r.input ? ": " + esc(r.input) : "") + "</b>" +
          '<span class="vmeta">' + esc(TIMEFMT.format(new Date(r.createdAt))) + " · " + esc(OTRIGGER[r.trigger] || r.trigger) + " · " +
            plural(r.tools, "værktøjskald", "værktøjskald") + " · " + kr(r.costDkk) + "</span>" + line + "</div>" +
          '<span class="tag' + (OBUSY[r.status] ? " now" : "") + '">' + esc(r.status) + "</span></li>" +
        (open ? "<li>" + stepsHtml(open) + "</li>" : "");
    }).join("") + "</ul>";
  }

  function fmtTok(t) {
    t = t || {};
    var f = function (n) { return (n || 0).toLocaleString("da-DK"); };
    return f(t.input) + " tokens ind · " + f(t.output) + " ud" + (t.cacheRead ? " · " + f(t.cacheRead) + " fra cache" : "");
  }

  // Hvert trin i en kørsel: Claudes svar og hvert værktøjskald med input og (forkortet) output
  function stepsHtml(run) {
    if (run === "henter") return '<p class="hint" style="margin-bottom:12px">Henter …</p>';
    var rows = (run.steps || []).map(function (s) {
      if (s.type === "model") {
        return "<li><b>Claude</b> · " + fmtTok(s.tokens) + " · " + (s.ms / 1000).toFixed(1).replace(".", ",") + " s" +
          (s.text ? "<code>" + esc(s.text) + "</code>" : "") + "</li>";
      }
      return "<li><b>Værktøj: " + esc(s.name) + "</b> · " + s.ms + " ms<code>ind: " + esc(s.input || "{}") + "</code>" +
        (s.error ? '<code class="err">fejl: ' + esc(s.error) + "</code>" : "<code>ud: " + esc(s.output || "") + "</code>") + "</li>";
    }).join("");
    return '<ul class="osteps">' + (rows || "<li>Ingen trin.</li>") +
      "<li><b>I alt</b> · " + esc(run.model) + " · " + fmtTok(run.usage) + " · " + kr(run.costDkk) + "</li></ul>";
  }

  function toggleRun(id) {
    if (OOPEN[id]) { delete OOPEN[id]; fillRuns(); return; }
    OOPEN[id] = "henter";
    fillRuns();
    api("GET", "/api/agent/runs/" + encodeURIComponent(id))
      .then(function (r) { if (OOPEN[id]) { OOPEN[id] = r.run; fillRuns(); } })
      .catch(function (e) { delete OOPEN[id]; fillRuns(); flash("Kunne ikke hente kørslen: " + e.message, true); });
  }

  function testOtto(btn) {
    btn.disabled = true;
    api("POST", "/api/agent/runs", { kind: "ping" }).then(function (r) {
      flash("Otto er startet …");
      watchRun(r.run.id, function (run, busy) {
        if (busy) return;
        btn.disabled = false;
        loadAgent();
        if (run.status === "færdig") flash("Otto svarer: " + run.output);
        else flash("Testen fejlede: " + (run.error || run.status), true);
      });
    }).catch(function (e) { btn.disabled = false; flash(e.message, true); });
  }

  // Klik, der hører til Otto. Giver true, når klikket er håndteret.
  function ottoClick(a, el) {
    if (a === "otto") { location.hash = "otto"; return true; }
    if (a === "ottorun") { toggleRun(el.getAttribute("data-id")); return true; }
    if (a === "ottonew") { OCHAT = []; fillOtto(true); return true; }
    if (a === "ottotest") { testOtto(el); return true; }
    return false;
  }

  document.addEventListener("submit", function (e) {
    if (!e.target || e.target.id !== "oaskform") return;
    e.preventDefault();
    var ta = document.getElementById("oq");
    var q = ta ? ta.value.trim() : "";
    if (!q) { if (ta) ta.focus(); return; }
    ta.value = "";
    askOtto(q);
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && t.id === "oq" && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      var f = document.getElementById("oaskform");
      if (f && f.requestSubmit) f.requestSubmit();
    }
    // Rækkerne i Aktivitet kan foldes ud med tastaturet
    if (t && t.getAttribute && t.getAttribute("data-act") === "ottorun" && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      toggleRun(t.getAttribute("data-id"));
    }
  });

  // Ottos indstillinger gemmes med det samme på serveren (ikke en del af data)
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var f = el.getAttribute("data-agent"), k = el.getAttribute("data-agentkind");
    if (!f && !k) return;
    var body = {};
    if (f === "enabled") body.enabled = el.checked;
    else if (f) body[f] = parseFloat(String(el.value).replace(",", "."));
    else {
      body.kinds = {};
      body.kinds[k] = {};
      body.kinds[k][el.getAttribute("data-field")] = el.type === "checkbox" ? el.checked : el.value;
    }
    api("PUT", "/api/agent/settings", body)
      .then(function (r) { AGENT = r; flash("Gemt."); rerenderSettingsSection("otto"); fillOtto(); })
      .catch(function (err) { flash("Kunne ikke gemme: " + err.message, true); loadAgent(); });
  });

  function ottoSettingsHtml() {
    if (!AGENT) return '<p class="hint" style="margin-top:0">Henter …</p>';
    if (AGENT.error) return '<p class="hint" style="margin-top:0">Kunne ikke hente Otto: ' + esc(AGENT.error) + "</p>";
    var s = AGENT.settings;
    var setup = AGENT.configured
      ? '<p class="hint" style="margin-top:0">' + icon("spark") + " Claude API er forbundet. Otto læser data, prognose og kalender. " +
        "Otto kan ikke sende mails, svare på invitationer eller ændre kalenderen. Det er låst i koden.</p>"
      : '<p style="margin:0 0 10px">Otto bruger Claude API, som betales pr. forbrug. Det sættes op én gang, på én af to måder:</p>' +
        '<ol class="steps">' +
          "<li><b>Netlify AI Gateway</b> (nemmest): Netlify giver funktionerne adgang til Claude uden en nøgle og trækker forbruget fra dine Netlify-kreditter. " +
            "Det er slået til som standard på planer med kreditter og virker efter første produktionsdeploy. Lav et nyt deploy (<i>Deploys → Trigger deploy</i>), og genindlæs.</li>" +
          '<li><b>Din egen nøgle</b>: lav en API-nøgle på <a href="https://platform.claude.com" target="_blank" rel="noopener">platform.claude.com</a>, ' +
            "og tilføj den i Netlify (<i>Project configuration → Environment variables</i>) som <code>ANTHROPIC_API_KEY</code>, markeret som hemmelig. Lav så et nyt deploy.</li>" +
        "</ol>";
    var kinds = AGENT.kinds.map(function (k) {
      var ks = s.kinds[k.id] || {};
      return '<div class="okind"><label class="gcal"><input type="checkbox" data-agentkind="' + esc(k.id) + '" data-field="enabled"' + (ks.enabled ? " checked" : "") + ">" +
          "<span>" + esc(k.label) + (k.schedule ? ' <span class="hint">· ' + esc(k.schedule) + "</span>" : "") + "</span></label>" +
        '<select class="oselect" data-agentkind="' + esc(k.id) + '" data-field="model" aria-label="Model til ' + esc(k.label) + '">' +
          AGENT.models.map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === ks.model ? " selected" : "") + ">" + esc(m.label) + "</option>"; }).join("") +
        "</select></div>";
    }).join("");
    return setup +
      '<label class="gcal" style="margin-top:8px"><input type="checkbox" data-agent="enabled"' + (s.enabled ? " checked" : "") + "><span>Otto er slået til</span></label>" +
      '<div class="krow" style="margin-top:8px"><label class="klab" for="otto-budget">Dagsbudget<span class="ksub">Brugt i dag: ' + kr(AGENT.today.dkk) +
          " · " + plural(AGENT.today.runs, "kørsel", "kørsler") + "</span></label>" +
        '<span><input type="number" id="otto-budget" data-agent="budgetDkk" min="0" max="1000" step="5" value="' + s.budgetDkk + '"> kr.</span></div>' +
      '<div class="krow"><label class="klab" for="otto-kurs">Dollarkurs<span class="ksub">Claude API koster i dollar. Prisen regnes om med denne kurs.</span></label>' +
        '<span><input type="number" id="otto-kurs" data-agent="usdDkk" min="1" max="20" step="0.05" value="' + s.usdDkk + '"> kr.</span></div>' +
      '<div class="gcals" style="margin-top:12px"><span class="flab">Kørsler og model</span>' + kinds + "</div>" +
      '<div class="set-links" style="margin-top:12px"><button class="btn" data-act="ottotest" type="button"' + (AGENT.configured ? "" : " disabled") + ">Test Otto</button>" +
        '<a class="btn" href="#otto" data-act="settingsclose">Spørg Otto og aktivitet</a></div>' +
      '<p class="hint">Prisen regnes ud fra Claudes listepriser. Når dagsbudgettet er brugt, stopper Otto til næste dag, og du får en notifikation. ' +
        "Morgenbriefen kommer som notifikation, når den er slået til.</p>";
  }

  /* ====================== Indbakke: mail → opgaver (M8) ======================
     "Hent mails" starter en Otto-kørsel (slagsen indbakke), der læser nye mails og laver
     forslag. Forslagene ligger på serveren uden for data. Opret laver en almindelig
     opgave og gemmer med det samme; Ignorér husker tråden, så den ikke kommer igen. */

  var INBOX = null;    // { suggestions, handled, mail: { accounts } }
  var IPULL = null;    // den kørsel, "Hent mails" har startet
  function inboxCount() { return INBOX && INBOX.suggestions ? INBOX.suggestions.length : 0; }
  function hasMail() { return !!(INBOX && INBOX.mail && INBOX.mail.accounts.some(function (a) { return a.gmail; })); }

  function loadInbox() {
    return api("GET", "/api/inbox").then(function (r) {
      INBOX = r;
      if (!DATA) return;
      var h = fromHash();
      renderSidebar(!h ? "kapacitet" : h);
      fillInbox();
    }).catch(function (e) { console.warn("Indbakken kunne ikke hentes:", e.message); });
  }

  function renderInbox() {
    renderSidebar("indbakke");
    document.title = (dirty ? "● " : "") + "Indbakke — HeyOtto OS";
    document.getElementById("main").innerHTML =
      pageHead("Indbakke", "Otto læser dine mails og foreslår opgaver. Du bestemmer, hvad der bliver oprettet.") +
      '<section class="card"><div class="card-hd"><h2>Forslag fra mail</h2>' +
        '<button class="btn primary" data-act="inboxpull" id="ipull" type="button">' + icon("spark") + "Hent mails</button></div>" +
        '<div class="card-pad" id="ibox"><p class="hint">Henter …</p></div></section>';
    wireTheme();
    fillInbox();
    loadInbox();
  }

  function mailDate(s) {
    var d = new Date(s);
    return isNaN(d) ? "" : TIMEFMT.format(d);
  }
  function senderName(from) { return String(from || "").replace(/\s*<[^>]+>\s*$/, "").replace(/^"|"$/g, "") || from; }

  function fillInbox() {
    var box = document.getElementById("ibox");
    if (!box) return;
    var btn = document.getElementById("ipull");
    var pulling = IPULL && OBUSY[IPULL.status];
    if (btn) btn.disabled = !INBOX || !hasMail() || !!pulling;
    if (!INBOX) { box.innerHTML = '<p class="hint">Henter …</p>'; return; }

    if (!hasMail()) {
      var accs = INBOX.mail.accounts;
      box.innerHTML = '<p class="kp-lead">Giv Otto adgang til at læse mail</p>' +
        '<ol class="steps">' +
          '<li>Slå <b>Gmail API</b> til i dit Google Cloud-projekt: <a href="https://console.cloud.google.com/apis/library/gmail.googleapis.com" target="_blank" rel="noopener">åbn Gmail API</a> → <b>Enable</b>.</li>' +
          "<li>" + (accs.length
            ? 'Tryk <b>Giv adgang til mail</b>, vælg kontoen, og sæt flueben ved Gmail. Google viser advarslen om en „ikke verificeret app“ igen. Det er forventet til eget brug.' +
              '<div class="set-links" style="margin-top:8px"><a class="btn primary" data-act="gconnect" href="/api/google/connect?scopes=calendar,gmail">Giv adgang til mail</a></div>'
            : 'Forbind først en Google-konto under <button class="sf-link-ink" data-act="settings" data-section="forbindelser" type="button">Indstillinger → Forbindelser</button>.') + "</li>" +
        "</ol>" +
        '<p class="hint">Kun læsning. Otto kan aldrig sende, slette eller arkivere mail. Mailtekst gemmes ikke, kun Ottos korte resumé.</p>';
      return;
    }

    var status = "";
    if (IPULL) {
      var last = (IPULL.steps || []).filter(function (s) { return s.type === "tool"; }).pop();
      status = pulling
        ? '<p class="hint" style="margin:0 0 14px">' + icon("spark") + " Otto læser dine mails" + (last ? " (" + esc(last.name) + ")" : "") + " …</p>"
        : IPULL.status === "færdig"
          ? '<p class="hint" style="margin:0 0 14px">' + esc(IPULL.output || "Færdig.") + " · " + kr(IPULL.costDkk) + "</p>"
          : '<p class="hint" style="margin:0 0 14px;color:var(--danger-ink)">' + esc(IPULL.error || "Det gik galt.") + "</p>";
    }

    var list = INBOX.suggestions.map(function (s) {
      var p = projById(s.project);
      var meta = [];
      if (s.due) meta.push("deadline " + FC.shortDate(s.due));
      if (s.estimate) meta.push("ca. " + fmt(s.estimate) + " t (Ottos estimat)");
      if (s.confidence < 0.5) meta.push("Otto er i tvivl");
      return '<li class="isug"><div class="isug-hd"><b>' + esc(s.title) + "</b>" +
          '<span class="tag">' + esc(p ? p.name : "Ad hoc") + "</span></div>" +
        '<span class="vmeta">' + esc(senderName(s.from)) + " · " + esc(s.subject || "(intet emne)") + (mailDate(s.date) ? " · " + esc(mailDate(s.date)) : "") + "</span>" +
        (s.note ? '<p class="isug-note">' + esc(s.note) + "</p>" : "") +
        (meta.length ? '<span class="vmeta">' + esc(meta.join(" · ")) + "</span>" : "") +
        '<div class="set-links" style="margin-top:10px">' +
          '<button class="btn primary" data-act="inboxdirect" data-id="' + esc(s.id) + '" type="button">Opret</button>' +
          '<button class="btn" data-act="inboxedit" data-id="' + esc(s.id) + '" type="button">Ret og opret</button>' +
          '<button class="btn" data-act="inboxignore" data-id="' + esc(s.id) + '" type="button">Ignorér</button>' +
          '<a class="btn" href="' + esc(s.url) + '" target="_blank" rel="noopener">Åbn mail</a>' +
        "</div></li>";
    }).join("");

    var handled = (INBOX.handled || []).map(function (s) {
      return '<li class="vrow"><div class="vtxt"><b>' + esc(s.title) + '</b><span class="vmeta">' + esc(senderName(s.from)) + " · " + esc(s.subject) + "</span></div>" +
        '<span class="tag">' + esc(s.status) + "</span></li>";
    }).join("");

    box.innerHTML = status +
      (list ? '<ul class="isugs">' + list + "</ul>"
            : '<p class="col-empty">Ingen nye forslag. Tryk <b>Hent mails</b>, så læser Otto de seneste 3 dages mails.</p>') +
      (handled ? '<details class="ihandled"><summary>Behandlet (' + INBOX.handled.length + ")</summary><ul class=\"vlist\">" + handled + "</ul></details>" : "") +
      '<p class="hint" style="margin-top:14px">Otto springer kampagner, sociale, opdateringer og sendte mails over. Nye opgaver får 0 timer i denne uge, så de ikke trækker tid, før du siger det.</p>';
  }

  function suggestion(id) { return INBOX ? INBOX.suggestions.filter(function (s) { return s.id === id; })[0] : null; }

  function taskPreset(s) {
    var proj = projById(s.project) ? s.project : generalProjectId();
    var note = (s.note ? s.note.slice(0, 300) + "\n" : "") + "Fra mail: " + s.url;
    return { project: proj, start: TODAY_ISO.slice(0, 7), title: s.title, due: s.due || "", note: note,
             remaining: s.estimate || undefined, source: { type: "gmail", id: s.threadId, url: s.url } };
  }

  function markSuggestion(s, status, taskId) {
    INBOX.suggestions = INBOX.suggestions.filter(function (x) { return x.id !== s.id; });
    s.status = status;
    INBOX.handled = [s].concat(INBOX.handled || []);
    fillInbox();
    renderSidebar("indbakke");
    return api("PUT", "/api/inbox/" + encodeURIComponent(s.id), { status: status, taskId: taskId || "" })
      .catch(function (e) { flash("Kunne ikke gemme forslagets status: " + e.message, true); loadInbox(); });
  }

  function pullMail(btn) {
    btn.disabled = true;
    api("POST", "/api/agent/runs", { kind: "indbakke" }).then(function (r) {
      IPULL = r.run;
      fillInbox();
      watchRun(r.run.id, function (run, busy) {
        IPULL = run;
        fillInbox();
        if (!busy) loadInbox();
      });
    }).catch(function (e) {
      if (e.status === 401) { showLogin("Du er blevet logget ud. Log ind igen."); return; }
      btn.disabled = false;
      flash(e.message, true);
    });
  }

  function inboxClick(a, el) {
    if (a === "indbakke") { location.hash = "indbakke"; return true; }
    if (a === "inboxpull") { pullMail(el); return true; }
    var s = el.getAttribute && suggestion(el.getAttribute("data-id"));
    if (!s && /^inbox(direct|edit|ignore)$/.test(a)) return true;
    if (a === "inboxignore") { markSuggestion(s, "ignoreret"); flash("Ignoreret. Tråden kommer ikke igen, medmindre der kommer et nyt svar."); return true; }
    if (a === "inboxdirect") {
      var pr = taskPreset(s);
      var o = { id: slug(pr.project.slice(0, 5) + "-" + s.title, DATA.tasks.map(function (x) { return x.id; })),
                title: s.title, project: pr.project, sprint: "", start: pr.start, end: "", status: "Ikke startet",
                owner: "", due: pr.due, epic: "", hours: 0, note: pr.note, source: pr.source };
      if (s.estimate) o.remaining = s.estimate;
      DATA.tasks.push(o);
      markDirty();
      save();
      markSuggestion(s, "oprettet", o.id);
      return true;
    }
    if (a === "inboxedit") {
      var preset = taskPreset(s);
      preset.onCreate = function (o) {
        markSuggestion(s, "oprettet", o.id);
        setTimeout(function () { save(); }, 0);   // efter dialogen har lukket og markeret ændringen
      };
      editTask(null, preset);
      return true;
    }
    return false;
  }

  /* ====================== Omplanlæg med Otto (M9) ======================
     Otto foreslår en ændringsliste. Serveren har tjekket hver ændring og regnet
     prognosen før og efter. Anvend lægger de valgte ændringer ind og gemmer; alt kan
     fortrydes under Historik. Deadlines og "droppet" er fravalgt som standard. */

  var PLAN = null;     // det viste forslag
  var PRUN = null;     // kørslen, der laver et forslag lige nu
  var PCHECK = {};     // ændringsnummer → valgt
  var PFIELD = { sprint: "Sprint", start: "Starter", end: "Slutter", hours: "Timer pr. uge", remaining: "Timer tilbage",
                 priority: "Prioritet", status: "Status", due: "Deadline" };

  function planValue(field, v) {
    if (v === null || v === undefined || v === "") return field === "sprint" ? "ingen sprint" : "—";
    if ((field === "sprint" || field === "start" || field === "end") && /^\d{4}-\d{2}$/.test(v)) return miLabel(mi(v), true);
    if (field === "due" && isDate(v)) return FC.shortDate(v);
    if (field === "hours" || field === "remaining") return fmt(num(v)) + " t";
    return String(v);
  }

  function setPlan(p) {
    PLAN = p;
    PCHECK = {};
    (p ? p.changes : []).forEach(function (c, i) { PCHECK[i] = c.field !== "due" && !(c.field === "status" && c.to === "Droppet") && !c.needsAgreement; });
  }

  function renderPlan() {
    renderSidebar(null);
    document.title = (dirty ? "● " : "") + "Omplanlæg — HeyOtto OS";
    document.getElementById("main").innerHTML =
      pageHead("Omplanlæg med Otto", "Otto foreslår ændringer, så alle deadlines når i mål. Du vælger, hvad der bliver lagt ind.") +
      '<section class="card"><div class="card-pad">' +
        '<form class="oask" id="planform"><label class="flab" for="pmsg">Noget, Otto skal vide? (valgfrit)</label>' +
          '<textarea id="pmsg" rows="2" maxlength="2000" placeholder="Fx „Jeg er syg torsdag“ eller „Africa Tours 2.0 har forrang“"></textarea>' +
          '<div class="oask-ft"><span class="hint">Otto læser opgaver, prognose og kalender. Intet ændres, før du trykker Anvend.</span>' +
            '<button class="btn primary" type="submit" id="pgo">' + icon("spark") + "Lav forslag</button></div></form>" +
      "</div></section>" +
      '<section class="card" style="margin-top:20px"><div class="card-pad" id="pbox"></div></section>';
    wireTheme();
    fillPlan();
    if (!PLAN && !PRUN) {
      api("GET", "/api/plans").then(function (r) {
        var p = (r.plans || []).filter(function (x) { return x.status === "ny"; })[0];
        if (p && !PLAN) { setPlan(p); fillPlan(); }
      }).catch(function () {});
    }
  }

  function metricRow(b, a) {
    var cell = function (label, x, y) {
      var tone = y < x ? " good" : y > x ? " bad" : "";
      return '<div class="pmet' + tone + '"><span class="vlabel">' + label + '</span><b class="num">' + x + " → " + y + "</b></div>";
    };
    return '<div class="pmets">' +
      cell("I risiko eller over deadline", b.atRisk + b.overdue, a.atRisk + a.overdue) +
      cell("Røde alarmer", b.red, a.red) +
      cell("Overbookede uger", b.overbookedWeeks, a.overbookedWeeks) + "</div>";
  }

  function fillPlan() {
    var box = document.getElementById("pbox");
    if (!box) return;
    var go = document.getElementById("pgo");
    var busy = PRUN && OBUSY[PRUN.status];
    if (go) go.disabled = !!busy;
    if (busy) {
      var last = (PRUN.steps || []).filter(function (s) { return s.type === "tool"; }).pop();
      box.innerHTML = '<p class="hint">' + icon("spark") + " Otto laver et forslag" + (last ? " (" + esc(last.name) + ")" : "") + " … Det tager typisk et minut.</p>";
      return;
    }
    if (PRUN && !PLAN) {
      box.innerHTML = PRUN.status === "færdig"
        ? '<p class="kp-lead">' + esc(PRUN.output || "Otto lavede intet forslag.") + "</p>"
        : '<p class="hint" style="color:var(--danger-ink)">' + esc(PRUN.error || "Det gik galt.") + "</p>";
      return;
    }
    if (!PLAN) { box.innerHTML = '<p class="col-empty">Intet forslag endnu. Tryk <b>Lav forslag</b>.</p>'; return; }

    var p = PLAN, done = p.status !== "ny";
    var rows = p.changes.map(function (c, i) {
      var t = taskById(c.taskId);
      var proj = projById(c.project);
      return '<li class="pchg"><label class="gcal"><input type="checkbox" data-planchk="' + i + '"' + (PCHECK[i] ? " checked" : "") + (done ? " disabled" : "") + ">" +
          "<span><b>" + esc(t ? t.title : c.title) + "</b>" + (proj ? ' <span class="hint">· ' + esc(proj.name) + "</span>" : "") +
          '<span class="pchg-what">' + esc(PFIELD[c.field] || c.field) + ": " + esc(planValue(c.field, c.from)) + " → <b>" + esc(planValue(c.field, c.to)) + "</b>" +
            (c.needsAgreement ? ' <span class="tag">kræver aftale</span>' : "") + "</span>" +
          (c.reason ? '<span class="vmeta">' + esc(c.reason) + "</span>" : "") + "</span></label></li>";
    }).join("");
    var nChecked = p.changes.filter(function (c, i) { return PCHECK[i]; }).length;
    box.innerHTML =
      '<p class="kp-lead" style="font-size:15.5px;font-weight:500">' + esc(p.summary || "Forslag fra Otto") + "</p>" +
      metricRow(p.before, p.after) +
      '<p class="hint" style="margin:6px 0 14px">Før/efter er regnet af prognosen med alle ændringer valgt, ikke af Claude.</p>' +
      (rows ? '<ul class="pchgs">' + rows + "</ul>" : '<p class="col-empty">Ingen ændringer i forslaget.</p>') +
      (p.questions && p.questions.length ? '<div class="pq"><span class="flab">Otto spørger</span><ul>' +
        p.questions.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + "</ul></div>" : "") +
      (p.dropped && p.dropped.length ? '<details class="ihandled"><summary>Afvist af serveren (' + p.dropped.length + ")</summary><ul class=\"steps\">" +
        p.dropped.map(function (d) { var t = taskById(d.taskId); return "<li>" + esc((t ? t.title : d.taskId) + " · " + d.field + ": " + d.why) + "</li>"; }).join("") + "</ul></details>" : "") +
      (done
        ? '<p class="hint" style="margin-top:14px">Forslaget er ' + esc(p.status) + ".</p>"
        : '<div class="set-links" style="margin-top:16px"><button class="btn primary" data-act="planapply" type="button"' + (nChecked ? "" : " disabled") + ">Anvend " + plural(nChecked, "valgt ændring", "valgte ændringer") + "</button>" +
          '<button class="btn" data-act="plandrop" type="button">Kassér forslaget</button></div>');
  }

  function startPlan() {
    var ta = document.getElementById("pmsg");
    var msg = ta ? ta.value.trim() : "";
    PLAN = null; PRUN = { status: "i kø", steps: [] };
    fillPlan();
    api("POST", "/api/agent/runs", { kind: "omplanlaeg", input: msg }).then(function (r) {
      PRUN = r.run;
      fillPlan();
      watchRun(r.run.id, function (run, busy) {
        PRUN = run;
        if (busy) { fillPlan(); return; }
        api("GET", "/api/plans/" + encodeURIComponent(run.id))
          .then(function (res) { setPlan(res.plan); })
          .catch(function () { PLAN = null; })
          .then(function () { fillPlan(); if (ta) ta.value = ""; });
      });
    }).catch(function (e) {
      if (e.status === 401) { showLogin("Du er blevet logget ud. Log ind igen."); return; }
      PRUN = { status: "fejlet", error: e.message, steps: [] };
      fillPlan();
    });
  }

  function applyPlan() {
    var p = PLAN, applied = 0, skipped = [];
    p.changes.forEach(function (c, i) {
      if (!PCHECK[i]) return;
      var t = taskById(c.taskId);
      if (!t) { skipped.push(c.title + " (findes ikke længere)"); return; }
      var now = t[c.field] === undefined ? (c.field === "priority" ? "normal" : null) : t[c.field];
      if (String(now === null ? "" : now) !== String(c.from === null ? "" : c.from)) { skipped.push(c.title + " (er ændret siden)"); return; }
      if (c.field === "priority" && c.to === "normal") delete t.priority; else t[c.field] = c.to;
      applied++;
    });
    if (!applied) { flash("Ingen ændringer blev lagt ind." + (skipped.length ? " Sprunget over: " + skipped.join(", ") : ""), true); return; }
    markDirty();
    api("PUT", "/api/plans/" + encodeURIComponent(p.id), { status: "anvendt" }).catch(function () {});
    p.status = "anvendt";
    fillPlan();
    save().then(function () {
      if (dirty) return;                       // gemningen fejlede: den har selv sagt hvorfor
      flash(plural(applied, "ændring er lagt ind", "ændringer er lagt ind") + " og gemt. Kan fortrydes under Historik." +
            (skipped.length ? " Sprunget over: " + skipped.join(", ") + "." : ""), !!skipped.length);
    });
  }

  function planClick(a, el) {
    if (a === "omplan") { location.hash = "omplan"; return true; }
    if (a === "planapply") { if (PLAN) applyPlan(); return true; }
    if (a === "plandrop") {
      if (!PLAN) return true;
      api("PUT", "/api/plans/" + encodeURIComponent(PLAN.id), { status: "kasseret" }).catch(function () {});
      PLAN.status = "kasseret";
      fillPlan();
      return true;
    }
    return false;
  }

  document.addEventListener("submit", function (e) {
    if (!e.target || e.target.id !== "planform") return;
    e.preventDefault();
    startPlan();
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (!el || !el.getAttribute || el.getAttribute("data-planchk") === null) return;
    PCHECK[el.getAttribute("data-planchk")] = el.checked;
    fillPlan();
  });

  /* ====================== Tasks, projekter og rutiner ======================
     Tre enheder i sidebaren, som hver kan foldes ud:
       Tasks      alle tasks: dem uden projekt, dem i projekter og dem fra rutiner
       Projekter  de større ting med mål, sprints og tidslinje (kind "projekt")
       Rutiner    det, der kommer igen. Hver forekomst bliver en task med deadline.
     Data: Ad hoc-projektet (kind "adhoc") er "uden projekt", så gamle data passer.
     Rutiner ligger i data.rutiner; deres tid tæller som fast tid pr. uge (som drift),
     og deres tasks har 0 timer, så intet tælles to gange (dashboard/lib/forecast.mjs). */

  var SIDEOPEN = { tasks: true, projekter: true, rutiner: true };
  try {
    var savedSide = JSON.parse(localStorage.getItem("mos-side") || "{}");
    Object.keys(SIDEOPEN).forEach(function (k) { if (typeof savedSide[k] === "boolean") SIDEOPEN[k] = savedSide[k]; });
  } catch (e) {}
  var CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  function sideSection(key, label, count, href, items) {
    var open = SIDEOPEN[key];
    return '<div class="nsec">' +
      '<div class="nsec-hd"><button class="nsec-tog" data-act="sidetog" data-key="' + key + '" type="button" aria-expanded="' + open + '" ' +
        'aria-label="' + (open ? "Fold " + label + " sammen" : "Fold " + label + " ud") + '">' + CHEVRON + "</button>" +
        (href ? '<a class="nsec-lab" href="' + href + '">' + label + "</a>"
              : '<button class="nsec-lab" data-act="sidetog" data-key="' + key + '" type="button">' + label + "</button>") +
        '<span class="nsec-meta num">' + count + "</span></div>" +
      (open ? '<div class="nsec-body">' + items + "</div>" : "") + "</div>";
  }

  function isRealProject(p) { return p && p.kind !== "drift" && p.kind !== "adhoc"; }
  function generalProjectId() {
    var p = DATA.projects.filter(function (x) { return x.kind === "adhoc"; })[0];
    if (!p) {   // findes altid i nye data, men kan være slettet i gamle
      p = { id: "adhoc", name: "Uden projekt", kind: "adhoc", tagline: "Tasks uden projekt" };
      DATA.projects.push(p);
    }
    return p.id;
  }
  function isGeneral(t) { var p = projById(t.project); return !p || p.kind === "adhoc"; }
  function weekEndIso(add) { return FC.localIso(FC.addDays(FC.weekStart(new Date()), 6 + (add || 0))); }

  var TASKVIEWS = [
    { id: "",        label: "Alle tasks",   test: function () { return true; } },
    { id: "uge",     label: "Denne uge",    test: function (t) { return (isDate(t.due) && t.due <= weekEndIso()) || num(t.hours) > 0; } },
    { id: "uden",    label: "Uden projekt", test: function (t) { return isGeneral(t) && !t.routine; } },
    { id: "rutiner", label: "Fra rutiner",  test: function (t) { return !!t.routine; } }
  ];
  function taskView(id) { return TASKVIEWS.filter(function (v) { return v.id === id; })[0] || TASKVIEWS[0]; }

  var WEEKDAYS = ["", "mandag", "tirsdag", "onsdag", "torsdag", "fredag"];
  function routineWhen(r) {
    var every = (FC.EVERY && FC.EVERY[r.every]) || "Hver uge";
    if (r.every === "uge" || r.every === "2uger") every += ", " + WEEKDAYS[Number(r.weekday) || 5];
    if (r.every === "maaned") every += ", " + (Number(r.monthday) ? "d. " + Number(r.monthday) : "sidste dag");
    return every + (num(r.hours) ? " · " + fmt(num(r.hours)) + " t" : "");
  }
  function routineById(id) { return (DATA.rutiner || []).filter(function (r) { return r.id === id; })[0] || null; }
  function routineNext(r) {
    var o = FC.occurrences(r, TODAY_ISO, FC.localIso(FC.addDays(new Date(), 70)));
    return o[0] || "";
  }

  /* ----- Rutiner bliver til tasks -----
     Når appen åbnes, og når en rutine gemmes: de forekomster, der falder i dag og de
     næste 7 dage, bliver til tasks. Id'et er fast (r-<rutine>-<dato>), så to enheder
     laver den samme task, og fletningen ser dem som én. last husker den seneste
     forekomst, så en task, du har slettet, ikke kommer igen. */
  var ROUTINE_DAYS = 7;
  function materializeRoutines() {
    var list = DATA.rutiner || [], made = 0;
    if (!list.length || !FC.occurrences) return 0;
    var gen = null;
    list.forEach(function (r) {
      if (!r || r.active === false) return;
      // Daglige rutiner: kun dagens task, så listen ikke drukner. Andre: den næste uge.
      var horizon = r.every === "dag" ? TODAY_ISO : FC.localIso(FC.addDays(new Date(), ROUTINE_DAYS));
      var from = r.last && r.last >= TODAY_ISO ? FC.localIso(FC.addDays(FC.dateOnly(r.last), 1)) : TODAY_ISO;
      FC.occurrences(r, from, horizon).slice(0, 30).forEach(function (occ) {
        var id = "r-" + r.id + "-" + occ;
        if (!taskById(id)) {
          gen = gen || generalProjectId();
          DATA.tasks.push({ id: id, title: r.name, project: r.project && projById(r.project) ? r.project : gen,
                            sprint: "", start: occ.slice(0, 7), end: "", status: "Ikke startet", owner: r.owner || "",
                            due: occ, epic: "", hours: 0, note: r.note || "", routine: r.id });
          made++;
        }
        if (!r.last || occ > r.last) r.last = occ;
      });
    });
    return made;
  }

  // Når en rutine ændres: fremtidige, urørte tasks fra den laves om efter den nye plan
  function resetRoutineTasks(r) {
    DATA.tasks = DATA.tasks.filter(function (t) {
      return !(t.routine === r.id && t.due >= TODAY_ISO && stat(t).key === "ikke-startet");
    });
    r.last = "";
  }

  /* ----- Tasks-siden ----- */

  function tasksHead(title, tagline) {
    return '<div class="phead"><div><h1>' + esc(title) + '</h1><p class="tagline">' + esc(tagline) + "</p></div>" + headActions(true) + "</div>";
  }

  function taskContext(t) {
    if (t.routine) { var r = routineById(t.routine); return "Rutine" + (r ? " · " + r.name : ""); }
    var p = projById(t.project);
    if (!p || p.kind === "adhoc") return "Uden projekt";
    return p.name;
  }

  function renderTasks(v) {
    var view = taskView(v);
    renderSidebar(view.id ? "tasks/" + view.id : "tasks");
    document.title = (dirty ? "● " : "") + "Tasks — HeyOtto OS";
    var list = DATA.tasks.filter(function (t) { return isLive(t) && view.test(t); });
    var today = TODAY_ISO, we = weekEndIso(), nwe = weekEndIso(7);
    var buckets = [
      { label: "Over deadline", test: function (t) { return isDate(t.due) && t.due < today; } },
      { label: "I dag",         test: function (t) { return t.due === today; } },
      { label: "Resten af ugen", test: function (t) { return isDate(t.due) && t.due > today && t.due <= we; } },
      { label: "Næste uge",     test: function (t) { return isDate(t.due) && t.due > we && t.due <= nwe; } },
      { label: "Senere",        test: function (t) { return isDate(t.due) && t.due > nwe; } },
      { label: "Uden deadline", test: function (t) { return !isDate(t.due); } }
    ];
    var groups = buckets.map(function (b) {
      var ts = list.filter(b.test).sort(function (a, c) {
        return (a.due || "9") < (c.due || "9") ? -1 : (a.due || "9") > (c.due || "9") ? 1 : String(a.title).localeCompare(String(c.title), "da");
      });
      if (!ts.length) return "";
      return '<div class="tgroup"><div class="sec-label">' + b.label + ' <span class="num">' + ts.length + "</span></div>" +
        '<ul class="tlist">' + ts.map(taskRow).join("") + "</ul></div>";
    }).join("");
    document.getElementById("main").innerHTML =
      tasksHead(view.id ? view.label : "Tasks", "Alt, der skal laves: tasks uden projekt, tasks i projekter og tasks fra rutiner.") +
      '<div class="tviews">' + TASKVIEWS.map(function (x) {
        return '<button class="tvchip" data-act="tasksview" data-v="' + x.id + '" aria-pressed="' + (x.id === view.id) + '" type="button">' + x.label + "</button>";
      }).join("") + "</div>" +
      '<section class="card"><div class="card-pad">' +
        '<form class="tquick" id="tquick"><input id="tq" type="text" maxlength="120" placeholder="Ny task uden projekt … tryk Enter" aria-label="Ny task">' +
          '<button class="btn" type="submit">Tilføj</button>' +
          '<button class="btn" data-act="tasknew" type="button">Med detaljer</button></form>' +
        (groups || '<p class="col-empty" style="margin-top:14px">Ingen åbne tasks her.</p>') +
      "</div></section>";
    wireTheme();
  }

  function taskRow(t) {
    var late = isDate(t.due) && t.due < TODAY_ISO;
    var st = stat(t);
    var extra = [];
    if (st.key !== "ikke-startet") extra.push(st.label);
    if (num(t.remaining) > 0) extra.push(fmt(num(t.remaining)) + " t tilbage");
    if (num(t.hours) > 0) extra.push(fmt(num(t.hours)) + " t/uge");
    return '<li class="trow"><input type="checkbox" class="tchk" data-act="taskdone" data-id="' + esc(t.id) + '" aria-label="Markér „' + esc(t.title) + '“ som færdig">' +
      '<button class="ttitle" data-act="task" data-id="' + esc(t.id) + '" type="button">' + esc(t.title) +
        (extra.length ? ' <span class="tmeta">' + esc(extra.join(" · ")) + "</span>" : "") + "</button>" +
      '<span class="tctx">' + esc(taskContext(t)) + "</span>" +
      '<span class="tdue num' + (late ? " late" : "") + '">' + (isDate(t.due) ? FC.shortDate(t.due) : "") + "</span></li>";
  }

  function quickAdd(title) {
    var gen = generalProjectId();
    var id = slug("task-" + title, DATA.tasks.map(function (x) { return x.id; }));
    DATA.tasks.push({ id: id, title: title, project: gen, sprint: "", start: TODAY_ISO.slice(0, 7), end: "",
                      status: "Ikke startet", owner: "", due: "", epic: "", hours: 0, note: "" });
    markDirty();
    var input = document.getElementById("tq");
    if (input) input.focus();
  }

  /* ----- Rutiner-siden ----- */

  function renderRoutines() {
    renderSidebar("rutiner");
    document.title = (dirty ? "● " : "") + "Rutiner — HeyOtto OS";
    var list = DATA.rutiner || [];
    var rows = list.map(function (r) {
      var nxt = routineNext(r), proj = r.project && projById(r.project);
      var perWeek = FC.routineWeeklyHours({ rutiner: [Object.assign({}, r, { active: true })] });
      return '<li class="vrow"><div class="vtxt"><b>' + esc(r.name) + (r.active === false ? ' <span class="tag">sat på pause</span>' : "") + "</b>" +
        '<span class="vmeta">' + esc(routineWhen(r)) + (perWeek ? " · ca. " + fmt(perWeek) + " t/uge" : "") +
          (proj ? " · " + esc(proj.name) : "") + (nxt && r.active !== false ? " · næste " + FC.shortDate(nxt) : "") + "</span></div>" +
        '<button class="btn" data-act="routine" data-id="' + esc(r.id) + '" type="button">Rediger</button></li>';
    }).join("");
    var drift = DATA.projects.filter(function (p) { return p.kind === "drift"; })[0];
    var driftTasks = drift ? tasksOf(drift.id).filter(isLive) : [];
    var driftHtml = driftTasks.length
      ? '<section class="card" style="margin-top:20px"><div class="card-hd"><h2>Faste opgaver i ' + esc(drift.name) + "</h2>" +
          '<span class="hint">Løbende arbejde med timer pr. uge. Gør dem til rutiner, så de får en deadline hver gang.</span></div>' +
        '<div class="card-pad"><ul class="vlist">' + driftTasks.map(function (t) {
          return '<li class="vrow"><div class="vtxt"><b>' + esc(t.title) + '</b><span class="vmeta">' + fmt(num(t.hours)) + " t/uge</span></div>" +
            '<button class="btn" data-act="drift2routine" data-id="' + esc(t.id) + '" type="button">Gør til rutine</button></li>';
        }).join("") + "</ul></div></section>"
      : "";
    document.getElementById("main").innerHTML =
      tasksHead("Rutiner", "Det, der kommer igen. Hver gang laver HeyOtto OS en task med deadline under Tasks.") +
      '<section class="card"><div class="card-hd"><h2>Dine rutiner</h2>' +
        '<button class="btn primary" data-act="newroutine" type="button">+ Ny rutine</button></div>' +
        '<div class="card-pad">' +
          (rows ? '<ul class="vlist">' + rows + "</ul>"
                : '<p class="col-empty">Ingen rutiner endnu. Fx „Ugerapport hver fredag“ eller „Månedsrapport sidste dag i måneden“.</p>') +
          '<p class="hint" style="margin-top:14px">Rutinens timer tæller som fast tid pr. uge i kapaciteten. Tasks fra rutiner laves for de næste ' + ROUTINE_DAYS +
            " dage (daglige kun for i dag), og de har 0 timer, så tiden ikke tælles to gange. Senere kan Otto køre rutiner som flows.</p>" +
        "</div></section>" + driftHtml;
    wireTheme();
  }

  function editRoutine(id, preset) {
    var isNew = !id;
    var r = isNew ? Object.assign({ name: "", every: "uge", weekday: 5, monthday: 0, hours: 1, project: "", note: "", active: true }, preset || {})
                  : routineById(id);
    if (!r) return;
    var projOpts = [{ v: "", t: "Uden projekt" }].concat(DATA.projects.filter(isRealProject).map(function (p) { return { v: p.id, t: p.name }; }));
    var everyOpts = Object.keys(FC.EVERY).map(function (k) { return { v: k, t: FC.EVERY[k] }; });
    var dayOpts = [1, 2, 3, 4, 5].map(function (d) { return { v: String(d), t: WEEKDAYS[d].charAt(0).toUpperCase() + WEEKDAYS[d].slice(1) }; });
    var mdOpts = [{ v: "0", t: "Sidste dag i måneden" }];
    for (var d = 1; d <= 28; d++) mdOpts.push({ v: String(d), t: d + "." });
    openDialog(isNew ? "Ny rutine" : "Rediger rutine",
      field("Navn", '<input id="r-name" type="text" maxlength="120" value="' + esc(r.name) + '">') +
      '<div class="fgrid">' +
        field("Gentages", '<select id="r-every">' + opts(everyOpts, r.every) + "</select>") +
        field("Timer pr. gang", '<input id="r-hours" type="number" min="0" max="40" step="0.25" value="' + num(r.hours) + '">', "tæller som fast tid pr. uge") +
      "</div>" +
      '<div class="fgrid">' +
        field("Ugedag", '<select id="r-weekday">' + opts(dayOpts, String(r.weekday || 5)) + "</select>", "ved hver uge og hver anden uge") +
        field("Dag i måneden", '<select id="r-monthday">' + opts(mdOpts, String(r.monthday || 0)) + "</select>", "ved hver måned · weekend → fredagen før") +
      "</div>" +
      field("Projekt", '<select id="r-project">' + opts(projOpts, r.project || "") + "</select>", "valgfrit — ellers ligger tasks under „Uden projekt“") +
      field("Note", '<textarea id="r-note" rows="2" maxlength="400">' + esc(r.note || "") + "</textarea>", "følger med hver task") +
      '<label class="gcal" style="margin:4px 0 6px"><input type="checkbox" id="r-active"' + (r.active !== false ? " checked" : "") + "><span>Aktiv (sæt på pause ved at fjerne fluebenet)</span></label>",
      function () {
        var name = val("r-name");
        if (!name) return "Rutinen skal have et navn.";
        var o = isNew ? {} : r;
        if (!isNew) resetRoutineTasks(o);
        o.name = name; o.every = val("r-every"); o.hours = Math.max(0, num(val("r-hours")));
        o.weekday = Number(val("r-weekday")) || 5; o.monthday = Number(val("r-monthday")) || 0;
        o.project = val("r-project"); o.note = val("r-note");
        o.active = !!dlg.querySelector("#r-active").checked;
        if (isNew) {
          if (!DATA.rutiner) DATA.rutiner = [];
          o.id = slug(name, DATA.rutiner.map(function (x) { return x.id; }));
          o.last = "";
          DATA.rutiner.push(o);
          if (preset && preset.onCreate) preset.onCreate(o);
        }
        materializeRoutines();
        return null;
      },
      isNew ? null : function () {
        if (!confirm("Slet rutinen „" + r.name + "“? Tasks, den allerede har lavet, bliver liggende.")) return "afbrudt";
        DATA.rutiner = DATA.rutiner.filter(function (x) { return x.id !== r.id; });
        return null;
      });
  }

  // En fast drift-opgave (timer pr. uge) bliver til en ugentlig rutine. Den gamle sættes til Droppet.
  function driftToRoutine(taskId) {
    var t = taskById(taskId);
    if (!t) return;
    editRoutine(null, { name: t.title, hours: num(t.hours), note: t.note || "", onCreate: function () { t.status = "Droppet"; } });
  }

  function tasksClick(a, el) {
    if (a === "sidetog") {
      var k = el.getAttribute("data-key");
      SIDEOPEN[k] = !SIDEOPEN[k];
      try { localStorage.setItem("mos-side", JSON.stringify(SIDEOPEN)); } catch (e) {}
      route();
      return true;
    }
    if (a === "tasksview") { var v = el.getAttribute("data-v"); location.hash = v ? "tasks/" + v : "tasks"; return true; }
    if (a === "taskdone") {
      var t = taskById(el.getAttribute("data-id"));
      if (t) { t.status = "Færdig"; markDirty(); flash("„" + t.title + "“ er færdig. Husk at trykke Gem."); }
      return true;
    }
    if (a === "tasknew") { editTask(null, { project: generalProjectId(), start: TODAY_ISO.slice(0, 7) }); return true; }
    if (a === "routine") { editRoutine(el.getAttribute("data-id")); return true; }
    if (a === "newroutine") { editRoutine(null); return true; }
    if (a === "drift2routine") { driftToRoutine(el.getAttribute("data-id")); return true; }
    return false;
  }

  document.addEventListener("submit", function (e) {
    if (!e.target || e.target.id !== "tquick") return;
    e.preventDefault();
    var input = document.getElementById("tq");
    var title = input ? input.value.trim() : "";
    if (title) quickAdd(title);
  });

  /* ====================== Tema ====================== */

  function currentTheme() {
    var set = document.documentElement.getAttribute("data-theme");
    if (set) return set;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function wireTheme() {
    var btn = document.getElementById("themebtn");
    if (!btn) return;
    btn.innerHTML = currentTheme() === "dark" ? icon("sun") + "Lyst tema" : icon("moon") + "Mørkt tema";
    btn.addEventListener("click", function () {
      document.documentElement.setAttribute("data-theme", currentTheme() === "dark" ? "light" : "dark");
      btn.innerHTML = currentTheme() === "dark" ? icon("sun") + "Lyst tema" : icon("moon") + "Mørkt tema";
    });
  }

  /* ====================== Start ====================== */

  function fromHash() { return (location.hash || "").replace(/^#/, ""); }

  // Én indgang til al gentegning. Tomt hash = kapacitet, fordi det er dét,
  // dashboardet åbnes for. Fokus og markørposition bevares, så man kan taste
  // videre i et talfelt, selv om siden bliver tegnet forfra ved hvert tastetryk.
  function route() {
    FC_CACHE = null;   // data, kalender eller udsættelser kan have ændret sig
    var a = document.activeElement;
    var id = a && a.id ? a.id : null;
    var key = a && a.getAttribute && a.getAttribute("data-cap")
      ? [a.getAttribute("data-cap"), a.getAttribute("data-id") || "", a.getAttribute("data-uge") || "", a.getAttribute("data-key") || ""].join("|")
      : null;
    var pos = a && a.selectionStart != null ? a.selectionStart : null;

    // Ukendt hash lander på forsiden frem for stiltiende på det første projekt.
    // Det var dét, der fik genvejslinkene til at ligne et projektskifte.
    if (!DATA) return;
    var h = fromHash();
    if (h !== "claude") NEWKEY = null;   // en ny nøgle vises kun, mens man er på siden
    if (h === "versioner") renderVersions();
    else if (h === "claude") renderClaude();
    else if (h === "otto") renderOtto();
    else if (h === "indbakke") renderInbox();
    else if (h === "omplan") renderPlan();
    else if (h === "tasks" || h.indexOf("tasks/") === 0) renderTasks(h.slice(6));
    else if (h === "rutiner") renderRoutines();
    else if (!h || h === "kapacitet" || !projById(h)) renderCapacity();
    else render(h);

    var back = id ? document.getElementById(id) : null;
    if (!back && key) {
      var p = key.split("|");
      back = document.querySelector('[data-cap="' + p[0] + '"]' +
        (p[1] ? '[data-id="' + p[1] + '"]' : "") +
        (p[2] ? '[data-uge="' + p[2] + '"]' : "") +
        (p[3] ? '[data-key="' + p[3] + '"]' : ""));
    }
    if (back && back !== document.activeElement) {
      try { back.focus({ preventScroll: true }); } catch (e) { back.focus(); }
      if (pos != null && back.setSelectionRange) {
        try { back.setSelectionRange(pos, pos); } catch (e) {}
      }
    }
    refreshSettings();
  }

  window.addEventListener("hashchange", route);

  /* ====================== Login og opstart ====================== */

  function showLogin(msg) {
    document.getElementById("app").hidden = true;
    document.getElementById("login").hidden = false;
    document.getElementById("loginerr").textContent = msg || "";
    document.title = "Log ind — HeyOtto OS";
    var pw = document.getElementById("loginpw");
    pw.value = "";
    pw.focus();
  }

  document.getElementById("loginform").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;
    api("POST", "/api/login", { password: document.getElementById("loginpw").value })
      .then(function () { return boot(); })
      .catch(function (err) { document.getElementById("loginerr").textContent = err.message; })
      .then(function () { btn.disabled = false; });
  });

  function logout() {
    if (dirty && !confirm("Du har ugemte ændringer. Log ud alligevel? De ligger i kladden i denne browser til næste gang.")) return;
    api("POST", "/api/logout").then(function () {
      DATA = null; dirty = false;
      showLogin("");
    }).catch(function (e) { flash("Kunne ikke logge ud: " + e.message, true); });
  }

  function crash(err, title, hint) {
    document.getElementById("login").hidden = true;
    document.getElementById("app").hidden = false;
    document.getElementById("main").innerHTML =
      '<div class="banner banner-warn"><h3>' + icon("alert") + esc(title) + "</h3>" +
      "<p>" + esc(err && err.message ? err.message : String(err)) + "</p>" +
      '<p style="margin-top:8px">' + esc(hint) + " Dine ugemte ændringer i denne browser er ikke rørt.</p>" +
      '<p style="margin-top:12px"><button class="btn" type="button" onclick="location.reload()">Prøv igen</button></p></div>';
  }

  // Tilbage fra Google (api.mts sender ?google=forbundet|fejl&besked=…): sig hvordan det gik,
  // vis forbindelserne, og ryd adressen, så beskeden ikke kommer igen ved genindlæsning.
  function googleReturn() {
    var q = new URLSearchParams(location.search);
    var how = q.get("google");
    if (!how) return;
    try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
    openSettings("forbindelser");
    if (how === "forbundet") flash("Google er forbundet: " + (q.get("besked") || "") + ". Dine møder hentes nu.");
    else flash(q.get("besked") || "Forbindelsen til Google mislykkedes.", true);
  }

  // Hent data fra skyen. Er man ikke logget ind, vises login-skærmen.
  // Prognose- og kalenderreglerne (dashboard/lib/forecast.mjs) hentes én gang, sammen med data.
  var FC = null;
  var FC_LOAD = null;
  function loadForecastModule() {
    if (!FC_LOAD) FC_LOAD = import("./lib/forecast.mjs").then(function (m) { FC = m; return m; }, function (e) {
      FC_LOAD = null;
      var err = new Error("Prognosemodulet kunne ikke hentes (" + (e && e.message ? e.message : e) + ").");
      err.status = 0;
      throw err;
    });
    return FC_LOAD;
  }

  function boot() {
    return Promise.all([api("GET", "/api/data"), loadForecastModule()]).then(function (all) {
      var res = all[0];
      DATA = res.data;
      DATA_REV = res.rev || "";
      BASE = clone(res.data);
      document.getElementById("login").hidden = true;
      document.getElementById("app").hidden = false;
      try {
        loadDraft();
        // Rutiner: læg dagens og ugens tasks ind (gemmes med det samme, hvis intet andet er ugemt)
        var made = materializeRoutines();
        if (made && !dirty) save(false, "Rutiner: " + plural(made, "ny task", "nye tasks") + " er lagt ind.");
        else if (made) saveDraft();
        route();
      } catch (err) {
        crash(err, "Dashboardet kunne ikke tegnes", "Det skyldes næsten altid en fejl i data — bed Claude om at se på den.");
        return;
      }
      loadJobs();
      loadCalendar();
      loadAlerts();
      loadInbox();
      googleReturn();
    }, function (err) {
      if (err.status === 401 || err.status === 503) { showLogin(err.status === 503 ? err.message : ""); return; }
      crash(err, "HeyOtto OS kunne ikke hente dine data", "Prøv at genindlæse om lidt.");
    });
  }

  boot();
})();
</script>

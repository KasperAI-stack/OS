<style>
/* Farver, skrift og former: se brand/hey-otto/guidelines.md.
   Sort, grå og hvid bærer designet; lilla er en accent, der bruges sparsomt. */

:root {
  color-scheme: light;
  --font: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F4F2F8;
  --ink: #0F0E13;
  --ink-2: #5E5A6B;
  --muted: #5E5A6B;
  --border: #E4E1EC;
  --border-strong: #D3CFDD;
  --plus: #A7A3B2;
  --accent: #7C3AED;
  --accent-soft: rgba(124,58,237,0.09);
  --on-accent: #FFFFFF;
  --danger-ink: #C026D3;
  --on-danger: #FFFFFF;
  --gradient: linear-gradient(135deg, #4C1D95 0%, #7C3AED 38%, #C026D3 72%, #F472B6 100%);
  --sidebar-bg: #0F0E13;
  --sidebar-fg: #F4F2F8;
  --sidebar-muted: #A7A3B2;
  --sidebar-line: #3B3845;
  --sidebar-hover: rgba(244,242,248,0.06);
  --sidebar-active: rgba(244,242,248,0.11);
  --st-ikke-startet: #A7A3B2;
  --st-i-gang: #7C3AED;
  --st-blokeret: #C026D3;
  --st-faerdig: #0F0E13;
  --st-droppet: #A7A3B2;
  --st-ukendt: #FACC15;
  --st-ukendt-edge: #0F0E13;
  --c-drift: #0F0E13;
  --c-projekt: #7C3AED;
  --c-adhoc: #F472B6;
  --lane: rgba(15,14,19,0.025);
  --hatch: rgba(255,255,255,0.45);
  --shadow: none;
  --shadow-pop: 0 24px 60px -24px rgba(15,14,19,0.38);
  --backdrop: rgba(15,14,19,0.45);
  --r-card: 22px;
  --r-inner: 14px;
  --r-field: 12px;
  --gantt-label: 272px;
  --gantt-col: 76px;
  --gantt-row: 34px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F0E13;
    --surface: #0F0E13;
    --surface-2: #1E1C24;
    --ink: #F4F2F8;
    --ink-2: #A7A3B2;
    --muted: #A7A3B2;
    --border: #2B2932;
    --border-strong: #3B3845;
    --plus: #6B6778;
    --accent: #F472B6;
    --accent-soft: rgba(244,114,182,0.13);
    --on-accent: #0F0E13;
    --danger-ink: #F472B6;
    --sidebar-bg: #1E1C24;
    --sidebar-line: #3B3845;
    --st-ikke-startet: #6B6778;
    --st-faerdig: #F4F2F8;
    --st-droppet: #6B6778;
    --st-ukendt-edge: #F4F2F8;
    --c-drift: #A7A3B2;
    --lane: rgba(244,242,248,0.03);
    --hatch: rgba(255,255,255,0.24);
    --shadow-pop: 0 24px 60px -20px rgba(0,0,0,0.75);
    --backdrop: rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F0E13;
  --surface: #0F0E13;
  --surface-2: #1E1C24;
  --ink: #F4F2F8;
  --ink-2: #A7A3B2;
  --muted: #A7A3B2;
  --border: #2B2932;
  --border-strong: #3B3845;
  --plus: #6B6778;
  --accent: #F472B6;
  --accent-soft: rgba(244,114,182,0.13);
  --on-accent: #0F0E13;
  --danger-ink: #F472B6;
  --sidebar-bg: #1E1C24;
  --sidebar-line: #3B3845;
  --st-ikke-startet: #6B6778;
  --st-faerdig: #F4F2F8;
  --st-droppet: #6B6778;
  --st-ukendt-edge: #F4F2F8;
  --c-drift: #A7A3B2;
  --lane: rgba(244,242,248,0.03);
  --hatch: rgba(255,255,255,0.24);
  --shadow-pop: 0 24px 60px -20px rgba(0,0,0,0.75);
  --backdrop: rgba(0,0,0,0.6);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 {
  font-family: var(--font);
  font-weight: 600;
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Ikoner: streg på 1,8 i et 24-felt, runde ender og hjørner */
.i { width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px; }

/* ---------- Skal ---------- */
.shell { display: flex; align-items: flex-start; min-height: 100vh; }

/* Sidebaren er en mørk flade — derfor gælder mørk-flade-tonerne herinde,
   også i lyst tema: Rosé som accent og lyse/mørke statusprikker byttet om. */
.sidebar {
  --accent: #F472B6;
  --st-faerdig: #F4F2F8;
  --st-ikke-startet: #6B6778;
  --st-droppet: #6B6778;
  width: 240px;
  flex: 0 0 240px;
  align-self: stretch;
  background: var(--sidebar-bg);
  color: var(--sidebar-fg);
  padding: 24px 0 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brandmark { padding: 0 22px 24px; color: var(--sidebar-fg); }
.bm-row { display: flex; align-items: center; gap: 10px; }
.bm-icon { width: 28px; height: 28px; flex: 0 0 28px; display: block; }
.bm-word { height: 24px; width: auto; display: block; }
.brandmark span { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sidebar-muted); margin-top: 10px; }

.nav-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sidebar-muted); padding: 0 22px 8px; }
#navtop, #mktnav { margin-bottom: 18px; }
.proj {
  display: flex; align-items: flex-start; gap: 10px;
  width: calc(100% - 20px); margin: 1px 10px; text-align: left;
  background: none; border: 0; border-radius: var(--r-inner);
  color: var(--sidebar-fg); font: inherit;
  padding: 9px 12px; cursor: pointer;
}
.proj:hover { background: var(--sidebar-hover); }
.proj[aria-current="true"] { background: var(--sidebar-active); }
.proj[aria-current="true"] .pname { font-weight: 600; }
.proj .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: 0 0 8px; }
.proj .pname { font-size: 14px; font-weight: 500; }
.proj .pmeta { font-size: 12px; color: var(--sidebar-muted); }
.sidebar-foot { margin-top: 24px; padding: 16px 22px 0; border-top: 1px solid var(--sidebar-line); font-size: 12px; color: var(--sidebar-muted); }
.sidebar-foot b { color: var(--sidebar-fg); font-weight: 500; }
.sf-acts { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; margin-top: 14px; }
.sf-link { font: inherit; font-size: 12px; font-weight: 500; color: var(--sidebar-fg); background: none; border: 0; padding: 0;
           cursor: pointer; text-decoration: underline; text-decoration-color: var(--sidebar-line); text-underline-offset: 3px; }
.sf-link:hover { text-decoration-color: var(--accent); }
[hidden] { display: none !important; }

/* ---------- Login ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
.login-card { width: min(400px, 100%); background: var(--gradient); padding: 6px; border-radius: var(--r-card); }
.login-inner { background: var(--surface); border-radius: var(--r-inner); padding: 30px 28px 26px; }
.login-inner img { width: 44px; height: 44px; display: block; margin-bottom: 20px; }
.login-inner h1 { font-size: 30px; letter-spacing: -0.035em; }
.login-inner .hint { margin: 6px 0 22px; }
.login-inner input[type="password"] { font: inherit; font-size: 15px; width: 100%; padding: 11px 13px; border-radius: var(--r-field);
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink); }
.login-inner input[type="password"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.login-err { min-height: 20px; color: var(--danger-ink); font-size: 13px; margin: 2px 0 14px; }
.login-inner .btn { width: 100%; justify-content: center; padding: 11px 16px; font-size: 14px; }

/* ---------- Historik og Claude-adgang ---------- */
.vlist { list-style: none; margin: 0; padding: 0; }
.vrow { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.vrow:first-child { padding-top: 0; }
.vrow:last-child { border-bottom: 0; padding-bottom: 0; }
.vrow .vtxt { flex: 1 1 auto; min-width: 0; }
.vrow .vtxt b { display: block; font-weight: 600; }
.vrow .vmeta { font-size: 12.5px; color: var(--muted); }
.vrow .btn, .vrow .tag { flex: 0 0 auto; }
.kp-lead { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 8px; }
.kp-list, .kp-steps { margin: 12px 0 18px; padding-left: 20px; color: var(--ink-2); }
.kp-list li, .kp-steps li { margin-bottom: 6px; }
.kp-steps code, .kp-list code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; color: var(--ink); }
.kp-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.keybox { display: flex; gap: 8px; margin: 14px 0 6px; }
.keybox input { flex: 1 1 auto; min-width: 0; font: 500 13px var(--mono); padding: 9px 12px; border-radius: var(--r-field);
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink); }

.main { flex: 1 1 auto; min-width: 0; padding: 0 34px; }
/* Siden står i et grid af tynde linjer med plus-mærker, hvor linjerne mødes */
.main-inner { max-width: 1120px; margin: 0 auto; min-height: 100vh; padding: 30px 28px 90px;
              border-inline: 1px solid var(--border); }
.phead, footer { position: relative; margin-inline: -28px; padding-inline: 28px; }
.phead::before, .phead::after, footer::before, footer::after {
  content: ""; position: absolute; width: 11px; height: 11px;
  background: linear-gradient(var(--plus), var(--plus)) center / 1px 100% no-repeat,
              linear-gradient(var(--plus), var(--plus)) center / 100% 1px no-repeat;
}
.phead::before, .phead::after { bottom: -6px; }
footer::before, footer::after { top: -6px; }
.phead::before, footer::before { left: -6px; }
.phead::after, footer::after { right: -6px; }

/* ---------- Banner ---------- */
.banner { border-radius: var(--r-inner); padding: 14px 18px; margin-bottom: 20px; font-size: 13.5px; border: 1px solid; }
.banner h3 { font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px;
             display: flex; align-items: center; gap: 7px; }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.banner-warn { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.banner-warn h3 .i { color: var(--accent); }
.banner-info { background: var(--surface-2); border-color: var(--border); color: var(--ink-2); }

/* ---------- Projekt-header ---------- */
.phead { display: flex; align-items: flex-start; gap: 18px; padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
.phead h1 { font-size: 36px; line-height: 1.05; letter-spacing: -0.035em; }
.phead .tagline { color: var(--ink-2); font-size: 15px; margin-top: 8px; max-width: 62ch; }
.theme-btn {
  margin-left: auto; flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--border-strong); border-radius: 999px;
  padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
}
.theme-btn:hover { border-color: var(--ink); color: var(--ink); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 13px 5px 11px; font-size: 13px; font-weight: 500; color: var(--ink-2);
}
.chip b { color: var(--ink); font-weight: 600; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip.alarm { border-color: var(--st-blokeret); }

/* ---------- Jump-nav ---------- */
.jump { display: flex; gap: 8px; flex-wrap: wrap; position: sticky; top: 0; z-index: 20;
        background: var(--bg); padding: 10px 0 12px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
.jump a { font-size: 13px; font-weight: 500; text-decoration: none; color: var(--ink-2);
          border: 1px solid var(--border-strong); border-radius: 999px; padding: 5px 14px; background: var(--surface); }
.jump a:hover { border-color: var(--ink); color: var(--ink); }

/* ---------- Sektioner og kort ---------- */
section { margin-top: 34px; scroll-margin-top: 62px; }
.sec-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow); }
.card-pad { padding: 22px 24px; }

.sprint-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sprint-head h2 { font-size: 24px; letter-spacing: -0.025em; }
.tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--ink-2); }
.tag.now { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.goal { border-left: 2px solid var(--accent); padding: 2px 0 2px 16px; margin: 16px 0 20px;
        font-size: 19px; font-weight: 500; line-height: 1.35; letter-spacing: -0.015em; color: var(--ink); }
.goal.empty { border: 1px dashed var(--border-strong); border-radius: var(--r-inner); background: none;
              padding: 11px 16px; text-align: left; color: var(--muted); font-size: 14.5px; font-weight: 400; letter-spacing: 0; }

.meter { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
.meter-track { flex: 1 1 220px; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 160px; }
.meter-fill { height: 100%; background: var(--st-faerdig); border-radius: 999px; }
.meter-txt { font-size: 13px; color: var(--ink-2); }

/* ---------- Kanban ---------- */
.kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 22px; }
.col-head { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.col-head .dot { width: 8px; height: 8px; border-radius: 50%; }
.col-head .cnt { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.tcard { background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); border-radius: var(--r-field); padding: 10px 12px; margin-bottom: 9px; }
.tcard .tt { font-size: 13.5px; font-weight: 500; line-height: 1.35; }
.tcard .tm { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tcard .tnote { font-size: 12px; color: var(--ink-2); margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--border-strong); }
.ep { font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; font-weight: 500; color: var(--ink-2);
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; padding: 1px 6px; flex: 0 0 auto; }
.due { display: inline-flex; align-items: center; gap: 4px; }
.due .i { width: 13px; height: 13px; vertical-align: 0; }
.due.over { color: var(--danger-ink); font-weight: 600; }
.col-empty { font-size: 12.5px; color: var(--muted); padding: 4px 0 8px; }

/* ---------- Historik ---------- */
details.hist { border: 1px solid var(--border); border-radius: var(--r-inner); background: var(--surface); margin-bottom: 9px; }
details.hist summary { cursor: pointer; padding: 12px 16px; font-size: 13.5px; color: var(--ink-2); list-style: none; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; border-radius: var(--r-inner); }
details.hist summary::-webkit-details-marker { display: none; }
details.hist summary::before { content: ""; width: 6px; height: 6px; flex: 0 0 6px; align-self: center; margin: 0 3px 0 1px;
                               border-right: 1.8px solid var(--muted); border-bottom: 1.8px solid var(--muted);
                               border-radius: 1px; transform: rotate(-45deg); transition: transform .15s; }
details.hist[open] summary::before { transform: rotate(45deg); }
details.hist summary b { color: var(--ink); font-weight: 600; }
details.hist summary .g { color: var(--muted); }
details.hist .hist-body { padding: 0 16px 14px 34px; }
.hrow { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
.hrow .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.hrow .hd { margin-left: auto; color: var(--muted); font-size: 12px; }

/* ---------- Gantt ---------- */
.gantt-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow); }
.gantt { display: grid; position: relative; width: max-content; min-width: 100%; }
.g-cell { font-size: 12px; font-weight: 500; color: var(--ink-2); text-align: center; padding: 9px 4px; border-left: 1px solid var(--border); background: var(--surface-2); }
.g-cell.year { border-left: 1px solid var(--border-strong); }
.g-cell .yr { display: block; font-family: var(--mono); font-size: 10px; font-weight: 400; color: var(--muted); }
.g-corner { position: sticky; left: 0; z-index: 3; background: var(--surface-2); border-bottom: 1px solid var(--border);
            font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 11px 16px; }
.g-head { border-bottom: 1px solid var(--border); }
.g-label {
  position: sticky; left: 0; z-index: 2; background: var(--surface);
  padding: 0 16px; height: var(--gantt-row); display: flex; align-items: center; gap: 8px;
  font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-right: 1px solid var(--border); border-top: 1px solid var(--border);
}
.g-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.g-label .txt { overflow: hidden; text-overflow: ellipsis; }
.g-lane { border-top: 1px solid var(--border); }
.g-lane.alt { background: var(--lane); }
.g-bar {
  align-self: center; height: 16px; border-radius: 999px; margin: 0 3px;
  position: relative; z-index: 1; cursor: default;
}
.g-bar.st-ikke-startet { background: var(--st-ikke-startet); }
.g-bar.st-i-gang       { background: var(--st-i-gang); }
.g-bar.st-faerdig      { background: var(--st-faerdig); }
.g-bar.st-blokeret     { background: repeating-linear-gradient(45deg, var(--st-blokeret) 0 6px, var(--hatch) 6px 11px); box-shadow: inset 0 0 0 1.5px var(--st-blokeret); }
.g-bar.st-droppet      { background: transparent; border: 1.5px dashed var(--st-droppet); }
.g-bar.st-ukendt       { background: var(--st-ukendt); box-shadow: inset 0 0 0 1.5px var(--st-ukendt-edge); }
.g-diamond { position: absolute; top: 50%; width: 9px; height: 9px; background: var(--ink); border: 1.5px solid var(--surface);
             border-radius: 2px; transform: translate(-50%, -50%) rotate(45deg); }
.g-diamond.over { background: var(--st-blokeret); }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 4; pointer-events: none; }
.g-today::before { content: "I DAG"; position: absolute; top: 3px; left: 4px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; font-weight: 500;
                   color: var(--on-accent); background: var(--accent); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
/* Filter- og grupperingsbjælke over tidslinjen */
.gctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.gctl select {
  font: inherit; font-size: 12.5px; font-weight: 500; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-2);
  max-width: 220px; cursor: pointer;
}
.gctl select:hover { border-color: var(--ink); color: var(--ink); }
.gctl select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.gcount { font-size: 12px; color: var(--muted); margin-left: auto; }

.g-group { border-top: 1px solid var(--border-strong); background: var(--surface-2); height: 30px; }
.g-group .gg {
  position: sticky; left: 0; display: inline-flex; align-items: center; gap: 8px; height: 30px;
  padding: 0 16px; font-size: 12px; letter-spacing: -0.005em; font-weight: 600;
  color: var(--ink); white-space: nowrap;
}
.g-group .gg b { color: var(--muted); font-weight: 500; font-family: var(--mono); font-size: 11px; }

.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 9px; border-radius: 3px; display: inline-block; }

.empty p:first-child { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }
.empty code { font-family: var(--mono); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; font-size: 12px; }

footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }

/* ---------- Smalle skærme ---------- */
@media (max-width: 1000px) { .kanban { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 760px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; flex: none; height: auto; position: static; padding-bottom: 14px; }
  .brandmark { padding-bottom: 16px; }
  .sidebar-foot { margin-top: 14px; }
  .main { padding: 0; width: 100%; }
  .main-inner { border-inline: 0; min-height: 0; padding: 22px 18px 70px; }
  .phead, footer { margin-inline: 0; padding-inline: 0; }
  .phead::before, .phead::after, footer::before, footer::after { display: none; }
  .phead { flex-wrap: wrap; }
  .kanban { grid-template-columns: 1fr; }
  .phead h1 { font-size: 28px; }
  .card-pad { padding: 18px; }
  :root { --gantt-label: 180px; }
}

/* ---------- Kapacitet ---------- */
/* Dommen står i en gradientramme — det ene sted, lilla får lov at fylde */
.verdict { display: grid; grid-template-columns: minmax(210px, 1.15fr) 1fr 1fr; gap: 6px;
           background: var(--gradient); padding: 6px; border-radius: var(--r-card);
           margin-bottom: 22px; }
.vcell { background: var(--surface); border-radius: var(--r-inner); padding: 18px 20px 16px; display: flex; flex-direction: column; min-width: 0; }
.vlabel { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.vbig { font-size: 44px; line-height: 1.02; font-weight: 600; letter-spacing: -0.045em; margin-top: 8px; }
.vbig small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.vmid { font-size: 28px; line-height: 1.08; font-weight: 600; letter-spacing: -0.03em; margin-top: 10px; }
.vnote { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; margin-top: 12px;
        padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--st-faerdig); border-color: var(--border-strong); background: var(--surface-2); }
.pill.warn { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.pill.crit { color: var(--danger-ink); border-color: var(--st-blokeret); background: var(--surface-2); }
.proj .dot.good { background: var(--st-faerdig); }
.proj .dot.warn { background: var(--accent); }
.proj .dot.crit { background: var(--st-blokeret); }
.proj .dot.idle { background: var(--sidebar-muted); }

.cap2 { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 20px; align-items: start; }
.card-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
           flex-wrap: wrap; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.card-hd h2 { font-size: 17px; letter-spacing: -0.015em; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

.krow { display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 9px 0; border-bottom: 1px dashed var(--border-strong); }
.krow:last-of-type { border-bottom: 0; }
.klab { color: var(--ink-2); font-size: 13.5px; }
.ksub { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.ktotal { display: flex; align-items: baseline; justify-content: space-between; margin-top: 12px;
          padding-top: 12px; border-top: 1px solid var(--border-strong); color: var(--ink-2); }
.ktotal b { font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -0.03em; }
.kceil { margin-top: 18px; }
.kceil-hd { display: flex; justify-content: space-between; align-items: baseline; color: var(--ink-2); font-size: 13.5px; margin-bottom: 4px; }
.kbuffer { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }

input[type="number"] { font: inherit; font-size: 14px; width: 78px; text-align: right;
  font-variant-numeric: tabular-nums; padding: 6px 10px; border-radius: 10px;
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink); }
input[type="number"]:disabled { color: var(--muted); background: var(--lane); }
input[type="number"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.bar-wrap { padding-top: 24px; }
.bar-track { position: relative; height: 34px; border-radius: var(--r-field); background: var(--surface-2);
             border: 1px solid var(--border); display: flex; overflow: hidden; }
.seg { height: 100%; border-right: 2px solid var(--surface); min-width: 0; }
.seg:last-child { border-right: 0; }
.bar-over { position: absolute; top: 0; bottom: 0; right: 0;
            background: repeating-linear-gradient(135deg, var(--st-blokeret) 0 5px, transparent 5px 10px); opacity: .6; }
.ceil { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); opacity: .7; }
.ceil-lbl { position: absolute; top: -22px; transform: translateX(-50%); font-family: var(--mono); font-size: 10px;
            letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 16px; font-size: 12.5px; color: var(--ink-2); }
.legend .lg { display: flex; align-items: center; gap: 7px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend i.slack { background: var(--surface-2); border: 1px solid var(--border-strong); }
.legend b { color: var(--ink); font-weight: 600; }

.curve-wrap { overflow-x: auto; }
.curve-wrap svg { width: 100%; min-width: 420px; height: auto; display: block; }
/* Zonen under det anbefalede loft: et svagt lilla skær i stedet for en grå flade */
.curve-wrap rect { fill: var(--accent); }

.capgroup { margin-bottom: 20px; }
.capgroup:last-of-type { margin-bottom: 0; }
.caphd { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-2);
         padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.caphd i { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 10px; }
.caphd b { color: var(--ink); font-weight: 600; }
.caphd .ksub { display: inline; }
.capsum { margin-left: auto; font-weight: 600; color: var(--ink); }
.caprow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.caprow:last-child { border-bottom: 0; }
.caprow .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.caprow .cn { font-size: 13.5px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.caprow .cn:hover { color: var(--accent); }
.caprow .cp { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }

.table-scroll { overflow-x: auto; }
.wtbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.wtbl th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
           color: var(--muted); font-weight: 500; padding: 0 10px 8px 0; border-bottom: 1px solid var(--border); }
.wtbl td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
.wtbl tr:last-child td { border-bottom: 0; }
.wtbl .r, .wtbl th.r { text-align: right; padding-right: 0; }
.wtbl input[type="number"] { width: 68px; }
.wacts { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.foot { font-size: 12.5px; color: var(--muted); max-width: 72ch; margin-top: 28px; }

@media (max-width: 860px) { .cap2 { grid-template-columns: 1fr; } .verdict { grid-template-columns: 1fr; } }

/* ---------- Marketing-dashboard: tal fra Google og Meta ----------
   Ingen gradient her — den er forbeholdt dommen på kapacitetssiden. */
.dmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: -8px 0 22px; font-size: 12.5px; color: var(--muted); }
.seg-ctl { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg-ctl button { font: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink-2); background: none; border: 0;
                  border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.seg-ctl button:hover { color: var(--ink); }
.seg-ctl button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.dsum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
.dsum .dcell { padding: 18px 20px 16px; border-left: 1px solid var(--border); min-width: 0; }
.dsum .dcell:first-child { border-left: 0; }
.dval { font-size: 30px; line-height: 1.05; font-weight: 600; letter-spacing: -0.035em; margin-top: 8px; }
.dsub { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 8px; }
.delta .arr { font-size: 10px; }
.dsrc { margin-top: 22px; }
.dsrc .card-hd { align-items: center; }
.dsrc .card-hd .pill { margin-top: 0; }
.dsrc .card-hd .hint { margin-right: auto; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
       border-radius: var(--r-inner); padding: 12px 14px; cursor: pointer; min-width: 0; }
.kpi:hover { border-color: var(--border-strong); }
.kpi[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.kpi .kv { display: block; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; margin-top: 6px; line-height: 1.1; }
.kpi .delta { margin-top: 6px; }
.dchart { position: relative; margin-top: 18px; }
.dchart svg { width: 100%; height: auto; display: block; overflow: visible; }
.dchart .gl { stroke: var(--border); stroke-width: 1; }
.dchart .ax { fill: var(--muted); font: 500 10.5px var(--mono); }
.dchart .cur { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dchart .prev { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; stroke-linejoin: round; opacity: .8; }
.dchart .cross { stroke: var(--ink-2); stroke-width: 1; }
.dchart .hdot { stroke: var(--surface); stroke-width: 2; }
.dchart .hdot.c { fill: var(--accent); }
.dchart .hdot.p { fill: var(--muted); }
.dtip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--border-strong);
        border-radius: 10px; padding: 7px 10px; font-size: 12px; line-height: 1.45; box-shadow: var(--shadow-pop); white-space: nowrap; z-index: 5; }
.dtip b { font-weight: 600; }
.dtip .tl { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.dtip .tl i, .dlegend i { width: 14px; height: 0; border-top: 2px solid var(--accent); display: inline-block; }
.dtip .tl i.p, .dlegend i.p { border-top: 2px dashed var(--muted); }
.dlegend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
.dlegend span { display: inline-flex; align-items: center; gap: 7px; }
.dtables { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 24px; }
.dtables.one { grid-template-columns: 1fr; }
.dtables h3 { font-size: 13.5px; letter-spacing: -0.01em; margin-bottom: 10px; }
.wtbl td.nm { max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wtbl td.r, .wtbl th.r { white-space: nowrap; padding-left: 10px; }
.dsetup { font-size: 13.5px; color: var(--ink-2); }
.dsetup ul { margin: 8px 0 10px; padding-left: 18px; }
.dsetup code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; color: var(--ink); }
.dsrc .banner { margin-bottom: 16px; }
@media (max-width: 860px) {
  .dsum { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dsum .dcell:nth-child(3) { border-left: 0; }
  .dsum .dcell:nth-child(n+3) { border-top: 1px solid var(--border); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dtables { grid-template-columns: 1fr; }
}

/* ---------- Knapper ----------
   Helt runde i enderne og i tekstfarven — den primære knap er blæk, ikke lilla. */
.btn { display: inline-flex; align-items: center; gap: 7px;
       font: inherit; font-size: 13px; font-weight: 500; padding: 7px 15px; border-radius: 999px; cursor: pointer;
       background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.btn.primary:hover { opacity: .86; }
.btn.primary.ghost { background: var(--surface); border-color: var(--border-strong); color: var(--muted); font-weight: 500; }
.btn.primary.ghost:hover { color: var(--ink); border-color: var(--ink); opacity: 1; }
.btn.danger { border-color: var(--st-blokeret); color: var(--danger-ink); }
.btn.danger:hover { background: var(--st-blokeret); color: var(--on-danger); }
.btn:disabled:hover { border-color: var(--border-strong); }
.btn.primary:disabled:hover { border-color: var(--ink); opacity: .45; }
.udot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 7px; }
.icon-btn { font: inherit; line-height: 1; background: none; border: 0; cursor: pointer;
            color: var(--muted); width: 30px; height: 30px; padding: 0; border-radius: 999px; vertical-align: middle;
            display: inline-grid; place-items: center; }
.icon-btn .i { width: 17px; height: 17px; vertical-align: 0; }
.icon-btn:hover { color: var(--accent); background: var(--accent-soft); }
.pacts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
.unsaved { color: var(--accent); font-weight: 600; }

.proj.add { color: var(--sidebar-muted); align-items: center; }
.proj.add:hover { color: var(--sidebar-fg); }
.proj.add .plus { width: 8px; text-align: center; font-size: 16px; line-height: 1; flex: 0 0 8px; }

.tcard[data-act], .hrow[data-act], .g-label[data-act] { cursor: pointer; }
.tcard[data-act]:hover { border-color: var(--accent); }
.tcard[data-act]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hrow[data-act]:hover, .g-label[data-act]:hover { color: var(--accent); }

/* ---------- Dialog ---------- */
#editor { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); color: var(--ink);
          padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: var(--shadow-pop); }
#editor::backdrop { background: var(--backdrop); }
#editor form { padding: 24px 26px 22px; }
#editor h3 { font-size: 22px; letter-spacing: -0.025em; margin-bottom: 18px; }
.frow { display: block; margin-bottom: 14px; }
.flab { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.fhint { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; }
#editor input, #editor select, #editor textarea {
  font: inherit; font-size: 14px; width: 100%; padding: 9px 12px; border-radius: var(--r-field);
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink);
}
#editor textarea { resize: vertical; line-height: 1.45; }
#editor input[type="number"] { text-align: left; }
#editor input:focus, #editor select:focus, #editor textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

/* ---------- Claude udfører opgaver ---------- */
.cbox { margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--border); }
.cb-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cb-head > .i { color: var(--accent); }
.cb-head b { font-weight: 600; font-size: 14px; }
.cb-head .tag { margin-left: auto; }
.cbox .hint { margin-bottom: 10px; }
.cb-wait { font-size: 13.5px; color: var(--ink-2); margin-bottom: 12px; }
.cb-err { font-size: 13.5px; color: var(--danger-ink); margin-bottom: 12px; }
.cb-result { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.5; background: var(--surface-2);
             border: 1px solid var(--border); border-radius: var(--r-field); padding: 12px 14px; max-height: 320px; overflow-y: auto; margin-bottom: 12px; }
.cb-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
a.btn { text-decoration: none; }
.kp-steps a, .cbox .hint a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 2px; }
.cchip { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 2px 9px; border-radius: 999px;
         font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; border: 1px solid var(--accent); color: var(--accent); }
.cchip .i { width: 12px; height: 12px; vertical-align: 0; }
.cchip.ready { background: var(--accent); color: var(--on-accent); }
.cchip.bad { border-color: var(--st-blokeret); color: var(--danger-ink); }
.prompt { white-space: pre-wrap; font: 12.5px/1.5 var(--mono); background: var(--surface-2); border: 1px solid var(--border);
          border-radius: var(--r-field); padding: 12px 14px; margin: 8px 0 10px; color: var(--ink); }
.dbtns { display: flex; gap: 9px; align-items: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }

/* ---------- Statusbesked ---------- */
.flash { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px); z-index: 60;
         background: var(--sidebar-bg); color: var(--sidebar-fg); font-size: 13.5px; font-weight: 500;
         padding: 11px 20px; border-radius: 999px; box-shadow: var(--shadow-pop); border: 1px solid var(--sidebar-line);
         opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: min(520px, 92vw); text-align: center; }
.flash.show { opacity: 1; transform: translate(-50%, 0); }
.flash.bad { background: var(--st-blokeret); border-color: var(--st-blokeret); color: var(--on-danger); }

@media (max-width: 560px) { .fgrid { grid-template-columns: 1fr; } }

/* ---------- Print ---------- */
@media print {
  :root { --bg: #fff; --surface: #fff; }
  .sidebar, .jump, .theme-btn, .btn, .icon-btn, .flash, #editor, .gctl { display: none !important; }
  .main { padding: 0; }
  .main-inner { border: 0; padding: 0; min-height: 0; max-width: none; }
  .phead, footer { margin-inline: 0; padding-inline: 0; }
  .phead::before, .phead::after, footer::before, footer::after { display: none; }
  .gantt-scroll { overflow: visible; border: 0; box-shadow: none; }
  .card { box-shadow: none; break-inside: avoid; }
  details.hist { break-inside: avoid; }
  * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  @page { size: landscape; margin: 12mm; }
}

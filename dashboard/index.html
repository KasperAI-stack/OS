  };
  // Assistentens tegn er Otto, ikke en gnist
  var OTTO_MARK = '<img class="otto-mark" src="otto/hoved.png" alt="" aria-hidden="true">';
  function icon(n) {
    return '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[n] + "</svg>";
  }

  var NOW = new Date();
  var TODAY_MI = NOW.getFullYear() * 12 + NOW.getMonth();
  var TODAY_ISO = NOW.getFullYear() + "-" + String(NOW.getMonth() + 1).padStart(2, "0") + "-" + String(NOW.getDate()).padStart(2, "0");

  var STATUS = {
    "ikke startet": { key: "ikke-startet", label: "Ikke startet", css: "st-ikke-startet" },
    "i gang":       { key: "i-gang",       label: "I gang",       css: "st-i-gang" },
    "blokeret":     { key: "blokeret",     label: "Blokeret",     css: "st-blokeret" },
    "færdig":       { key: "faerdig",      label: "Færdig",       css: "st-faerdig" },
    "faerdig":      { key: "faerdig",      label: "Færdig",       css: "st-faerdig" },
    "droppet":      { key: "droppet",      label: "Droppet",      css: "st-droppet" }
  };

  function stat(t) {
    return STATUS[String(t.status || "").toLowerCase().trim()] ||
           { key: "ukendt", label: String(t.status || "(tom)"), css: "st-ukendt" };
  }
  function span(t) {
    // start/end falder tilbage til sprint-måneden, hvis de mangler
    var s = isMonth(t.start) ? t.start : (isMonth(t.sprint) ? t.sprint : null);
    var e = isMonth(t.end) ? t.end : s;
    if (!s) return null;
    var a = mi(s), b = mi(e);
    return { a: a, b: Math.max(a, b) };

  // Epics er valgfri. Nøglen (fx "E2") vises som mærke, det fulde navn som tooltip.
  function epicName(t) {

  }
  function overdue(t) {

    return isDate(t.due) && t.due < TODAY_ISO && k !== "faerdig" && k !== "droppet";

  /* ====================== Validering ======================
     Flade data fejler i stilhed — en tastefejl giver en usynlig bjælke,
     ikke en fejlmeddelelse. Derfor fanges problemerne her og vises. */

  // Returnerer rå tekst — escaping sker ét sted, ved udskrivningen i render().
  function validate() {
    var problems = [], seen = {}, i, t;
    var projIds = {}, sprintKeys = {};

    for (i = 0; i < DATA.projects.length; i++) projIds[DATA.projects[i].id] = true;
    for (i = 0; i < DATA.sprints.length; i++) sprintKeys[DATA.sprints[i].project + "|" + DATA.sprints[i].month] = true;

    for (i = 0; i < DATA.sprints.length; i++) {
      if (!projIds[DATA.sprints[i].project]) problems.push("Sprint " + DATA.sprints[i].month + " peger på et ukendt projekt: " + DATA.sprints[i].project);
      if (!isMonth(DATA.sprints[i].month)) problems.push("Sprint i " + DATA.sprints[i].project + " har ugyldig måned: " + DATA.sprints[i].month);
    }

    for (i = 0; i < DATA.tasks.length; i++) {
      t = DATA.tasks[i];
      var id = t.id || "(uden id)";
      if (!t.id) problems.push("En opgave mangler id: " + t.title);
      else if (seen[t.id]) problems.push("Dublet-id: " + id + " findes mere end én gang");
      seen[t.id] = true;

      if (stat(t).key === "ukendt") problems.push(id + ": ukendt status „" + String(t.status == null ? "" : t.status) + "“ — vises i gult");
      if (!projIds[t.project]) problems.push(id + ": ukendt projekt " + t.project + " — opgaven er usynlig overalt");
      if (t.sprint && !sprintKeys[t.project + "|" + t.sprint]) problems.push(id + ": sprint " + t.sprint + " findes ikke for projektet — vises i tidslinjen, men i ingen sprint");
      if (t.start && !isMonth(t.start)) problems.push(id + ": start er ikke ÅÅÅÅ-MM (" + t.start + ")");
      if (t.end && !isMonth(t.end)) problems.push(id + ": end er ikke ÅÅÅÅ-MM (" + t.end + ")");
      if (t.due && !isDate(t.due)) problems.push(id + ": due er ikke ÅÅÅÅ-MM-DD (" + t.due + ")");
      if (isMonth(t.start) && isMonth(t.end) && mi(t.end) < mi(t.start)) problems.push(id + ": end (" + t.end + ") ligger før start (" + t.start + ")");
      if (!span(t)) problems.push(id + ": hverken start eller sprint er en gyldig måned — kan ikke placeres på tidslinjen");
      if (t.remaining != null && t.remaining !== "" && !(parseFloat(t.remaining) >= 0)) problems.push(id + ": remaining skal være et tal ≥ 0 (" + t.remaining + ")");
      if (t.priority && FC.PRIORITIES.indexOf(t.priority) < 0) problems.push(id + ": ukendt prioritet „" + t.priority + "“ — brug høj, normal eller lav");
    }
    return problems;
  }

  /* ====================== Sidebar ====================== */

  function healthDot(tasks) {
    var i, k, anyOpen = false, anyGoing = false;
    for (i = 0; i < tasks.length; i++) {
      k = stat(tasks[i]).key;
      if (k === "blokeret" || overdue(tasks[i])) return "var(--st-blokeret)";
      if (k === "i-gang") anyGoing = true;
      if (k !== "faerdig" && k !== "droppet") anyOpen = true;
    }
    if (anyGoing) return "var(--st-i-gang)";
    if (!anyOpen && tasks.length) return "var(--st-faerdig)";
    return "var(--st-ikke-startet)";
  }

  // Projektfarver (M17): hvert projekt har en farve. Valgt i projektdialogen (p.color), ellers fast efter rækkefølge.
  var PCOLORS = ["violet", "rose", "blue", "teal", "amber", "green", "slate", "berry"];
  var PCOLOR_NAMES = { violet: "Violet", rose: "Rosé", blue: "Blå", teal: "Teal", amber: "Rav", green: "Grøn", slate: "Skifer", berry: "Bær" };
  function projColor(p) {
    if (!p || p.kind === "adhoc") return "slate";
    if (p.kind === "drift") return "ink";
    if (PCOLORS.indexOf(p.color) >= 0) return p.color;
    var i = DATA.projects.filter(isRealProject).indexOf(p);
    return PCOLORS[(i < 0 ? 0 : i) % PCOLORS.length];
  }
  function projName(p) { return !p ? "—" : (p.kind === "adhoc" ? "Uden projekt" : p.name); }
  function projBadge(p, size) {
    return '<span class="pbadge pc-' + projColor(p) + (size ? " " + size : "") + '" aria-hidden="true">' +
      esc(projName(p).trim().charAt(0).toUpperCase() || "?") + "</span>";
  }
  function projTag(p) { return '<span class="ptag">' + projBadge(p, "sm") + "<span>" + esc(projName(p)) + "</span></span>"; }
  function statusPill(t, label) {
    var st = stat(t);
    return '<span class="spill s-' + st.key + '">' + esc(label || st.label) + "</span>";
  }
  // En lille ring for en andel (0–1)
  function ring(frac, crit, label) {
    var r = 21, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac || 0));
    return '<svg class="ring" viewBox="0 0 52 52" role="img" aria-label="' + esc(label || "") + '"><circle class="rt" cx="26" cy="26" r="' + r + '"></circle>' +
      (f > 0 ? '<circle class="rv' + (crit ? " crit" : "") + '" cx="26" cy="26" r="' + r + '" stroke-dasharray="' + (c * f).toFixed(1) + " " + c.toFixed(1) + '"></circle>' : "") + "</svg>";
  }

  function tasksOf(pid) {
    return DATA.tasks.filter(function (t) { return t.project === pid; });
  }

  // Hovedpunkt: ikon (og evt. en sundhedsprik på ikonet), navn og tal. Navnet står også som title,
  // så det kan ses, når sidebaren er foldet ind.
  function nico(name, extra) { return '<span class="nico" aria-hidden="true">' + (name === "otto" ? OTTO_MARK : icon(name)) + (extra || "") + "</span>"; }
  function navBtn(attrs, current, lead, label, count) {
    return '<button class="proj" ' + attrs + ' title="' + esc(label) + '" aria-current="' + !!current + '" type="button">' + lead +
      '<span class="pname">' + label + "</span>" + (count || "") + "</button>";

  function count(n, title, alert) {
    return n ? '<span class="pcount num' + (alert ? " alert" : "") + '"' + (title ? ' title="' + esc(title) + '"' : "") + ">" + n + "</span>" : "";
  }
  var NODOT = '<span class="nodot" aria-hidden="true"></span>';
  function redAlertCount() {
    if (!FC || !DATA) return 0;
    return prognosis().active.filter(function (a) { return a.level === 3; }).length;
  }

  function renderSidebar(active) {
    var m = capacity();
    var tone = m.free < -1 ? "crit" : (m.free < 2 ? "warn" : "good");
    var red = redAlertCount(), nInbox = inboxCount();
    document.getElementById("navtop").innerHTML =
      navBtn('data-act="kapacitet"', active === "kapacitet",
             nico("gauge", '<span class="dot ' + tone + '" title="' + (tone === "crit" ? "Overbooket" : tone === "warn" ? "På kanten" : "Plads tilbage") + '"></span>'),
             "Kapacitet", count(red, plural(red, "rød alarm", "røde alarmer"), true)) +
      navBtn('data-act="gohash" data-h="kalender"', active === "kalender", nico("cal"), "Kalender") +
      navBtn('data-act="otto"', active === "otto", nico("otto"), "Assistenten") +
      navBtn('data-act="indbakke"', active === "indbakke", nico("inbox"), "Indbakke", count(nInbox, plural(nInbox, "nyt forslag", "nye forslag")));

    // Tre enheder: Opgaver (alle), Projekter (de store ting) og Rutiner (det, der kommer igen).
    // Drift og Ad hoc er ikke projekter: Ad hoc er "uden projekt", Drift hører til Rutiner.
    var tasksHtml = TASKVIEWS.map(function (v) {
      var n = DATA.tasks.filter(function (t) { return isLive(t) && v.test(t); }).length;

      return '<button class="proj sub" data-act="tasksview" data-v="' + v.id + '" aria-current="' + (active === key) + '" type="button">' +

      projHtml += '<button class="proj sub" data-act="proj" data-id="' + esc(p.id) + '" aria-current="' + (p.id === active) + '" type="button">' +
                projBadge(p, "sm") + (healthDot(ts) === "var(--st-blokeret)" ? '<span class="pwarn" title="Noget er blokeret eller over deadline"></span>' : "") +
                '<span class="pname">' + esc(p.name) + "</span>" + count(open, plural(open, "åben opgave", "åbne opgaver")) + "</button>";
    });
    projHtml += '<button class="proj sub add" data-act="newproj" type="button"><span class="plus" aria-hidden="true">+</span>' +
            '<span class="pname">Nyt projekt</span></button>';

    var routines = DATA.rutiner || [];
    var rutHtml = routines.map(function (r) {
      return '<button class="proj sub" data-act="routine" data-id="' + esc(r.id) + '" type="button" title="' + esc(routineWhen(r)) + '">' + NODOT +
        '<span class="pname">' + esc(r.name) + "</span>" + (r.active === false ? '<span class="paused">pause</span>' : "") + "</button>";
    }).join("");
    var drift = DATA.projects.filter(function (p) { return p.kind === "drift"; })[0];
    var driftOpen = drift ? tasksOf(drift.id).filter(isLive).length : 0;
    if (drift && driftOpen) {
      rutHtml += '<button class="proj sub" data-act="proj" data-id="' + esc(drift.id) + '" aria-current="' + (drift.id === active) + '" type="button">' + NODOT +
        '<span class="pname">' + esc(drift.name) + "</span>" + count(driftOpen, plural(driftOpen, "fast opgave", "faste opgaver")) + "</button>";
    }
    rutHtml += '<button class="proj sub add" data-act="newroutine" type="button"><span class="plus" aria-hidden="true">+</span><span class="pname">Ny rutine</span></button>';

    var liveN = DATA.tasks.filter(isLive).length;
    document.getElementById("projlist").innerHTML =
      sideSection("tasks", "Opgaver", liveN, tasksHtml, active, "list") +
      sideSection("projekter", "Projekter", DATA.projects.filter(isRealProject).length, projHtml, active, "folder") +
      sideSection("rutiner", "Rutiner", routines.filter(function (r) { return r.active !== false; }).length, rutHtml, active, "repeat");
    // Navigation (Historik, Claude-adgang, Google) for sig; værktøjer og Log ud for sig
    document.getElementById("sidefoot").innerHTML =
      '<p class="sf-status">' + saveStatus(true) + "</p>" +
      '<div class="sf-acts">' +
        '<a class="sf-link" href="#versioner">Historik</a>' +
        '<a class="sf-link" href="#claude">Claude-adgang</a>' +
        '<button class="sf-link" data-act="settings" data-section="forbindelser" type="button">' +
          (calConnected() ? "Google forbundet" : "Forbind Google") + "</button>" +
      "</div>" +
      '<div class="sf-tools">' +
        '<button class="sf-tool" data-act="theme" id="themebtn" type="button" title="Skift tema">' + themeLabel() + "</button>" +
        '<button class="sf-tool icon" data-act="settings" id="gearbtn" type="button" title="Indstillinger" aria-label="Indstillinger" aria-haspopup="dialog">' + icon("gear") + "</button>" +
        '<button class="sf-tool icon sf-out" data-act="logout" type="button" title="Log ud" aria-label="Log ud">' + icon("logout") + "</button>" +
      "</div>";
    renderTabbar(active, red);
  }

  // Under 1024 px: fire faner og "Mere", som åbner skuffen med hele navigationen
  var TABS = [
    { h: "kapacitet", label: "Kapacitet", icon: "gauge" },
    { h: "tasks",     label: "Opgaver",   icon: "list" },
    { h: "kalender",  label: "Kalender",  icon: "cal" },
    { h: "otto",      label: "Assistent", otto: true }
  ];
  function renderTabbar(active, red) {
    var bar = document.getElementById("tabbar");
    if (!bar) return;
    var sec = active === "kapacitet" || active === "kalender" || active === "otto" ? active : (sectionOf(active) === "tasks" ? "tasks" : "");
    bar.innerHTML = TABS.map(function (t) {
      return '<a class="tab" href="#' + t.h + '" aria-current="' + (sec === t.h) + '">' + (t.otto ? OTTO_MARK : icon(t.icon)) + "<span>" + t.label + "</span>" +
        (t.h === "kapacitet" && red ? '<span class="tdot"></span><span class="sr-only">, ' + plural(red, "rød alarm", "røde alarmer") + "</span>" : "") + "</a>";
    }).join("") +
      '<button class="tab" data-act="navopen" type="button" aria-controls="sidebar" aria-expanded="false" aria-current="' + (!sec && !!active) + '">' +
        icon("menu") + "<span>Mere</span></button>";
  }
  // Sidebaren kan foldes ind til en ikonbjælke (kun fra 1024 px). Valget huskes i browseren.
  function setNavMini(on) {
    var app = document.getElementById("app");
    app.classList.toggle("nav-mini", on);
    var b = document.querySelector(".side-toggle");
    if (b) { b.setAttribute("aria-pressed", String(on)); b.setAttribute("aria-label", on ? "Fold menuen ud" : "Fold menuen ind"); b.title = b.getAttribute("aria-label"); }
    try { localStorage.setItem("mos-navmini", on ? "1" : ""); } catch (e) {}
  }
  try { if (localStorage.getItem("mos-navmini") === "1") document.getElementById("app").classList.add("nav-mini"); } catch (e) {}
  setTimeout(function () { setNavMini(document.getElementById("app").classList.contains("nav-mini")); }, 0);

  function navOpen(open) {
    var shell = document.getElementById("app");
    if (!shell) return;
    var was = shell.classList.contains("nav-open");
    shell.classList.toggle("nav-open", open);
    var b = document.querySelector('.tab[data-act="navopen"]');
    if (b) b.setAttribute("aria-expanded", String(open));
    if (open) { var f = document.querySelector("#sidebar .proj"); if (f) f.focus(); }
    else if (was && b && document.activeElement && document.getElementById("sidebar").contains(document.activeElement)) b.focus();
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("app").classList.contains("nav-open")) navOpen(false);
  });

  /* ====================== Sprintvisning ====================== */

  function pickSprint(sprints) {
    // aktuel måned → ellers næste fremtidige → ellers seneste forgangne
    var cur = null, next = null, past = null, i, m;
    for (i = 0; i < sprints.length; i++) {
      if (!isMonth(sprints[i].month)) continue;
      m = mi(sprints[i].month);
      if (m === TODAY_MI) cur = sprints[i];
      else if (m > TODAY_MI) { if (!next || m < mi(next.month)) next = sprints[i]; }
      else { if (!past || m > mi(past.month)) past = sprints[i]; }
    }
    if (cur) return { s: cur, tag: "Aktuel", now: true };
    if (next) return { s: next, tag: "Kommende", now: false };
    if (past) return { s: past, tag: "Seneste", now: false };
    return null;
  }

  function taskCard(t) {
    var st = stat(t), od = overdue(t);
    var meta = [];
    if (t.epic) meta.push('<span class="ep" title="' + esc(epicName(t)) + '">' + esc(t.epic) + "</span>");
    if (t.owner) meta.push(esc(t.owner));
    if (isDate(t.due)) {
      // Prognosen: når opgaven ikke deadline, markeres den som en overskredet
      var f = taskForecast(t), risk = !od && f && f.status === "risiko";
      var tip = f && f.finish && f.status !== "ok" ? ' title="Prognose: færdig ca. ' + esc(fmtDate(f.finish)) + '"'
              : (risk ? ' title="Prognose: når ikke deadline"' : "");
      meta.push('<span class="due' + (od || risk ? " over" : "") + '"' + tip + ">" + (od || risk ? icon("alert") : "") + fmtDate(t.due) + (risk ? " · i risiko" : "") + "</span>");
    }
    if (num(t.hours) > 0) meta.push('<span class="th num">' + fmt(num(t.hours)) + " t/uge</span>");
    return '<div class="tcard ' + st.css + '" data-act="task" data-id="' + esc(t.id) + '" tabindex="0" role="button">' +
             '<div class="tt">' + esc(t.title) + "</div>" +
             (meta.length ? '<div class="tm">' + meta.join("") + "</div>" : "") +
             (t.note ? '<div class="tnote" title="' + esc(t.note) + '">' + esc(t.note) + "</div>" : "") +
             studioChip(t) +
           "</div>";
  }

  function renderSprint(p) {
    var sprints = DATA.sprints.filter(function (s) { return s.project === p.id; });
    var pick = pickSprint(sprints);

    if (!pick) {
      return '<section id="sprint" class="card"><div class="card-hd"><h2>Sprint</h2></div>' +
             '<div class="empty"><p>Ingen sprints oprettet for ' + esc(p.name) + " endnu.</p>" +
             '<p><button class="btn primary" data-act="newsprint" type="button">Opret den første sprint</button></p></div></section>';
    }

    var s = pick.s;
    var ts = tasksOf(p.id).filter(function (t) { return t.sprint === s.month; });
    var counted = ts.filter(function (t) { return stat(t).key !== "droppet"; });
    var done = counted.filter(function (t) { return stat(t).key === "faerdig"; }).length;
    var pct = counted.length ? Math.round(done / counted.length * 100) : 0;
    var blocked = ts.filter(function (t) { return stat(t).key === "blokeret"; }).length;
    var od = ts.filter(overdue).length;

    var head = '<div class="sprint-head"><h2>Sprint ' + miLabel(mi(s.month), true) + "</h2>" +
               '<span class="tag' + (pick.now ? " now" : "") + '">' + pick.tag + "</span>" +
               '<button class="icon-btn" data-act="editsprint" data-month="' + esc(s.month) + '" type="button" title="Rediger sprint" aria-label="Rediger sprint">' + icon("pencil") + '</button>' +
               '<span class="spacer"></span>' +
               (counted.length ? '<span class="sprint-prog">' + ring(done / counted.length, false, pct + " % færdig") +
                 '<span><b class="num">' + done + " af " + counted.length + "</b> færdige" +
                 (pick.now ? '<br><span class="num">' + (daysIn(NOW.getFullYear(), NOW.getMonth()) - NOW.getDate()) + " dage tilbage</span>" : "") + "</span></span>" : "") +
               "</div>";

    var goal = s.goal
      ? '<p class="goal"><span class="goal-k">Mål</span>' + esc(s.goal) + "</p>"
      : '<p class="goal empty">Intet sprintmål skrevet endnu.</p>';

    var meter = "";

    var body;
    if (!ts.length) {
      body = '<div class="col-empty">Ingen opgaver lagt i sprinten endnu. ' +
             '<button class="btn" data-act="newtask" data-month="' + esc(s.month) + '" type="button">+ Tilføj den første</button></div>';
    } else {
      body = '<div class="kanban">';
      BOARD.forEach(function (k) {
        var col = ts.filter(function (t) { return stat(t).key === k; });
        body += '<div><div class="col-head"><span class="spill s-' + k + '">' + LABEL[k] + '</span><span class="cnt num">' + col.length + "</span></div>" +
                (col.length ? col.map(taskCard).join("") : '<div class="col-empty">—</div>') + "</div>";
      });
      body += "</div>";
    }

    return '<section id="sprint" class="card">' + head + goal + meter + body +
      '<p class="mt-4"><button class="sf-inline" data-act="newsprint" type="button">+ Ny sprint</button></p></section>';
  }

  /* ====================== Historik ====================== */

  function renderHistory(p) {
    var pick = pickSprint(DATA.sprints.filter(function (s) { return s.project === p.id; }));
    var shown = pick ? pick.s.month : null;
    var rest = DATA.sprints
      .filter(function (s) { return s.project === p.id && s.month !== shown && isMonth(s.month); })
      .sort(function (a, b) { return mi(b.month) - mi(a.month); });

    if (!rest.length) return "";

    var html = '<section id="historik" class="card"><div class="card-hd"><h2>Øvrige sprints</h2></div>';
    rest.forEach(function (s) {
      var ts = tasksOf(p.id).filter(function (t) { return t.sprint === s.month; });
      var counted = ts.filter(function (t) { return stat(t).key !== "droppet"; });
      var done = counted.filter(function (t) { return stat(t).key === "faerdig"; }).length;
      html += '<details class="hist"><summary><b>' + miLabel(mi(s.month), true) + "</b>" +
              '<span class="num">' + done + "/" + counted.length + " færdige</span>" +
              (s.goal ? '<span class="g">„' + esc(s.goal) + "“</span>" : "") + "</summary>" +
              '<div class="hist-body">' +
              (ts.length ? ts.map(function (t) {
                var st = stat(t);
                return '<div class="hrow" data-act="task" data-id="' + esc(t.id) + '" tabindex="0" role="button"><span class="dot" style="background:var(--' + st.css + ')"></span>' +
                       "<span>" + esc(t.title) + "</span>" +
                       '<span class="hd">' + st.label + (isDate(t.due) ? " · " + fmtDate(t.due) : "") + "</span></div>";
              }).join("") : '<div class="col-empty">Ingen opgaver i denne sprint.</div>') +
              "</div></details>";
    });
    return html + "</section>";
  }

  /* ====================== Gantt ====================== */

  /* ----- Visning af tidslinjen -----
     Filter, gruppering og sortering er visningsvalg, ikke data. Derfor lever de
     i browseren og aldrig i dine data — ellers ville et filterskift gøre siden
     "ugemt" og lægge dine visningsvaner ind i indholdet. */

  var VIEWOPTS = { group: "none", show: "all", sort: "start", epic: "" };
  try {
    var savedView = JSON.parse(localStorage.getItem("mos-view") || "{}");
    Object.keys(VIEWOPTS).forEach(function (k) {
      if (typeof savedView[k] === "string") VIEWOPTS[k] = savedView[k];
    });
  } catch (e) {}
  function saveView() { try { localStorage.setItem("mos-view", JSON.stringify(VIEWOPTS)); } catch (e) {} }

  function groupKey(t) {
    var g = VIEWOPTS.group;
    if (g === "epic")   return t.epic || "␀";
    if (g === "status") return stat(t).key;
    if (g === "owner")  return t.owner || "␀";
    return "";
  }
  function groupName(k) {
    var g = VIEWOPTS.group;
    if (k === "␀") return g === "epic" ? "Uden epic" : "Uden ejer";
    if (g === "epic")   return (DATA.epics && DATA.epics[k]) ? k + " — " + DATA.epics[k] : k;
    if (g === "status") return LABEL[k] || k;
    return k;
  }
  function groupOrder(keys) {
    var g = VIEWOPTS.group, rank = {};
    if (g === "status") BOARD.concat(["droppet", "ukendt"]).forEach(function (k, i) { rank[k] = i; });
    else if (g === "epic") Object.keys(DATA.epics || {}).forEach(function (k, i) { rank[k] = i; });
    return keys.sort(function (a, b) {
      if (a === "␀") return 1;              // "uden …" altid nederst
      if (b === "␀") return -1;
      var ra = rank[a], rb = rank[b];
      if (ra != null && rb != null) return ra - rb;
      if (ra != null) return -1;
      if (rb != null) return 1;
      return String(a).localeCompare(String(b), "da");
    });
  }

  function ganttControls(epics, shown, total) {
    function sel(key, list) {
      return '<select id="view-' + key + '" data-view="' + key + '" aria-label="' + ({ group: "Gruppering", show: "Vis", sort: "Sortering", epic: "Epic" })[key] + '">' + list.map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (VIEWOPTS[key] === o[0] ? " selected" : "") + ">" + esc(o[1]) + "</option>";
      }).join("") + "</select>";
    }
    var html = '<div class="gctl">' +
      sel("group", [["none", "Ingen gruppering"], ["epic", "Gruppér: epic"], ["status", "Gruppér: status"], ["owner", "Gruppér: ejer"]]) +
      sel("show", [["all", "Alle opgaver"], ["open", "Kun åbne"], ["due", "Kun med deadline"], ["soon", "Forfalder inden 3 mdr."]]) +
      sel("sort", [["start", "Sortér: tidslinje"], ["due", "Sortér: deadline"], ["title", "Sortér: titel"]]);
    if (epics.length) {
      html += sel("epic", [["", "Alle epics"]].concat(epics.map(function (e) {
        return [e, (DATA.epics && DATA.epics[e]) ? e + " — " + DATA.epics[e] : e];
      })));
    }
    html += '<span class="gcount num">' + (shown < total ? shown + " af " + total : String(total)) + " opgaver</span>";
    if (shown < total || VIEWOPTS.group !== "none" || VIEWOPTS.sort !== "start") {
      html += '<button class="btn" data-act="viewreset" type="button">Nulstil visning</button>';
    }
    return html + "</div>";
  }

  function renderGantt(p) {
    var all = tasksOf(p.id).filter(function (t) { return span(t) !== null; });

    if (!all.length) {
      // repeat(0, …) er ugyldig CSS og ville vælte hele siden — så gitteret
      // bygges slet ikke, når der intet er at tegne.
      return '<section id="tidslinje" class="card"><div class="card-hd"><h2>Tidslinje</h2></div>' +
             '<div class="empty"><p>Ingen opgaver at tegne for ' + esc(p.name) + ".</p>" +
             '<p><button class="btn primary" data-act="newtask" type="button">Tilføj den første opgave</button></p></div></section>';
    }

    var epics = [];
    all.forEach(function (t) { if (t.epic && epics.indexOf(t.epic) < 0) epics.push(t.epic); });
    // Et epic-filter fra et andet projekt må ikke tømme denne tidslinje
    var epicFilter = epics.indexOf(VIEWOPTS.epic) >= 0 ? VIEWOPTS.epic : "";
    var o = VIEWOPTS;

    var ts = all.filter(function (t) {
      if (epicFilter && t.epic !== epicFilter) return false;
      if (o.show === "open") return isLive(t);
      if (o.show === "due") return isDate(t.due);
      if (o.show === "soon") return isDate(t.due) && isLive(t) && mi(t.due.slice(0, 7)) <= TODAY_MI + 3;
      return true;
    }).sort(function (a, b) {
      if (o.sort === "due") {
        var A = isDate(a.due) ? a.due : "9999-99-99", B = isDate(b.due) ? b.due : "9999-99-99";
        if (A !== B) return A < B ? -1 : 1;
      } else if (o.sort === "title") {
        return String(a.title).localeCompare(String(b.title), "da");
      }
      var sa = span(a), sb = span(b);
      return (sa.a - sb.a) || (sa.b - sb.b) || String(a.title).localeCompare(String(b.title), "da");
    });

    var head = '<section id="tidslinje" class="card"><div class="card-hd"><h2>Tidslinje</h2></div>' +
               ganttControls(epics, ts.length, all.length);

    if (!ts.length) {
      return head + '<div class="empty"><p>Ingen opgaver matcher filteret.</p>' +
             '<p><button class="btn" data-act="viewreset" type="button">Nulstil visning</button></p></div></section>';
    }

    var groups;
    if (o.group === "none") {
      groups = [{ name: "", list: ts }];
    } else {
      var map = {};
      ts.forEach(function (t) {
        var k = groupKey(t);
        if (!map[k]) map[k] = [];
        map[k].push(t);
      });
      groups = groupOrder(Object.keys(map)).map(function (k) {
        return { name: groupName(k), list: map[k] };
      });
    }

    // Vinduet følger det filtrerede — filtrerer man til én epic, zoomer
    // tidslinjen ind på netop dens spænd.
    var lo = Infinity, hi = -Infinity;
    ts.forEach(function (t) { var s = span(t); if (s.a < lo) lo = s.a; if (s.b > hi) hi = s.b; });
    lo = Math.min(lo, TODAY_MI - 1);
    hi = Math.max(hi, TODAY_MI + 5);
    var cols = hi - lo + 1;

    // Sidste kolonne er fleksibel, så stribningen fylder kortet ud på brede
    // skærme. Den klapper sammen til 0, når månederne fylder mere end bredden.
    var html = '<div class="gantt" style="grid-template-columns: var(--gantt-label) repeat(' + cols + ', var(--gantt-col)) minmax(0, 1fr);">';

    // Header
    html += '<div class="g-corner g-head" style="grid-row:1;grid-column:1">Opgave</div>';
    for (var c = 0; c < cols; c++) {
      var idx = lo + c, m = idx % 12, y = Math.floor(idx / 12);
      html += '<div class="g-cell g-head' + (m === 0 ? " year" : "") + '" style="grid-row:1;grid-column:' + (c + 2) + '">' +
              MONTH_SHORT[m] + (m === 0 ? '<span class="yr num">' + y + "</span>" : "") + "</div>";
    }
    html += '<div class="g-cell g-head" style="grid-row:1;grid-column:' + (cols + 2) + '"></div>';

    // Rækker. Gruppeoverskrifter får deres egen række og tæller med i
    // rækkenummereringen; stribningen følger opgaverne, ikke rækkerne.
    var row = 1, alt = 0;
    groups.forEach(function (g) {
      if (g.name) {
        row++;
        html += '<div class="g-group" style="grid-row:' + row + ';grid-column:1 / -1">' +
                '<span class="gg">' + esc(g.name) + ' <b class="num">' + g.list.length + "</b></span></div>";
      }
      g.list.forEach(function (t) {
        row++;
        var s = span(t), st = stat(t), stripe = (alt++ % 2) ? " alt" : "";
        var title = (t.epic ? epicName(t) + "\n" : "") + t.title +
                    (t.note ? " — " + t.note : "") + (isDate(t.due) ? " (deadline " + fmtDate(t.due) + ")" : "");

        html += '<div class="g-lane' + stripe + '" style="grid-row:' + row + ';grid-column:2 / -1"></div>';
        html += '<div class="g-label" data-act="task" data-id="' + esc(t.id) + '" tabindex="0" role="button" style="grid-row:' + row + ';grid-column:1" title="' + esc(title) + '">' +
                '<span class="dot" style="background:var(--' + st.css + ')"></span>' +
                (t.epic && VIEWOPTS.group !== "epic" ? '<span class="ep">' + esc(t.epic) + "</span>" : "") +
                '<span class="txt">' + esc(t.title) + "</span></div>";

        // Deadline-diamant placeres relativt inde i bjælken, så den følger med ved zoom
        var dia = "";
        if (isDate(t.due)) {
          var dMi = mi(t.due.slice(0, 7));
          var frac = (Number(t.due.slice(8, 10)) - 1) / daysIn(Number(t.due.slice(0, 4)), Number(t.due.slice(5, 7)) - 1);
          var pos = (dMi - s.a + frac) / (s.b - s.a + 1) * 100;
          if (pos >= 0 && pos <= 100) {
            dia = '<span class="g-diamond' + (overdue(t) ? " over" : "") + '" style="left:' + pos.toFixed(2) + '%"></span>';
          }
        }

        html += '<div class="g-bar ' + st.css + '" style="grid-row:' + row + ';grid-column:' + (s.a - lo + 2) + " / " + (s.b - lo + 3) + '" title="' + esc(title) + '">' + dia + "</div>";
      });
    });

    // I dag-linjen. Fast kolonnebredde gør positionen beregnelig i ren CSS.
    if (TODAY_MI >= lo && TODAY_MI <= hi) {
      var f = (NOW.getDate() - 1) / daysIn(NOW.getFullYear(), NOW.getMonth());
      html += '<div class="g-today" style="left: calc(var(--gantt-label) + ' + (TODAY_MI - lo + f).toFixed(3) + ' * var(--gantt-col))"></div>';
    }

    html += "</div>";

    var legend = '<div class="legend">' + BOARD.concat(["droppet"]).map(function (k) {
      return '<span><i class="g-bar ' + (k === "droppet" ? "st-droppet" : "st-" + k) + '"></i>' + LABEL[k] + "</span>";
    }).join("") + '<span><i class="diamond"></i>Deadline</span></div>';

    return head + '<div class="gantt-scroll" id="gscroll">' + html + "</div>" + legend + "</section>";
  }

  /* ====================== Skyen ======================
     Alt indhold ligger i skyen bag API'et (server/api.mts).
     DATA_REV er den version, siden hentede. Den sendes med, når der gemmes,
     så to enheder — eller Claude — ikke overskriver hinanden i stilhed: er
     data ændret et andet sted imens, afviser serveren og siger det. */

  var DATA = null;
  var DATA_REV = "";
  var BASE = null;      // det, serveren havde ved DATA_REV — grundlaget for fletning
  var dirty = false;

  /* ----- Fletning -----
     Gemmer et andet sted imens (telefonen, Claude, senere agenten), afviser
     serveren med 409. I stedet for bare at sige det, hentes den nye version, og
     dine ændringer flettes ind pr. projekt, sprint, opgave og uge:
       kun ændret hos dig → din værdi · kun ændret derude → deres
       ændret begge steder i samme felt → konflikt, som du afgør.
     Rækkefølgen følger serverens version; det, du har tilføjet, kommer bagefter. */

  function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  var MERGE_LISTS = {
    projects: { key: function (x) { return x && x.id; },                     label: function (x) { return "Projekt „" + (x.name || x.id) + "“"; } },
    sprints:  { key: function (x) { return x && x.project + "|" + x.month; }, label: function (x) { return "Sprint " + x.month + " (" + x.project + ")"; } },
    tasks:    { key: function (x) { return x && x.id; },                     label: function (x) { return "Opgave „" + (x.title || x.id) + "“"; } },
    uger:     { key: function (x) { return x && x.uge; },                    label: function (x) { return weekLabel(x.uge); } },
    rutiner:  { key: function (x) { return x && x.id; },                     label: function (x) { return "Rutine „" + (x.name || x.id) + "“"; } }
  };
  var MERGE_OBJS = { meta: "Data", kapacitet: "Indstillinger", epics: "Epics" };
  var FIELD_NAMES = { title: "titel", status: "status", hours: "timer", due: "deadline", owner: "ejer", note: "note",
    sprint: "sprint", start: "start", end: "slut", epic: "epic", project: "projekt", name: "navn", tagline: "beskrivelse",
    goal: "mål", kind: "type", contract: "arbejdsuge", meetings: "faste møder", admin: "mail & admin", other: "fravær",
    ceiling: "loft", adhoc: "ad hoc", drift: "drift", projekt: "projekter" };

  function mergeFields(b, l, r, where, conflicts, theirs) {
    b = b || {}; l = l || {}; r = r || {};
    var out = {}, keys = {};
    [b, l, r].forEach(function (o) { Object.keys(o).forEach(function (k) { keys[k] = true; }); });
    Object.keys(keys).forEach(function (k) {
      var bv = b[k], lv = l[k], rv = r[k], v;
      if (same(lv, bv)) v = rv;
      else if (same(rv, bv) || same(lv, rv)) v = lv;
      else {
        conflicts.push({ where: where, field: FIELD_NAMES[k] || k, mine: lv, theirs: rv });
        v = theirs ? rv : lv;
      }
      if (v !== undefined) out[k] = v;
    });
    return out;
  }

  function mergeData(base, local, remote, theirs) {
    var out = clone(remote), conflicts = [];
    Object.keys(MERGE_OBJS).forEach(function (k) {
      out[k] = mergeFields(base[k], local[k], remote[k], MERGE_OBJS[k], conflicts, theirs);
    });
    Object.keys(MERGE_LISTS).forEach(function (name) {
      var spec = MERGE_LISTS[name], idx = function (list) {
        var m = {}; (list || []).forEach(function (x) { m[spec.key(x)] = x; }); return m;
      };
      var B = idx(base[name]), L = idx(local[name]), R = idx(remote[name]), result = [], seen = {};
      (remote[name] || []).forEach(function (r) {
        var k = spec.key(r), b = B[k], l = L[k];
        seen[k] = true;
        if (!b) { result.push(l ? mergeFields({}, l, r, spec.label(r), conflicts, theirs) : r); return; }
        if (!l) {                                   // slettet hos dig
          if (same(r, b)) return;
          conflicts.push({ where: spec.label(r), field: "slettet hos dig, ændret et andet sted", mine: "slettet", theirs: "beholdt" });
          if (theirs) result.push(r);
          return;
        }
        result.push(same(l, b) ? r : (same(r, b) ? l : mergeFields(b, l, r, spec.label(l), conflicts, theirs)));
      });
      (local[name] || []).forEach(function (l) {
        var k = spec.key(l);
        if (seen[k]) return;
        if (!B[k]) { result.push(l); return; }      // nyt hos dig
        if (same(l, B[k])) return;                  // slettet derude, urørt hos dig
        conflicts.push({ where: spec.label(l), field: "slettet et andet sted, ændret hos dig", mine: "beholdt", theirs: "slettet" });
        if (!theirs) result.push(l);
      });
      out[name] = result;
    });
    // Datoen for seneste gem er aldrig en rigtig konflikt
    conflicts = conflicts.filter(function (c) { return !(c.where === "Data" && c.field === "updated"); });
    return { data: out, conflicts: conflicts };
  }

  function showValue(v) {
    if (v === undefined || v === null || v === "") return "(tom)";
    return typeof v === "object" ? JSON.stringify(v) : String(v);
  }

  // Konflikter afgøres samlet: dine værdier eller de nye. Begge versioner findes bagefter i Historik.
  function askConflicts(conflicts, done) {
    var rows = conflicts.slice(0, 12).map(function (c) {
      return "<li><b>" + esc(c.where) + "</b> · " + esc(c.field) + '<br><span class="hint">Din: ' + esc(showValue(c.mine)) +
             " · Den nye: " + esc(showValue(c.theirs)) + "</span></li>";
    }).join("") + (conflicts.length > 12 ? "<li>… og " + (conflicts.length - 12) + " mere</li>" : "");
    if (setDlg.open) setDlg.close();
    dlg.innerHTML = '<form method="dialog"><h3>Ændret begge steder</h3>' +
      '<p class="hint mb-3">Mens du arbejdede, blev data gemt et andet sted. Det meste er flettet sammen, ' +
      "men " + plural(conflicts.length, "felt", "felter") + " er ændret både her og derude. Hvilken version skal gælde?</p>" +
      '<ul class="conflicts">' + rows + "</ul>" +
      '<div class="dbtns"><span class="spacer"></span>' +
        '<button type="button" class="btn" id="c-theirs">Brug de nye</button>' +
        '<button type="button" class="btn primary" id="c-mine">Behold mine</button></div></form>';
    dlg.showModal();
    dlg.querySelector("#c-mine").onclick = function () { dlg.close(); done(false); };
    dlg.querySelector("#c-theirs").onclick = function () { dlg.close(); done(true); };
  }

  // Fælles indgang til API'et. En fejl bliver til en Error med status og den
  // danske besked, serveren har skrevet.
  function api(method, url, body) {
    // X-Tasks: serveren afviser ændringer uden den (mod CSRF, se server/gate.mts)
    var opts = { method: method, headers: { "X-Tasks": "1" }, credentials: "same-origin" };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function (r) {
      return r.text().then(function (t) {
        var j = null;
        try { j = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) {
          var err = new Error((j && j.error) || ("Serveren svarede " + r.status + "."));
          err.status = r.status;
          throw err;
        }
        return j;
      });
    }, function () {
      var err = new Error("Ingen forbindelse til skyen. Tjek nettet, og prøv igen.");
      err.status = 0;
      throw err;
    });
  }

  /* ----- Gem af sig selv -----
     Der er ingen Gem-knap: en ændring gemmes kort efter, du har lavet den (som i monday.com).
     Gemmene står i kø, så to aldrig sendes samtidig, og det, du ændrer, mens et gem er
     undervejs, gemmes lige bagefter. Uden net prøves igen af sig selv og straks, når nettet
     er tilbage; kladden i browseren holder imens på ændringerne. Serveren lægger appens gem
     inden for 10 minutter sammen til én version i Historik (continues, se server/api.mts). */

  var SAVE_DELAY = 800;          // ms efter sidste ændring
  var SAVING = false;
  var SAVE_STATE = "saved";      // saved | offline | retry | error
  var SAVE_ERR = "";
  var SAVE_TIMER = null, RETRY_MS = 0;
  var SAVE_QUEUE = Promise.resolve();
  var OWN_REV = "";              // rev fra appens eget seneste gem: bygger det næste videre på det?

  // Status i stedet for knappen. Gemt = stille; kun problemer har en knap.
  function saveStatus(live) {
    var st = SAVING || (dirty && SAVE_STATE === "saved") ? "saving" : SAVE_STATE;
    var txt = {
      saving: "Gemmer …",
      saved: "Gemt",
      offline: "Offline — gemmes, når nettet er tilbage",
      retry: "Ikke gemt endnu — prøver igen",
      error: "Ikke gemt"
    }[st];
    var ic = st === "saved" ? icon("check") : st === "saving" ? "" : icon(st === "offline" ? "cloudoff" : "alert");
    return '<span class="savestate is-' + st + '" data-savestate' + (live ? ' data-live role="status"' : "") +
      (SAVE_ERR && st !== "saved" && st !== "saving" ? ' title="' + esc(SAVE_ERR) + '"' : "") + ">" +
      ic + '<span class="savestate-t">' + txt + "</span>" +
      (st === "offline" || st === "retry" || st === "error"
        ? '<button class="linkbtn" data-act="save" type="button">' + (st === "error" ? "Prøv igen" : "Prøv nu") + "</button>" : "") +
      "</span>";
  }
  function saveBtn() { return saveStatus(false); }
  function paintSave() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-savestate]"), function (el) {
      el.outerHTML = saveStatus(el.hasAttribute("data-live"));
    });
    document.title = (dirty ? "● " : "") + document.title.replace(/^● /, "");
  }

  // Gem nu (forbi ventetiden). Returnerer et løfte, der er indfriet, når gemmet er klaret eller fejlet.
  function save(merged, message) {
    clearTimeout(SAVE_TIMER); SAVE_TIMER = null;
    return (SAVE_QUEUE = SAVE_QUEUE.then(function () { return doSave(merged, message); }));
  }
  // Gem om lidt — hver ny ændring skubber gemmet, så en stribe ændringer bliver ét gem
  function autoSave(ms) {
    clearTimeout(SAVE_TIMER);
    SAVE_TIMER = setTimeout(function () { SAVE_TIMER = null; if (dirty) save(); }, ms == null ? SAVE_DELAY : ms);
  }

  function doSave(merged, message) {
    if (!DATA) return;
    if (!dirty && !merged && !message) return;   // allerede gemt (fx et gem, der stod i kø)
    DATA.meta.updated = TODAY_ISO;
    var sent = clone(DATA);
    SAVING = true; paintSave();
    return api("PUT", "/api/data", { rev: DATA_REV, data: sent, continues: !!OWN_REV && OWN_REV === DATA_REV && !merged })
      .then(function (res) {
        SAVING = false; SAVE_STATE = "saved"; SAVE_ERR = ""; RETRY_MS = 0;
        DATA_REV = OWN_REV = res.rev;
        BASE = sent;
        // Ændret, mens gemmet var undervejs? Så skal det også gemmes
        dirty = !same(DATA, sent);
        if (dirty) { saveDraft(); autoSave(); } else clearDraft();
        if (merged) route();                       // flettet med andres ændringer: vis dem
        else paintSave();
        if (message) flash(message);
      }, function (e) {
        SAVING = false;
        dirty = true; saveDraft();                 // det, der ikke kom op, ligger i kladden
        if (e.status === 401) {
          SAVE_STATE = "error"; SAVE_ERR = e.message; paintSave();
          showLogin("Du er blevet logget ud. Log ind igen — dine ændringer ligger klar.");
          return;
        }
        // Ændret et andet sted imens: flet og gem igen. Sker det to gange i træk, så sig det.
        if (e.status === 409 && !merged && BASE) return rebase();
        SAVE_ERR = e.message;
        if (e.status === 0 || e.status >= 500) {
          SAVE_STATE = e.status === 0 ? "offline" : "retry";
          RETRY_MS = Math.min(RETRY_MS ? RETRY_MS * 2 : 5000, 60000);
          autoSave(RETRY_MS);
        } else {
          SAVE_STATE = "error";
          flash("Kunne ikke gemme: " + e.message, true, { label: "Prøv igen", fn: function () { save(); } });
        }
        paintSave();
      });
  }

  // Data er gemt et andet sted, mens du arbejdede. Flet sammen uden at afbryde dig: ved et felt,
  // der er ændret begge steder, vinder dit. Den anden version ligger i Historik.
  function rebase() {
    return api("GET", "/api/data").then(function (res) {
      var m = mergeData(BASE, DATA, res.data, false);
      DATA = m.data; BASE = res.data; DATA_REV = res.rev || "";
      saveDraft();
      return doSave(true).then(function () {
        if (!m.conflicts.length || dirty) return;
        flash(plural(m.conflicts.length, "felt var", "felter var") + " ændret både her og et andet sted. " +
              "Dine ændringer er beholdt — den anden version ligger i Historik.", false,
              { label: "Se Historik", fn: function () { location.hash = "versioner"; } });
      });
    }, function (e) {
      SAVE_STATE = e.status === 0 ? "offline" : "retry"; SAVE_ERR = e.message;
      RETRY_MS = Math.min(RETRY_MS ? RETRY_MS * 2 : 5000, 60000);
      autoSave(RETRY_MS); paintSave();
    });
  }

  // Nettet er tilbage: gem med det samme
  window.addEventListener("online", function () { if (dirty && DATA) save(); });
  // Fanen skjules eller lukkes: vent ikke på ventetiden
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden" && dirty && DATA && !SAVING) save();
  });

  // act = { label, fn }: en knap i beskeden, fx "Fortryd" eller "Prøv igen".
  // En succes forsvinder efter 4 s (8 s med en knap). En fejl bliver stående, til den lukkes.
  function flash(msg, bad, act) {
    var el = document.getElementById("flash");
    if (!el) return;
    // En modal dialog ligger øverst og dækker resten af siden, så beskeden
    // skal bo i den åbne dialog for at kunne ses (fx "Kunne ikke gemme" fra Indstillinger).
    var sd = document.getElementById("settings"), ed = document.getElementById("editor");
    var host = sd && sd.open ? sd : (ed && ed.open ? ed : document.body);
    if (el.parentNode !== host) host.appendChild(el);
    var hide = function () { el.className = "flash"; };
    el.setAttribute("aria-live", bad ? "assertive" : "polite");
    el.innerHTML = '<span class="flash-msg">' + esc(msg) + "</span>" +
      (act ? '<button class="flash-act" type="button">' + esc(act.label) + "</button>" : "") +
      (bad || act ? '<button class="flash-x" type="button" aria-label="Luk beskeden">' + icon("x") + "</button>" : "");
    el.className = "flash show" + (bad ? " bad" : "") + (bad || act ? " has-act" : "");
    if (act) el.querySelector(".flash-act").onclick = function () { hide(); act.fn(); };
    var x = el.querySelector(".flash-x");
    if (x) x.onclick = hide;
    clearTimeout(flash._t);
    if (!bad) flash._t = setTimeout(hide, act ? 8000 : 4000);
  }

  // Bekræftelse i appens egen dialog, kun ved det, der ikke kan fortrydes
  var cfDlg = document.getElementById("confirm");
  function askConfirm(o, yes) {
    cfDlg.innerHTML = '<form method="dialog"><h3 id="cf-title">' + esc(o.title) + "</h3>" +
      (o.text || []).map(function (p) { return '<p class="mt-2">' + esc(p) + "</p>"; }).join("") +
      '<div class="dbtns"><span class="spacer"></span>' +
        '<button type="button" class="btn" id="cf-no">' + esc(o.no || "Annullér") + "</button>" +
        '<button type="button" class="btn ' + (o.danger ? "danger" : "primary") + '" id="cf-yes">' + esc(o.yes) + "</button></div></form>";
    cfDlg.showModal();
    cfDlg.querySelector("#cf-no").focus();
    cfDlg.querySelector("#cf-no").onclick = function () { cfDlg.close(); };
    cfDlg.querySelector("#cf-yes").onclick = function () { cfDlg.close(); yes(); };
  }

  /* ----- Kladde -----
     Ugemte ændringer lå før kun i hukommelsen, så et genindlæst vindue tog dem
     med sig — og en lukket filvælger gjorde det i tavshed. Nu skrives en kladde
     til browseren ved hver ændring og tilbydes gendannet ved næste indlæsning.
     Kladden er en sikkerhedsline, ikke et lager: det gemte i skyen er sandheden. */

  var DRAFT_KEY = "mos-draft";
  var DRAFT = null;

  function saveDraft() {
    // base gemmes med, så en kladde kan flettes ind i nyere data i stedet for at erstatte dem
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ ts: Date.now(), rev: DATA_REV, data: DATA, base: BASE })); } catch (e) {}
  }
  function clearDraft() {
    DRAFT = null;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  }
  function loadDraft() {
    // Kunne data ikke hentes (fx intet net), er der intet at sammenligne
    // med — og kladden må endelig ikke ryddes væk af den grund.
    if (!DATA) return;
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      // Er kladden identisk med det gemte, er der intet at gendanne
      if (d && d.data && JSON.stringify(d.data) !== JSON.stringify(DATA)) DRAFT = d;
      else clearDraft();
    } catch (e) { clearDraft(); }
  }
  function draftAge(ts) {
    var min = Math.round((Date.now() - ts) / 60000);
    if (min < 1) return "for et øjeblik siden";
    if (min < 60) return "for " + min + " minut" + (min === 1 ? "" : "ter") + " siden";
    var h = Math.round(min / 60);
    return "for " + h + " time" + (h === 1 ? "" : "r") + " siden";
  }
  function draftBanner() {
    if (!DRAFT) return "";
    return '<div class="banner banner-warn"><h3>Ugemte ændringer fundet</h3>' +
      "<p>Der ligger ændringer i browseren, som aldrig blev gemt — lavet " +
      esc(draftAge(DRAFT.ts)) + ". De går tabt, hvis du kasserer dem.</p>" +
      (DRAFT.rev !== DATA_REV
        ? (DRAFT.base
            ? "<p class=\"mt-2\">Data er ændret i skyen siden — fx på en anden enhed eller af Claude. " +
              "Gendanner du, flettes dine ændringer ind i de nye, og du bliver spurgt, hvis noget er ændret begge steder.</p>"
            : "<p class=\"mt-2\"><b>Obs:</b> data er ændret i skyen siden — fx på en anden enhed eller af Claude. " +
              "Gendanner og gemmer du, erstatter dine ændringer de nye. Den nuværende version kan altid findes i Historik.</p>")
        : "") +
      '<p class="banner-acts">' +
        '<button class="btn primary" data-act="draftrestore" type="button">Gendan ændringerne</button>' +
        '<button class="btn" data-act="draftdiscard" type="button">Kassér</button></p></div>';
  }

  function markDirty() { dirty = true; saveDraft(); route(); autoSave(); }

  window.addEventListener("beforeunload", function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  /* ====================== Redigering ====================== */

  function slug(s, taken) {
    var b = String(s).toLowerCase()
      .replace(/æ/g, "ae").replace(/ø/g, "oe").replace(/å/g, "aa")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 28) || "ny";
    var id = b, n = 2;
    while (taken.indexOf(id) >= 0) id = b + "-" + (n++);
    return id;
  }

  var dlg = document.getElementById("editor");

  function field(label, html, hint) {
    return '<label class="frow"><span class="flab">' + label + "</span>" + html +
           (hint ? '<span class="fhint">' + hint + "</span>" : "") + "</label>";
  }
  function opts(list, cur) {
    return list.map(function (o) {
      var v = typeof o === "string" ? o : o.v, t = typeof o === "string" ? o : o.t;
      return '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + ">" + esc(t) + "</option>";
    }).join("");
  }

  // onSave/onDelete giver null, en fejltekst eller [felt-id, fejltekst]. Fejlen står i dialogen
  // ved knapperne og markerer feltet (aria-invalid). Sletning sker med det samme og kan fortrydes.
  function openDialog(title, body, onSave, onDelete, deletedLabel) {
    dlg.innerHTML =
      '<form method="dialog" novalidate><h3>' + esc(title) + "</h3>" + body +
      '<p class="ferr" id="d-err" role="alert"></p>' +
      '<div class="dbtns">' +
        (onDelete ? '<button type="button" class="btn danger" id="d-del">Slet</button>' : "") +
        '<span class="spacer"></span>' +
        '<button type="button" class="btn" id="d-cancel">Annullér</button>' +
        '<button type="button" class="btn primary" id="d-ok">Gem</button>' +
      "</div></form>";
    dlg.showModal();
    var first = dlg.querySelector("input,select,textarea");
    if (first) first.focus();

    var showErr = function (err) {
      Array.prototype.forEach.call(dlg.querySelectorAll('[aria-invalid="true"]'), function (f) {
        f.removeAttribute("aria-invalid"); f.removeAttribute("aria-describedby");
      });
      var id = Array.isArray(err) ? err[0] : null, msg = Array.isArray(err) ? err[1] : err;
      dlg.querySelector("#d-err").textContent = msg;
      var f = id && dlg.querySelector("#" + id);
      if (f) { f.setAttribute("aria-invalid", "true"); f.setAttribute("aria-describedby", "d-err"); f.focus(); }
    };
    dlg.querySelector("#d-cancel").onclick = function () { dlg.close(); };
    dlg.querySelector("#d-ok").onclick = function () {
      var err = onSave();
      if (err) { showErr(err); return; }
      dlg.close(); markDirty();
    };
    if (onDelete) dlg.querySelector("#d-del").onclick = function () {
      var before = clone(DATA), cur = CURRENT;
      var err = onDelete();
      if (err) { showErr(err); return; }
      dlg.close(); markDirty();
      flash((deletedLabel || "Det") + " er slettet.", false, { label: "Fortryd", fn: function () {
        DATA = before; CURRENT = cur;
        dirty = !same(DATA, BASE);
        if (dirty) { saveDraft(); autoSave(); } else clearDraft();
        route(); flash("Fortrudt.");
      } });
    };
  }

  function val(id) { var e = dlg.querySelector("#" + id); return e ? e.value.trim() : ""; }

  var FC_WORDS = {
    ok: "når deadline", stramt: "stramt", risiko: "når ikke deadline", over: "over deadline", mangler: "mangler et estimat"
  };
  // Prognosen for én opgave, som en linje i opgavedialogen
  function forecastLine(t) {
    if (!isLive(t)) return "";
    var f = taskForecast(t);
    if (!f) return "";
    var txt;
    if (f.status === "over") txt = "Over deadline (" + fmtDate(f.due) + ").";
    else if (f.status === "mangler") txt = "Sæt timer tilbage, så kan prognosen regne med den.";
    else if (!f.remaining) return "";
    else if (!f.finish) txt = "Der er ikke tid nok de næste 12 uger" + (f.due ? " til deadline " + fmtDate(f.due) : "") + ".";
    else txt = "Færdig ca. " + fmtDate(f.finish) + (f.due ? " · deadline " + fmtDate(f.due) : "") +
               (f.status === "risiko" && f.deficit ? " · mangler ca. " + fmt(f.deficit) + " t" : "") + ".";
    return '<p class="fc-line fc-' + f.status + '"><b>Prognose: ' + FC_WORDS[f.status] + ".</b> " + esc(txt) +
      (f.status === "ok" || f.status === "stramt" || f.status === "risiko"
        ? ' <span class="hint">Regnet ud fra timer tilbage, deadlines og din fri kapacitet pr. uge.</span>' : "") + "</p>";
  }

  function editTask(id, preset) {
    var isNew = !id;
    var t = isNew ? { id: "", project: preset.project, sprint: preset.sprint || "",
                      start: preset.start || preset.sprint || "", end: preset.sprint || "",
                      status: "Ikke startet", title: preset.title || "", owner: "", due: preset.due || "", epic: "", hours: 0, note: preset.note || "",
                      remaining: preset.remaining }
                  : DATA.tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;

    var epicList = [{ v: "", t: "— ingen —" }].concat(Object.keys(DATA.epics || {}).map(function (k) {
      return { v: k, t: k + " — " + DATA.epics[k] };
    }));
    var sprintList = [{ v: "", t: "— ingen sprint —" }].concat(
      DATA.sprints.filter(function (s) { return s.project === t.project; })
        .sort(function (a, b) { return mi(a.month) - mi(b.month); })
        .map(function (s) { return { v: s.month, t: miLabel(mi(s.month), true) }; }));

    openDialog(isNew ? "Ny opgave" : "Rediger opgave",
      field("Titel", '<input id="f-title" type="text" value="' + esc(t.title) + '" maxlength="120">') +
      '<div class="fgrid">' +
        field("Status", '<select id="f-status">' + opts(["Ikke startet","I gang","Blokeret","Færdig","Droppet"], stat(t).label) + "</select>") +
        field("Ejer", '<input id="f-owner" type="text" value="' + esc(t.owner) + '" maxlength="40">') +
      "</div>" +
      '<div class="fgrid">' +
        field("Projekt", '<select id="f-project">' + opts(DATA.projects.map(function (p) {
          return { v: p.id, t: p.kind === "adhoc" ? "Uden projekt" : p.name };
        }), t.project) + "</select>", t.routine ? "fra rutinen „" + esc((routineById(t.routine) || {}).name || t.routine) + "“" : "") +
        field("Sprint", '<select id="f-sprint">' + opts(sprintList, t.sprint) + "</select>") +
      "</div>" +
      '<div class="fgrid">' +
        field("Starter", '<input id="f-start" type="month" value="' + esc(t.start) + '">') +
        field("Slutter", '<input id="f-end" type="month" value="' + esc(t.end) + '">') +
      "</div>" +
      '<div class="fgrid">' +
        field("Deadline", '<input id="f-due" type="date" value="' + esc(t.due) + '">', "valgfri — tegner en diamant på tidslinjen") +
        field("Epic", '<select id="f-epic">' + opts(epicList, t.epic) + "</select>") +
      "</div>" +
      '<div class="fgrid">' +
        field("Timer pr. uge", '<input id="f-hours" type="number" min="0" max="40" step="0.5" value="' + num(t.hours) + '">',
              "lige nu — 0 hvis den ikke trækker tid i denne uge") +
        field("Timer tilbage i alt", '<input id="f-remaining" type="number" min="0" max="2000" step="0.5" value="' + (t.remaining == null || t.remaining === "" ? "" : num(t.remaining)) + '" placeholder="fx 12">',
              "estimat — bruges til prognosen") +
      "</div>" +
      field("Prioritet", '<select id="f-priority">' + opts(FC.PRIORITIES.map(function (p) { return { v: p, t: p.charAt(0).toUpperCase() + p.slice(1) }; }), t.priority || "normal") + "</select>",
            "afgør rækkefølgen, når to opgaver har samme deadline") +
      (isNew ? "" : forecastLine(t)) +
      field("Note", '<textarea id="f-note" rows="3" maxlength="400">' + esc(t.note) + "</textarea>") +
      (!isNew && Array.isArray(t.comments) && t.comments.length ? '<div class="frow"><span class="flab">Kommentarer</span><div class="tcomments">' +
        t.comments.slice().reverse().map(function (c) {
          return '<p class="tcom"><span class="tcom-hd"><b>' + esc(c.by) + "</b> · " +
            esc(new Date(c.at).toLocaleString("da-DK", { dateStyle: "medium", timeStyle: "short" })) + "</span>" + esc(c.text) + "</p>";
        }).join("") + "</div></div>" : "") +
      (isNew ? "" : '<div class="cbox" id="cbox" data-id="' + esc(t.id) + '">' + studioBox(t) + "</div>"),

      function () {
        var title = val("f-title");
        if (!title) return ["f-title", "Opgaven skal have en titel."];
        var start = val("f-start"), end = val("f-end"), sprint = val("f-sprint");
        if (!start && !sprint) return ["f-start", "Opgaven skal have enten en startmåned eller en sprint — ellers kan den ikke placeres på tidslinjen."];
        if (start && end && mi(end) < mi(start)) return ["f-end", "Slutmåneden ligger før startmåneden."];
        var o = isNew ? {} : t;
        o.title = title; o.status = val("f-status"); o.owner = val("f-owner");
        o.project = val("f-project"); o.sprint = sprint;
        o.start = start; o.end = end; o.due = val("f-due");
        o.epic = val("f-epic"); o.hours = num(val("f-hours")); o.note = val("f-note");
        var rem = val("f-remaining");
        if (rem === "") delete o.remaining; else o.remaining = Math.max(0, num(rem));
        var pr = val("f-priority");
        if (pr && pr !== "normal") o.priority = pr; else delete o.priority;
        if (isNew) {
          o.id = slug(o.project.slice(0, 5) + "-" + title, DATA.tasks.map(function (x) { return x.id; }));
          if (preset.source) o.source = preset.source;   // fx { type: "gmail", id, url } fra Indbakken
          DATA.tasks.push(o);
          if (preset.onCreate) preset.onCreate(o);
        }
        return null;
      },
      isNew ? null : function () {
        DATA.tasks = DATA.tasks.filter(function (x) { return x.id !== t.id; });
        return null;
      }, "„" + t.title + "“");

    // Skifter man projekt, skal sprintlisten følge med
    var ps = dlg.querySelector("#f-project");
    if (ps) ps.onchange = function () {
      var list = [{ v: "", t: "— ingen sprint —" }].concat(
        DATA.sprints.filter(function (s) { return s.project === ps.value; })
          .sort(function (a, b) { return mi(a.month) - mi(b.month); })
          .map(function (s) { return { v: s.month, t: miLabel(mi(s.month), true) }; }));
      dlg.querySelector("#f-sprint").innerHTML = opts(list, "");
    };
  }

  function editProject(id) {
    var isNew = !id;
    var p = isNew ? { id: "", name: "", tagline: "" }
                  : DATA.projects.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var n = isNew ? 0 : tasksOf(p.id).length;

    openDialog(isNew ? "Nyt projekt" : "Rediger projekt",
      field("Navn", '<input id="f-name" type="text" value="' + esc(p.name) + '" maxlength="60">') +
      field("Type", '<select id="f-kind">' + opts(KINDS.map(function (k) {
              return { v: k.key, t: k.label + " — " + k.hint };
            }), KINDMAP[p.kind] ? p.kind : "projekt") + "</select>",
            "afgør hvilken bås projektets timer havner i på kapacitetsforsiden") +
      field("Undertekst", '<textarea id="f-tag" rows="2" maxlength="200">' + esc(p.tagline) + "</textarea>",
            "vises under projektnavnet") +
      field("Farve", '<select id="f-color">' + opts(PCOLORS.map(function (k) { return { v: k, t: PCOLOR_NAMES[k] }; }),
              isNew ? PCOLORS[DATA.projects.filter(isRealProject).length % PCOLORS.length] : projColor(p)) + "</select>",
            "bruges i mærket, i listerne og på tidslinjen"),
      function () {
        var name = val("f-name");
        if (!name) return ["f-name", "Projektet skal have et navn."];
        if (isNew) {
          var np = { id: slug(name, DATA.projects.map(function (x) { return x.id; })),
                     name: name, kind: val("f-kind"), tagline: val("f-tag"), color: val("f-color") };
          DATA.projects.push(np);
          CURRENT = np.id;
        } else { p.name = name; p.kind = val("f-kind"); p.tagline = val("f-tag"); p.color = val("f-color"); }
        return null;
      },
      isNew ? null : function () {
        if (n) return "„" + p.name + "“ har " + n + " opgave" + (n > 1 ? "r" : "") + ". Flyt eller slet dem først.";
        DATA.projects = DATA.projects.filter(function (x) { return x.id !== p.id; });
        DATA.sprints = DATA.sprints.filter(function (x) { return x.project !== p.id; });
        CURRENT = DATA.projects.length ? DATA.projects[0].id : null;
        if (location.hash === "#" + p.id) location.hash = "projekter";
        return null;
      }, "Projektet „" + p.name + "“");
  }

  function editSprint(project, month) {
    var isNew = !month;
    var s = isNew ? { project: project, month: "", goal: "" }
                  : DATA.sprints.filter(function (x) { return x.project === project && x.month === month; })[0];
    if (!s) return;
    var n = isNew ? 0 : DATA.tasks.filter(function (t) { return t.project === project && t.sprint === month; }).length;

    openDialog(isNew ? "Ny sprint" : "Rediger sprint",
      field("Måned", '<input id="f-month" type="month" value="' + esc(s.month) + '">') +
      field("Sprintmål", '<textarea id="f-goal" rows="2" maxlength="200">' + esc(s.goal) + "</textarea>",
            "én sætning om hvad der skal være sandt, når måneden er slut"),
      function () {
        var m = val("f-month");
        if (!m) return ["f-month", "Sprinten skal have en måned."];
        var clash = DATA.sprints.filter(function (x) { return x.project === project && x.month === m && x !== s; });
        if (clash.length) return ["f-month", "Der findes allerede en sprint for " + miLabel(mi(m), true) + "."];
        if (!isNew && s.month !== m) {
          DATA.tasks.forEach(function (t) { if (t.project === project && t.sprint === s.month) t.sprint = m; });
        }
        s.month = m; s.goal = val("f-goal");
        if (isNew) DATA.sprints.push(s);
        return null;
      },
      isNew ? null : function () {
        if (n) return "Sprinten har " + n + " opgave" + (n > 1 ? "r" : "") + ". Flyt dem først.";
        DATA.sprints = DATA.sprints.filter(function (x) { return x !== s; });
        return null;
      }, "Sprinten " + miLabel(mi(s.month), true));
  }

  // Én delegeret lytter — knapper overlever enhver gentegning
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var a = el.getAttribute("data-act");
    if (ottoClick(a, el) || inboxClick(a, el) || planClick(a, el) || tasksClick(a, el)) return;
    if (a === "theme") {
      document.documentElement.setAttribute("data-theme", currentTheme() === "dark" ? "light" : "dark");
      try { localStorage.setItem("mos-theme", currentTheme()); } catch (e2) {}
      el.innerHTML = themeLabel();
      return;
    }
    if (a === "navopen") { navOpen(true); return; }
    if (a === "navmini") { setNavMini(!document.getElementById("app").classList.contains("nav-mini")); return; }
    if (a === "navclose") { navOpen(false); return; }
    if (a === "jump") {
      // Genvejsbjælken er ren scroll i siden. Den må ikke sætte adressen,
      // for hash'en bruges til at vælge projekt — et "#sprint" ville blive
      // læst som et projekt-id, ikke findes, og lande på det første projekt.
      e.preventDefault();
      var sec = document.getElementById(el.getAttribute("data-to"));
      if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (a === "viewreset")  {
      VIEWOPTS = { group: "none", show: "all", sort: "start", epic: "" };
      saveView(); route(); return;
    }
    if (a === "gconnect" && dirty) {
      // Forbindelsen sker på Googles side, så siden forlades et øjeblik: gem først
      e.preventDefault();
      var href = el.getAttribute("href");
      save().then(function () {
        if (dirty) flash("Dine ændringer er ikke gemt endnu, så du bliver her. Prøv igen om lidt.", true);
        else location.href = href;
      });
      return;
    }
    if (a === "gconnect") return;
    if (a === "gdisconnect") {
      askConfirm({ title: "Afbryd " + el.getAttribute("data-email") + "?", yes: "Afbryd kontoen", danger: true,
                   text: ["Møderne fra kontoen forsvinder fra HeyOtto Tasks, og adgangen trækkes tilbage hos Google."] }, function () {
        api("DELETE", "/api/google/accounts/" + encodeURIComponent(el.getAttribute("data-id")), {})
          .then(function () { flash("Kontoen er afbrudt."); return Promise.all([loadGoogle(), loadCalendar()]); })
          .catch(function (err) { flash("Kunne ikke afbryde: " + err.message, true); });
      });
      return;
    }
    if (a === "calrefresh") {
      el.disabled = true;
      api("POST", "/api/calendar/refresh", {})
        .then(function (r) { CAL = r.snapshot; flash(r.note || "Kalenderen er hentet."); route(); return loadGoogle(); })
        .catch(function (err) { flash("Kunne ikke hente kalenderen: " + err.message, true); el.disabled = false; });
      return;
    }
    if (a === "copyuri") { copyText(document.getElementById("g-uri").textContent, "Adressen er kopieret."); return; }
    if (a === "ottoall") { OTTO_ALL = !OTTO_ALL; route(); return; }
    if (a === "pushon")  { enablePush(el); return; }
    if (a === "pushoff") { disablePush(el); return; }
    if (a === "pushtest") { testPush(el); return; }
    if (a === "tokennew") { createApiToken(el); return; }
    if (a === "copytoken") { copyText(NEW_TOKEN, "Tokenet er kopieret."); return; }
    if (a === "tokenrevoke") {
      askConfirm({ title: "Tilbagekald „" + el.getAttribute("data-name") + "“?", yes: "Tilbagekald", danger: true,
                   text: ["Tokenet holder op med at virke med det samme og kan ikke genoplives."] }, function () {
        api("DELETE", "/api/tokens/" + encodeURIComponent(el.getAttribute("data-id")), {})
          .then(function () { flash("Tokenet er tilbagekaldt."); return loadTokens(); })
          .catch(function (err) { flash("Kunne ikke tilbagekalde: " + err.message, true); });
      });
      return;
    }
    if (a === "snooze") {
      var skey = el.getAttribute("data-key");
      var until = FC.localIso(FC.addDays(new Date(), Number(el.getAttribute("data-days")) || 1));
      var before = ALERTSTATE.snoozed[skey];
      ALERTSTATE.snoozed[skey] = until; route();
      flash("Udsat til " + fmtDate(until) + ".");
      api("PUT", "/api/alerts/snooze", { key: skey, until: until }).catch(function (err) {
        if (before) ALERTSTATE.snoozed[skey] = before; else delete ALERTSTATE.snoozed[skey];
        route(); flash("Kunne ikke udsætte: " + err.message, true);
      });
      return;
    }
    // Kalenderoverblikket: visning, ikke data — gør aldrig siden "ugemt"
    if (a === "capview") { CALVIEW.view = el.getAttribute("data-v"); saveCalView(); route(); return; }
    if (a === "calspan") {
      CALVIEW.span = el.getAttribute("data-v");
      // Behold den periode, man kigger på: ugen bliver til dens måned og omvendt
      var an = calAnchor();
      CALVIEW.anchor = CALVIEW.span === "maaned" ? new Date(an.getFullYear(), an.getMonth(), 1)
        : (an.getMonth() === NOW.getMonth() && an.getFullYear() === NOW.getFullYear() ? weekStart(new Date()) : weekStart(an));
      saveCalView(); route(); return;
    }
    if (a === "calnav") {
      var dir = Number(el.getAttribute("data-d")), cur = calAnchor();
      if (!dir) CALVIEW.anchor = null;
      else CALVIEW.anchor = CALVIEW.span === "maaned" ? new Date(cur.getFullYear(), cur.getMonth() + dir, 1) : addDays(cur, 7 * dir);
      route(); return;
    }
    if (a === "calday") {
      CALVIEW.span = "uge"; CALVIEW.anchor = weekStart(dateOnly(el.getAttribute("data-date")));
      saveCalView(); route(); return;
    }
    if (a === "calevent") { var ev = CAL_EVENTS[Number(el.getAttribute("data-ev"))]; if (ev) showEvent(ev); return; }
    if (a === "meetsrc") {
      DATA.kapacitet.meetingsSource = el.getAttribute("data-v");
      markDirty();
      rerenderSettingsSection("kapacitet");
      return;
    }
    if (a === "draftrestore") {
      var dr = DRAFT;
      var restore = function (theirs) {
        DATA = dr.rev !== DATA_REV && dr.base ? mergeData(dr.base, dr.data, DATA, theirs).data : dr.data;
        DRAFT = null; markDirty();
        flash("Ændringerne er gendannet og gemmes nu.");
      };
      var pre = dr.rev !== DATA_REV && dr.base ? mergeData(dr.base, dr.data, DATA, false) : null;
      if (pre && pre.conflicts.length) askConflicts(pre.conflicts, restore);
      else restore(false);
      return;
    }
    if (a === "draftdiscard") {
      askConfirm({ title: "Kassér de ugemte ændringer?", yes: "Kassér", danger: true, text: ["Det kan ikke fortrydes."] },
                 function () { clearDraft(); route(); });
      return;
    }
    if (a === "proj")       { location.hash = el.getAttribute("data-id"); }
    else if (a === "kapacitet") { location.hash = "kapacitet"; }
    else if (a === "logweek")   {
      var k = isoWeek(new Date());
      if (!DATA.uger) DATA.uger = [];
      if (!DATA.uger.some(function (w) { return w.uge === k; })) {
        DATA.uger.push({ uge: k, drift: 0, projekt: 0, adhoc: 0 });
        markDirty();
      }
    }
    else if (a === "delweek")   {
      var u = el.getAttribute("data-uge");
      DATA.uger = (DATA.uger || []).filter(function (w) { return w.uge !== u; });
      markDirty();
    }
    else if (a === "task")      { editTask(el.getAttribute("data-id")); }
    else if (a === "newtask")   { editTask(null, { project: CURRENT, sprint: el.getAttribute("data-month") || "" }); }
    else if (a === "newproj")   { editProject(null); }
    else if (a === "editproj")  { editProject(CURRENT); }
    else if (a === "newsprint") { editSprint(CURRENT, null); }
    else if (a === "editsprint"){ editSprint(CURRENT, el.getAttribute("data-month")); }
    else if (a === "save")      { save(); }
    else if (a === "settings")  { navOpen(false); openSettings(el.getAttribute("data-section")); }
    else if (a === "settingsclose") { setDlg.close(); }
    else if (a === "logout")    { if (setDlg.open) setDlg.close(); logout(); }
    else if (a === "restore")   { restoreVersion(el.getAttribute("data-id"), el.getAttribute("data-label")); }
    else if (a === "studiosend")   { sendToStudio(el.getAttribute("data-id"), el); }
    else if (a === "studionew")    { forgetStudio(el.getAttribute("data-id")); }
  });

  /* ====================== Send til Studio (M15) ======================
     En opgave kan sendes til HeyOtto Studio (otto.heyotto.win), hvor Studios Otto
     tager den. Serveren (server/studio.mts) sender, holder øje med status og skriver
     Studios svar som kommentar på opgaven. Studio-opgaverne ligger ved siden af
     data, så Gem rører dem ikke. */

  var STUDIO = {};               // opgave-id → Studio-opgaven
  var STUDIO_CONF = null;        // null = ved det ikke endnu
  var STUDIO_APP = "https://studio.heyotto.win";
  var studioTimer = null;

  function studioBusy(r) { return !!r && (r.status === "offline" || r.status === "working" || r.status === "awaiting_approval"); }
  function studioLabel(r) {
    return { "offline": "Studio er offline", "ikke sendt": "Ikke sendt", "ukendt": "Ukendt", "fejl": "Fejl",
             "working": "Studio arbejder", "awaiting_approval": "Venter på dig", "idle": "Svar fra Studio" }[r.status] || r.status;
  }

  // Lille mærke på opgavekortet, så længe Studio har opgaven
  function studioChip(t) {
    var r = STUDIO[t.id];
    if (!r || r.status === "idle") return "";
    var cls = r.status === "awaiting_approval" ? " ready" : r.status === "working" ? "" : " bad";
    return '<div><span class="cchip' + cls + '">' + esc(studioLabel(r)) + "</span></div>";
  }

  // Teksten, Studio får. Den kan rettes, før den sendes.
  function studioText(t) {
    var p = projById(val("f-project") || t.project);
    var title = val("f-title") || t.title, note = val("f-note"), due = val("f-due");
    return title + "\n\n" +
      (note ? note + "\n\n" : "") +
      "Projekt: " + (p ? (p.kind === "adhoc" ? "Uden projekt" : p.name) : "—") + "\n" +
      (due ? "Deadline: " + due + "\n" : "") +
      "Tasks-id " + t.id;
  }

  function studioForm(t, label) {
    return field(label, '<textarea id="f-studio" rows="5" maxlength="20000">' + esc(studioText(t)) + "</textarea>",
                 "Studios Otto får teksten, som den står. Svaret kommer som kommentar på opgaven.") +
      '<button class="btn" type="button" data-act="studiosend" data-id="' + esc(t.id) + '">' + "Send til Studio</button>";
  }

  // Studio-delen af opgavedialogen
  function studioBox(t) {
    var r = STUDIO[t.id];
    var html = '<div class="cb-head">' + "<b>Studio</b>" +
      (r ? '<span class="tag' + (r.status === "awaiting_approval" ? " now" : "") + '">' + esc(studioLabel(r)) + "</span>" : "") + "</div>";

    if (STUDIO_CONF === null) return html + '<p class="hint">Henter …</p>';
    if (STUDIO_CONF === false) {
      return html + '<p class="hint">Studio er ikke forbundet endnu. Lav et token i Studio under <b>Agenter → Integrationer → Adgang udefra</b> ' +
        "med <b>task</b> og <b>read</b>, og læg det i Cloudflare som hemmeligheden <code>HEYOTTO_TOKEN</code> " +
        "(Workers &amp; Pages → heyotto-tasks → Settings → Variables and Secrets → Type: Secret).</p>";
    }
    if (!r) return html + studioForm(t, "Hvad skal Studio gøre?");

    html += '<p class="hint">Sendt ' + esc(DATEFMT.format(new Date(r.sentAt || r.createdAt))) + "</p>";
    if (r.status === "working") {
      html += '<p class="cb-wait"><span class="otto-sm"><img src="otto/arbejder.png" alt=""></span>Studio arbejder på det. Svaret kommer som kommentar på opgaven — du kan godt lukke vinduet imens.</p>';
    } else if (r.status === "awaiting_approval") {
      html += '<p class="cb-wait"><span class="otto-sm"><img src="otto/arbejder.png" alt=""></span>Studio venter på, at du godkender noget.</p>' +
        '<div class="cb-acts"><a class="btn primary" href="' + esc(STUDIO_APP) + '" target="_blank" rel="noopener">Åbn Studio</a></div>';
    } else if (r.status === "offline") {
      html += '<p class="cb-err">' + esc(r.error) + "</p>";
    } else if (r.status === "idle") {
      html += '<p class="cb-wait"><span class="otto-sm"><img src="otto/jubler.png" alt=""></span>Studio er færdig. Svaret står under Kommentarer.</p>' +
        '<div class="cb-acts"><a class="btn" href="' + esc(STUDIO_APP) + '" target="_blank" rel="noopener">Åbn Studio</a>' +
        '<button class="btn" type="button" data-act="studionew" data-id="' + esc(t.id) + '">Send en ny opgave</button></div>';
    } else {
      // ikke sendt, ukendt eller fejl: sig hvorfor, og lad den sendes igen
      html += '<p class="cb-err">' + esc(r.error) + "</p>" + studioForm(t, "Send igen");
    }
    return html;
  }

  // Tegn Studio-delen forfra, hvis dialogen står åben på den opgave. Det, man skriver, bevares.
  function refreshStudioBox(taskId) {
    var box = dlg.open ? dlg.querySelector("#cbox") : null;
    if (!box || box.getAttribute("data-id") !== taskId) return;
    var t = taskById(taskId);
    if (!t) return;
    var typed = dlg.querySelector("#f-studio") ? val("f-studio") : "";
    box.innerHTML = studioBox(t);
    var ta = dlg.querySelector("#f-studio");
    if (ta && typed) ta.value = typed;
  }

  // Studios svar er gemt som kommentar i data på serveren. Hent det, hvis du ikke er midt i noget.
  function pullData() {
    if (dirty) return;
    api("GET", "/api/data").then(function (res) {
      if (dirty) return;
      DATA = res.data; BASE = res.data; DATA_REV = res.rev || "";
      route();
    }, function () {});
  }

  function loadStudio() {
    return api("GET", "/api/studio/tasks").then(function (res) {
      var before = STUDIO;
      STUDIO_CONF = !!res.configured;
      var next = {};
      (res.tasks || []).forEach(function (r) { next[r.taskId] = r; });
      var changed = [], replied = false;
      Object.keys(next).concat(Object.keys(before)).forEach(function (k) {
        var a = before[k], b = next[k];
        if ((a ? a.status + a.checkedAt : "") !== (b ? b.status + b.checkedAt : "") && changed.indexOf(k) < 0) changed.push(k);
        if (a && b && a.status !== "idle" && b.status === "idle") { replied = true; flash("Studio har svaret på „" + b.title + "“."); }
      });
      STUDIO = next;
      if (replied) pullData();
      else if (changed.length) route();
      Object.keys(next).forEach(refreshStudioBox);
      scheduleStudio();
    }, function (e) {
      if (e.status !== 401) scheduleStudio();
    });
  }

  // Så længe Studio har en opgave, kigges der efter nyt hvert 20. sekund — kun mens fanen er synlig.
  function scheduleStudio() {
    clearTimeout(studioTimer);
    if (!Object.keys(STUDIO).some(function (k) { return studioBusy(STUDIO[k]); })) return;
    studioTimer = setTimeout(function () {
      if (document.visibilityState === "visible") loadStudio(); else scheduleStudio();
    }, 20000);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && DATA) loadStudio();
  });

  function sendToStudio(taskId, btn) {
    var t = taskById(taskId);
    if (!t) return;
    var text = val("f-studio");
    if (!text) { flash("Skriv, hvad Studio skal gøre.", true); return; }
    btn.disabled = true;
    api("POST", "/api/studio/tasks", { taskId: taskId, title: val("f-title") || t.title, text: text })
      .then(function (res) {
        var r = res.task;
        STUDIO[taskId] = r;
        if (r.status === "working") flash("Sendt til Studio. Svaret kommer som kommentar på opgaven.");
        else flash(r.error || "Studio fik ikke opgaven.", true);
        refreshStudioBox(taskId);
        route();
        scheduleStudio();
      })
      .catch(function (e) {
        btn.disabled = false;

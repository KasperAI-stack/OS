# HeyOtto Tasks på Netlify (Cloudflare Workers: wrangler.jsonc) — se dashboard/README.md.
#
# Intet byggetrin: appen er én HTML-fil (dashboard/index.html). Al data ligger i
# Netlify Blobs bag netlify/functions/api.mts, som også står for login.
# Adgangskoden sættes som miljøvariablen HEYOTTO_PASSWORD i Netlify.

[build]
  publish = "dashboard"

[functions]
  directory = "netlify/functions"

# Headers (sikkerhed, JavaScript-typen og service workeren) står i dashboard/_headers,
# som både Netlify og Cloudflare Workers læser.

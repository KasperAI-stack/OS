# HeyOtto OS på Netlify — se dashboard/README.md.
#
# Intet byggetrin: appen er én HTML-fil (dashboard/index.html). Al data ligger i
# Netlify Blobs bag netlify/functions/api.mts, som også står for login.
# Adgangskoden sættes som miljøvariablen HEYOTTO_PASSWORD i Netlify.

[build]
  publish = "dashboard"

[functions]
  directory = "netlify/functions"

# Siden må ikke vises inde i andre sider, og browseren må ikke gætte filtyper.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

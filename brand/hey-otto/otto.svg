<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 270" width="240" height="270">
  <defs>
    <radialGradient id="shell" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#EEEEF3"/>
      <stop offset="1" stop-color="#C7C9D6"/>
    </radialGradient>
    <radialGradient id="pod" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFC2D0"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1C24"/>
      <stop offset="1" stop-color="#0F0E13"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset=".4" stop-color="#7C3AED"/>
      <stop offset=".75" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#C084FC"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- skygge -->
  <ellipse cx="120" cy="258" rx="62" ry="8" fill="#7C3AED" opacity=".35" filter="url(#soft)"/>

  <!-- antenne -->
  <rect x="117" y="18" width="6" height="26" rx="3" fill="#C7C9D6"/>
  <circle cx="120" cy="16" r="10" fill="url(#brand)" opacity=".45" filter="url(#glow)"/>
  <circle cx="120" cy="16" r="7.5" fill="url(#brand)"/>
  <circle cx="117.5" cy="13.5" r="2.2" fill="#FFFFFF" opacity=".8"/>

  <!-- arme -->
  <rect x="44" y="190" width="30" height="58" rx="15" fill="url(#pod)"/>
  <rect x="166" y="190" width="30" height="58" rx="15" fill="url(#pod)"/>

  <!-- krop -->
  <rect x="66" y="176" width="108" height="82" rx="34" fill="url(#shell)"/>
  <ellipse cx="120" cy="178" rx="36" ry="9" fill="#D5D7E1"/>
  <rect x="104" y="202" width="32" height="32" rx="9" fill="url(#brand)"/>
  <text x="120" y="224.5" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">AI</text>

  <!-- ører -->
  <circle cx="36" cy="106" r="18" fill="url(#pod)"/>
  <circle cx="204" cy="106" r="18" fill="url(#pod)"/>

  <!-- hoved -->
  <rect x="34" y="38" width="172" height="136" rx="64" fill="url(#shell)"/>
  <!-- visir -->
  <rect x="56" y="64" width="128" height="88" rx="42" fill="url(#visor)"/>
  <path d="M78 74 Q120 62 164 76" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity=".18"/>

  <!-- øjne -->
  <ellipse cx="98" cy="106" rx="11" ry="16" fill="#A855F7" opacity=".8" filter="url(#glow)"/>
  <ellipse cx="142" cy="106" rx="11" ry="16" fill="#A855F7" opacity=".8" filter="url(#glow)"/>
  <ellipse cx="98" cy="106" rx="8" ry="13" fill="url(#eye)"/>
  <ellipse cx="142" cy="106" rx="8" ry="13" fill="url(#eye)"/>
  <!-- smil -->
  <path d="M108 131 Q120 139 132 131" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".85"/>
</svg>

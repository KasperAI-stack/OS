# HeyOtto Tasks: hvert push til main testes og deployes til Cloudflare.
# Kræver to repository-secrets: CLOUDFLARE_API_TOKEN og CLOUDFLARE_ACCOUNT_ID
# (se dashboard/README.md, "Automatisk deploy").
name: Deploy HeyOtto Tasks

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aldrig to deploys på én gang; et nyt push venter på det forrige.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: D1-migreringer
        run: npx wrangler d1 migrations apply heyotto-tasks --remote --env=""
      - name: Deploy
        run: npx wrangler deploy --env=""
